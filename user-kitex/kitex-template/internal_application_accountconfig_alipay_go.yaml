        q := url.Values{{ "{" }}"app_id": {{ "{" }}c.Settings["client_id"]{{ "}" }}, "method": {{ "{" }}method{{ "}" }}, "format": {{ "{" }}"JSON"{{ "}" }}, "charset": {{ "{" }}"utf-8"{{ "}" }}, "sign_type": {{ "{" }}"RSA2"{{ "}" }}, "timestamp": {{ "{" }}time.Now().In(time.FixedZone("CST", 8*3600)).Format("2006-01-02 15:04:05"){{ "}" }}, "version": {{ "{" }}"1.0"{{ "}" }}{{ "}" }}
