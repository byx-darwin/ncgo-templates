# ncgo exported template — internal/base/conf/conf_test.go
# Overrides ncgo's built-in default hertz conf_test.go to add negative tests
# for grpc.authority.service_name/host_ports (Issue #68 — guards against the
# server.go rbacAddr host_ports[0] panic on startup, symmetric with
# the existing grpc.terminal_user guard).
path: internal/base/conf/conf_test.go
update_behavior:
    type: cover
body: |
    package conf

    import (
        "os"
        "path/filepath"
        "testing"

        "gopkg.in/yaml.v3"
    )

    func TestApplyRedisFallbacksUsesTopLevelRedis(t *testing.T) {{ "{" }}
    	cfg := &Config{{ "{" }}
    		Redis:       RedisConfig{{ "{" }}Addrs: []string{{ "{" }}"redis-shared:6379"{{ "}" }}, PoolSize: 20, ClientName: "shared"{{ "}" }},
    		RateLimit:   RateLimitConfig{{ "{" }}Backend: "redis"{{ "}" }},
    		Idempotency: IdempotencyConfig{{ "{" }}Backend: "redis"{{ "}" }},
    		Auth:        AuthConfig{{ "{" }}Signature: SignatureConfig{{ "{" }}Nonce: SignatureNonceConfig{{ "{" }}Enabled: true, Backend: "redis"{{ "}" }}{{ "}" }}{{ "}" }},
    	{{ "}" }}
    	cfg.applyRedisFallbacks()
    	for name, got := range map[string]RedisConfig{{ "{" }}
    		"rate_limit":      cfg.RateLimit.Redis,
    		"idempotency":     cfg.Idempotency.Redis,
    		"signature_nonce": cfg.Auth.Signature.Nonce.Redis,
    	{{ "}" }} {{ "{" }}
    		if len(got.Addrs) != 1 || got.Addrs[0] != "redis-shared:6379" {{ "{" }}
    			t.Fatalf("%s addrs = %v, want shared redis", name, got.Addrs)
    		{{ "}" }}
    		if got.PoolSize != 20 || got.ClientName != "shared" {{ "{" }}
    			t.Fatalf("%s redis fallback = %+v", name, got)
    		{{ "}" }}
    	{{ "}" }}
    {{ "}" }}

    func TestValidateAppliesRedisFallbacks(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.Redis.Addrs = []string{{ "{" }}"redis-top:6379"{{ "}" }}
    	cfg.Redis.PoolSize = 32
    	cfg.RateLimit.Enabled = true
    	cfg.RateLimit.Backend = "redis"
    	cfg.RateLimit.Redis = RedisConfig{{ "{" }}Addrs: []string{{ "{" }}"redis-rate:6379"{{ "}" }}{{ "}" }}
    	if err := cfg.Validate(); err != nil {{ "{" }}
    		t.Fatalf("Validate: %v", err)
    	{{ "}" }}
    	if len(cfg.RateLimit.Redis.Addrs) != 1 || cfg.RateLimit.Redis.Addrs[0] != "redis-rate:6379" {{ "{" }}
    		t.Fatalf("rate_limit addrs = %v, want module override", cfg.RateLimit.Redis.Addrs)
    	{{ "}" }}
    	if cfg.RateLimit.Redis.PoolSize != 32 {{ "{" }}
    		t.Fatalf("rate_limit pool_size = %d, want inherited top-level pool size", cfg.RateLimit.Redis.PoolSize)
    	{{ "}" }}
    {{ "}" }}

    // TestValidate_RequiresAuthorityServiceName and
    // TestValidate_RequiresAuthorityHostPorts are the #68 regression tests:
    // before this fix, an empty grpc.authority.service_name/host_ports
    // passed Validate() and only panicked later in server.go's
    // cfg.GRPC.Authority.HostPorts[0] indexing, matching the guard style
    // already used for grpc.terminal_user.
    func TestValidate_RequiresAuthorityServiceName(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.GRPC.Authority.ServiceName = ""
    	cfg.GRPC.Authority.HostPorts = []string{{ "{" }}"127.0.0.1:8888"{{ "}" }}
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when grpc.authority.service_name is empty")
    	{{ "}" }}
    {{ "}" }}

    func TestValidate_RequiresAuthorityHostPorts(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.GRPC.Authority.ServiceName = "authority"
    	cfg.GRPC.Authority.HostPorts = nil
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when grpc.authority.host_ports is empty, not a later panic")
    	{{ "}" }}
    {{ "}" }}


    // Existing configurations predate grpc.rule_center. Loading them must keep
    // rule management independent of authority while preserving explicit overrides.
    func TestLoadRuleCenterDefaultsAndOverrides(t *testing.T) {{ "{" }}
        for _, tc := range []struct {{ "{" }}
            name string
            section string
            wantService string
            wantAddress string
        {{ "}" }}{{ "{" }}
            {{ "{" }}name: "legacy config", wantService: "rulecenter", wantAddress: "127.0.0.1:8889"{{ "}" }},
            {{ "{" }}name: "custom endpoint", section: "rule_center:\n    host_ports: [rule.internal:18889]\n", wantService: "rulecenter", wantAddress: "rule.internal:18889"{{ "}" }},
            {{ "{" }}name: "custom service", section: "rule_center:\n    service_name: custom-rule-center\n", wantService: "custom-rule-center", wantAddress: "127.0.0.1:8889"{{ "}" }},
            {{ "{" }}name: "full override", section: "rule_center:\n    service_name: custom-rule-center\n    host_ports: [rule.internal:18889]\n", wantService: "custom-rule-center", wantAddress: "rule.internal:18889"{{ "}" }},
        {{ "}" }} {{ "{" }}
            t.Run(tc.name, func(t *testing.T) {{ "{" }}
                source := "env: test\ngrpc:\n  authority:\n    service_name: authority\n    host_ports: [authority.internal:18888]\n  terminal_user:\n    service_name: userservice\n    host_ports: [user.internal:18890]\n  " + tc.section
                path := filepath.Join(t.TempDir(), "conf.yaml")
                if err := os.WriteFile(path, []byte(source), 0o600); err != nil {{ "{" }}
                    t.Fatal(err)
                {{ "}" }}
                cfg, err := Load(path)
                if err != nil {{ "{" }}
                    t.Fatalf("Load: %v", err)
                {{ "}" }}
                // Read the public YAML shape so this regression also fails against
                // templates that have not added RuleCenter to GRPCConfig yet.
                payload, err := yaml.Marshal(cfg)
                if err != nil {{ "{" }} t.Fatal(err) {{ "}" }}
                var got struct {{ "{" }} GRPC struct {{ "{" }} RuleCenter ClientConfig `yaml:"rule_center"` {{ "}" }} `yaml:"grpc"` {{ "}" }}
                if err := yaml.Unmarshal(payload, &got); err != nil {{ "{" }} t.Fatal(err) {{ "}" }}
                actual := got.GRPC.RuleCenter
                if actual.ServiceName != tc.wantService || len(actual.HostPorts) != 1 || actual.HostPorts[0] != tc.wantAddress {{ "{" }}
                    t.Fatalf("grpc.rule_center = %+v, want service %q at %q", actual, tc.wantService, tc.wantAddress)
                {{ "}" }}
                if cfg.GRPC.Authority.HostPorts[0] != "authority.internal:18888" {{ "{" }}
                    t.Fatalf("authority endpoint changed: %v", cfg.GRPC.Authority.HostPorts)
                {{ "}" }}
            {{ "}" }})
        {{ "}" }}
    {{ "}" }}

    func TestPasswordChangeOnlyRateLimitPhaseCanStart(t *testing.T) {{ "{" }}
     cfg := Default()
     cfg.RateLimit.Enabled = true
     cfg.RateLimit.PasswordChange = cfg.RateLimit.PreAuth
     cfg.RateLimit.PasswordChange.Enabled = true
     cfg.RateLimit.PreAuth.Enabled = false
     cfg.RateLimit.PostAuth.Enabled = false
     if err := cfg.Validate(); err != nil {{ "{" }} t.Fatalf("password-change-only limiter rejected: %v", err) {{ "}" }}
     cfg.RateLimit.PasswordChange.DefaultRule.KeyBy = nil
     if err := cfg.Validate(); err == nil {{ "{" }} t.Fatal("invalid password-change limiter was not validated") {{ "}" }}
    {{ "}" }}
