# ncgo exported template — internal/base/conf/conf_test.go
# Overrides ncgo's built-in default hertz conf_test.go, which asserts on
# fields (and a Redis-fallback set) this package's trimmed Config doesn't
# have in the same shape (no Database, different OAuth-specific sections).
# Adapted to test the fields this Config actually has, including the
# OAuthCode.Redis fallback the default test doesn't know about, and negative
# tests for the rpc.user_service.service_name and rpc.{user_service,
# rule_center}.host_ports requirements (the latter guard against the
# server.go host_ports[0] panic on startup).
path: internal/base/conf/conf_test.go
update_behavior:
    type: cover
body: |
    package conf

    import "testing"

    func TestApplyRedisFallbacksUsesTopLevelRedis(t *testing.T) {{ "{" }}
    	cfg := &Config{{ "{" }}
    		Redis:       RedisConfig{{ "{" }}Addrs: []string{{ "{" }}"redis-shared:6379"{{ "}" }}, PoolSize: 20, ClientName: "shared"{{ "}" }},
    		RateLimit:   RateLimitConfig{{ "{" }}Backend: "redis"{{ "}" }},
    		Idempotency: IdempotencyConfig{{ "{" }}Backend: "redis"{{ "}" }},
    		OAuthCode:   OAuthCodeConfig{{ "{" }}{{ "}" }},
    	{{ "}" }}
    	cfg.applyRedisFallbacks()
    	for name, got := range map[string]RedisConfig{{ "{" }}
    		"rate_limit":  cfg.RateLimit.Redis,
    		"idempotency": cfg.Idempotency.Redis,
    		"oauth_code":  cfg.OAuthCode.Redis,
    	{{ "}" }} {{ "{" }}
    		if len(got.Addrs) != 1 || got.Addrs[0] != "redis-shared:6379" {{ "{" }}
    			t.Fatalf("%s addrs = %v, want shared redis", name, got.Addrs)
    		{{ "}" }}
    		if got.PoolSize != 20 || got.ClientName != "shared" {{ "{" }}
    			t.Fatalf("%s redis fallback = %+v", name, got)
    		{{ "}" }}
    	{{ "}" }}
    {{ "}" }}

    func TestValidateAppliesRedisFallbacks(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.RPC.UserService.ServiceName = "userservice"
    	cfg.RPC.UserService.HostPorts = []string{{ "{" }}"127.0.0.1:8001"{{ "}" }}
    	cfg.RPC.RuleCenter.HostPorts = []string{{ "{" }}"127.0.0.1:8002"{{ "}" }}
    	cfg.OAuthRedirect = OAuthRedirectConfig{{ "{" }}SuccessURL: "http://localhost/cb", BindSuccessURL: "http://localhost/bind", ErrorURL: "http://localhost/err"{{ "}" }}
    	cfg.Redis.Addrs = []string{{ "{" }}"redis-top:6379"{{ "}" }}
    	cfg.Redis.PoolSize = 32
    	cfg.RateLimit.Enabled = true
    	cfg.RateLimit.Backend = "redis"
    	cfg.RateLimit.Redis = RedisConfig{{ "{" }}Addrs: []string{{ "{" }}"redis-rate:6379"{{ "}" }}{{ "}" }}
    	if err := cfg.Validate(); err != nil {{ "{" }}
    		t.Fatalf("Validate: %v", err)
    	{{ "}" }}
    	if len(cfg.RateLimit.Redis.Addrs) != 1 || cfg.RateLimit.Redis.Addrs[0] != "redis-rate:6379" {{ "{" }}
    		t.Fatalf("rate_limit addrs = %v, want module override", cfg.RateLimit.Redis.Addrs)
    	{{ "}" }}
    	if cfg.RateLimit.Redis.PoolSize != 32 {{ "{" }}
    		t.Fatalf("rate_limit pool_size = %d, want inherited top-level pool size", cfg.RateLimit.Redis.PoolSize)
    	{{ "}" }}
    {{ "}" }}

    func TestValidate_RequiresOAuthRedirectURLs(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.RPC.UserService.ServiceName = "userservice"
    	cfg.RPC.UserService.HostPorts = []string{{ "{" }}"127.0.0.1:8001"{{ "}" }}
    	cfg.RPC.RuleCenter.HostPorts = []string{{ "{" }}"127.0.0.1:8002"{{ "}" }}
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when oauth_redirect URLs are unset")
    	{{ "}" }}
    {{ "}" }}

    func TestValidate_RequiresTokenSigningKeyWhenEnabled(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.RPC.UserService.ServiceName = "userservice"
    	cfg.RPC.UserService.HostPorts = []string{{ "{" }}"127.0.0.1:8001"{{ "}" }}
    	cfg.RPC.RuleCenter.HostPorts = []string{{ "{" }}"127.0.0.1:8002"{{ "}" }}
    	cfg.OAuthRedirect = OAuthRedirectConfig{{ "{" }}SuccessURL: "http://localhost/cb", BindSuccessURL: "http://localhost/bind", ErrorURL: "http://localhost/err"{{ "}" }}
    	cfg.Auth.Token.Enabled = true
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when auth.token.enabled but signing_key is empty")
    	{{ "}" }}
    {{ "}" }}

    func TestValidate_RequiresUserServiceName(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.RPC.UserService.ServiceName = ""
    	cfg.RPC.UserService.HostPorts = []string{{ "{" }}"127.0.0.1:8001"{{ "}" }}
    	cfg.RPC.RuleCenter.HostPorts = []string{{ "{" }}"127.0.0.1:8002"{{ "}" }}
    	cfg.OAuthRedirect = OAuthRedirectConfig{{ "{" }}SuccessURL: "http://localhost/cb", BindSuccessURL: "http://localhost/bind", ErrorURL: "http://localhost/err"{{ "}" }}
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when rpc.user_service.service_name is empty")
    	{{ "}" }}
    {{ "}" }}

    func TestValidate_RequiresUserServiceHostPorts(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.RPC.UserService.ServiceName = "userservice"
    	cfg.RPC.RuleCenter.HostPorts = []string{{ "{" }}"127.0.0.1:8002"{{ "}" }}
    	cfg.OAuthRedirect = OAuthRedirectConfig{{ "{" }}SuccessURL: "http://localhost/cb", BindSuccessURL: "http://localhost/bind", ErrorURL: "http://localhost/err"{{ "}" }}
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when rpc.user_service.host_ports is empty, not a later panic")
    	{{ "}" }}
    {{ "}" }}

    func TestValidate_RequiresRuleCenterHostPorts(t *testing.T) {{ "{" }}
    	cfg := Default()
    	cfg.RPC.UserService.ServiceName = "userservice"
    	cfg.RPC.UserService.HostPorts = []string{{ "{" }}"127.0.0.1:8001"{{ "}" }}
    	cfg.OAuthRedirect = OAuthRedirectConfig{{ "{" }}SuccessURL: "http://localhost/cb", BindSuccessURL: "http://localhost/bind", ErrorURL: "http://localhost/err"{{ "}" }}
    	if err := cfg.Validate(); err == nil {{ "{" }}
    		t.Fatal("expected error when rpc.rule_center.host_ports is empty, not a later panic")
    	{{ "}" }}
    {{ "}" }}

