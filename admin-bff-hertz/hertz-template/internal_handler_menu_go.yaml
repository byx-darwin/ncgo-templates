# ncgo exported template — internal/handler/menu.go
path: internal/handler/menu.go
update_behavior:
    type: skip
loop_service: true
body: |
    package handler

    import (
    	"context"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/response"
    	api "github.com/test/admin/services/rbac/kitex_gen/api/rbac/v1"
    	"github.com/test/admin/services/rbac/kitex_gen/api/rbac/v1/rbacservice"
    )

    type MenuHandler struct {{ "{" }}
    	rbacCli rbacservice.Client
    {{ "}" }}

    func NewMenuHandler(rbacCli rbacservice.Client) *MenuHandler {{ "{" }}
    	return &MenuHandler{{ "{" }}rbacCli: rbacCli{{ "}" }}
    {{ "}" }}

    func (h *MenuHandler) List(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	resp, err := h.rbacCli.ListMenus(ctx, &api.ListMenusRequest{{ "{" }}{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}
    	response.OK(c, resp.Menus)
    {{ "}" }}
