    // New requires a deployment-supplied decoded 32-byte key; invalid keys fail closed.
    // Private endpoints are only available when the server explicitly opts into a local/development/test environment.
    func New(pool *pgxpool.Pool, environment string, encryptionKey []byte) *Manager {{ "{" }}
        m := &Manager{{ "{" }}pool: pool, environment: strings.TrimSpace(environment){{ "}" }}
        if m.environment == "" {{ "{" }}
            m.initErr = errors.New("account environment is required")
        {{ "}" }}
        if len(encryptionKey) != 32 {{ "{" }}
            m.initErr = errors.New("account configuration requires a 32-byte deployment key")
        {{ "}" }} else {{ "{" }}
            block, err := aes.NewCipher(encryptionKey)
            if err == nil {{ "{" }}
                m.aead, err = cipher.NewGCM(block)
            {{ "}" }}
            if err != nil {{ "{" }}
                m.initErr = errors.New("account configuration encryption initialization failed")
            {{ "}" }}
        {{ "}" }}
        m.allowPrivate = (environment == "development" || environment == "test" || environment == "local") && os.Getenv("ACCOUNT_PROVIDER_ALLOW_PRIVATE_ENDPOINTS") == "1"
        m.http = m.newHTTPClient()
        return m
    {{ "}" }}
    func randomID() string {{ "{" }}
        var b [16]byte
        if _, err := rand.Read(b[:]); err != nil {{ "{" }}
            return ""
        {{ "}" }}
        return hex.EncodeToString(b[:])
    {{ "}" }}
    func (m *Manager) ready() error {{ "{" }}
        if m.initErr != nil {{ "{" }}
            return m.initErr
        {{ "}" }}
        if m.pool == nil {{ "{" }}
            return errors.New("account configuration storage is unavailable")
        {{ "}" }}
        return nil
    {{ "}" }}
    func (m *Manager) encrypt(c Config) ([]byte, error) {{ "{" }}
        if m.initErr != nil {{ "{" }}
            return nil, m.initErr
        {{ "}" }}
        if m.aead == nil {{ "{" }}
            return nil, errors.New("account configuration key is unavailable")
        {{ "}" }}
        if len(c.Secret) == 0 {{ "{" }}
            return nil, nil
        {{ "}" }}
        raw, err := json.Marshal(c.Secret)
        if err != nil {{ "{" }}
            return nil, errors.New("invalid provider credentials")
        {{ "}" }}
        nonce := make([]byte, m.aead.NonceSize())
        if _, err = rand.Read(nonce); err != nil {{ "{" }}
            return nil, errors.New("credential encryption failed")
        {{ "}" }}
        return m.aead.Seal(nonce, nonce, raw, []byte(c.Environment+"\x00"+c.ID)), nil
    {{ "}" }}
    func (m *Manager) decrypt(c Config, encrypted []byte) (map[string]string, error) {{ "{" }}
        if m.initErr != nil {{ "{" }}
            return nil, m.initErr
        {{ "}" }}
        if m.aead == nil {{ "{" }}
            return nil, errors.New("account configuration key is unavailable")
        {{ "}" }}
        if len(encrypted) == 0 {{ "{" }}
            return map[string]string{{ "{" }}{{ "}" }}, nil
        {{ "}" }}
        n := m.aead.NonceSize()
        if len(encrypted) < n {{ "{" }}
            return nil, errors.New("invalid encrypted provider credentials")
        {{ "}" }}
        raw, err := m.aead.Open(nil, encrypted[:n], encrypted[n:], []byte(c.Environment+"\x00"+c.ID))
        if err != nil {{ "{" }}
            return nil, errors.New("cannot decrypt provider credentials")
        {{ "}" }}
        var secret map[string]string
        if json.Unmarshal(raw, &secret) != nil {{ "{" }}
            return nil, errors.New("invalid encrypted provider credentials")
        {{ "}" }}
        return secret, nil
    {{ "}" }}
    func redact(c Config) Config {{ "{" }}
        c.HasSecret = len(c.Secret) > 0 || c.HasSecret
        c.Secret = nil
        return c
    {{ "}" }}
