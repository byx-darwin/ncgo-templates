        ctx, c := newTerminalUserTestCtx()
        req := protocol.NewRequest("POST", "/terminal-users/u1/reset-password", nil)
        req.SetBody([]byte(`{{ "{" }}"new_password":"newpassword123"{{ "}" }}`))
        req.CopyTo(&c.Request)
        c.Params = append(c.Params, param.Param{{ "{" }}Key: "uid", Value: "u1"{{ "}" }})
        h.ResetPassword(ctx, c)
        if c.Response.StatusCode() != 200 {{ "{" }}
            t.Fatalf("status = %d, want 200: %s", c.Response.StatusCode(), c.Response.Body())
        {{ "}" }}
        var body struct {{ "{" }}
            Data struct {{ "{" }}
                Status string `json:"status"`
            {{ "}" }} `json:"data"`
        {{ "}" }}
        if err := json.Unmarshal(c.Response.Body(), &body); err != nil {{ "{" }}
            t.Fatalf("failed to unmarshal response body %q: %v", c.Response.Body(), err)
        {{ "}" }}
        if body.Data.Status != "password_reset" {{ "{" }}
            t.Fatalf("status = %q, want %q", body.Data.Status, "password_reset")
        {{ "}" }}
    {{ "}" }}

