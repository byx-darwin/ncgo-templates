            h := func(key []byte, s string) []byte {{ "{" }}
                m := hmac.New(sha256.New, key)
                m.Write([]byte(s))
                return m.Sum(nil)
            {{ "}" }}
            timestamp := r.Header.Get("X-TC-Timestamp")
            ts, _ := time.Parse(time.RFC3339, r.Header.Get("X-Test-Time"))
