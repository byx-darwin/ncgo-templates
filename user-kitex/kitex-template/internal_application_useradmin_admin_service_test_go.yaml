# ncgo exported template — internal/application/useradmin/admin_service_test.go
path: internal/application/useradmin/admin_service_test.go
update_behavior:
    type: cover
body: |-
    package useradminsvc

    import (
    	"context"
    	"testing"

    	"github.com/google/uuid"

    	"{{.Module}}/internal/domain/user"
    	"{{.Module}}/internal/infrastructure/audit"
    )

    type fakeRepo struct {{ "{" }}
    	users     map[user.ID]*user.User
    	lastLimit int32
    {{ "}" }}

    func (r *fakeRepo) Create(ctx context.Context, u *user.User) error {{ "{" }} r.users[u.ID] = u; return nil {{ "}" }}
    func (r *fakeRepo) GetByID(ctx context.Context, id user.ID) (*user.User, error) {{ "{" }}
    	if u, ok := r.users[id]; ok {{ "{" }}
    		return u, nil
    	{{ "}" }}
    	return nil, user.ErrNotFound
    {{ "}" }}
    func (r *fakeRepo) GetByUsername(ctx context.Context, username string) (*user.User, error) {{ "{" }} return nil, user.ErrNotFound {{ "}" }}
    func (r *fakeRepo) UpdateStatus(ctx context.Context, id user.ID, status int) error {{ "{" }} r.users[id].Status = status; return nil {{ "}" }}
    func (r *fakeRepo) UpdatePassword(ctx context.Context, id user.ID, hash string) error {{ "{" }} return nil {{ "}" }}
    func (r *fakeRepo) List(ctx context.Context, limit, offset int32) ([]*user.User, error) {{ "{" }}
    	r.lastLimit = limit
    	out := make([]*user.User, 0, len(r.users))
    	for _, u := range r.users {{ "{" }}
    		out = append(out, u)
    	{{ "}" }}
    	return out, nil
    {{ "}" }}
    func (r *fakeRepo) Count(ctx context.Context) (int64, error) {{ "{" }} return int64(len(r.users)), nil {{ "}" }}
    func (r *fakeRepo) CreateIdentity(ctx context.Context, i *user.Identity) error {{ "{" }} return nil {{ "}" }}
    func (r *fakeRepo) GetIdentityByProvider(ctx context.Context, provider, providerUserID string) (*user.Identity, error) {{ "{" }}
    	return nil, user.ErrNotFound
    {{ "}" }}
    func (r *fakeRepo) ListIdentitiesByUserID(ctx context.Context, userID user.ID) ([]*user.Identity, error) {{ "{" }}
    	return []*user.Identity{{ "{" }}{{ "{" }}Provider: "github", ProviderUserID: "42"{{ "}" }}{{ "}" }}, nil
    {{ "}" }}
    func (r *fakeRepo) DeleteIdentity(ctx context.Context, userID user.ID, provider string) error {{ "{" }} return nil {{ "}" }}

    type fakeBlacklist struct {{ "{" }} revoked []string {{ "}" }}

    func (b *fakeBlacklist) Revoke(ctx context.Context, uid string) error {{ "{" }}
    	b.revoked = append(b.revoked, uid)
    	return nil
    {{ "}" }}

    type fakePasswordSetter struct {{ "{" }}
    	calls []string // uid+":"+newPassword
    {{ "}" }}

    func (f *fakePasswordSetter) SetPasswordForAdmin(ctx context.Context, uid, newPassword string) error {{ "{" }}
    	f.calls = append(f.calls, uid+":"+newPassword)
    	return nil
    {{ "}" }}

    func TestBanUser_And_ForceLogout(t *testing.T) {{ "{" }}
    	id, _ := uuid.NewV7()
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}id: {{ "{" }}ID: id, Status: user.StatusEnabled{{ "}" }}{{ "}" }}{{ "}" }}
    	bl := &fakeBlacklist{{ "{" }}{{ "}" }}
    	aw := audit.NewMemoryWriter()
    	svc := New(repo, bl, aw, &fakePasswordSetter{{ "{" }}{{ "}" }})
    	ctx := context.Background()

    	if err := svc.BanUser(ctx, id.String(), "admin-1"); err != nil {{ "{" }}
    		t.Fatalf("ban: %v", err)
    	{{ "}" }}
    	if repo.users[id].Status != user.StatusBanned {{ "{" }}
    		t.Fatal("expected status banned")
    	{{ "}" }}

    	if err := svc.ForceLogout(ctx, id.String(), "admin-1"); err != nil {{ "{" }}
    		t.Fatalf("force logout: %v", err)
    	{{ "}" }}
    	if len(bl.revoked) != 1 || bl.revoked[0] != id.String() {{ "{" }}
    		t.Fatalf("expected uid revoked, got %v", bl.revoked)
    	{{ "}" }}

    	entries := aw.Entries()
    	if len(entries) != 2 || entries[0].Action != "user.ban" || entries[1].Action != "user.force_logout" {{ "{" }}
    		t.Fatalf("expected audit entries user.ban then user.force_logout, got %+v", entries)
    	{{ "}" }}
    	for i, e := range entries {{ "{" }}
    		if e.ActorUID != "admin-1" {{ "{" }}
    			t.Fatalf("entry %d: expected actor=admin-1 (the operator), got %+v", i, e)
    		{{ "}" }}
    		if e.Target != id.String() {{ "{" }}
    			t.Fatalf("entry %d: expected target=%s (the affected user), got %+v", i, id.String(), e)
    		{{ "}" }}
    	{{ "}" }}
    {{ "}" }}

    // TestBanUser_EmptyOperator_AttributesToTarget pins the fallback for callers
    // that don't supply an operator uid: rather than an empty actor_uid, the
    // entry is attributed to the target, matching pre-operator_uid behaviour.
    func TestBanUser_EmptyOperator_AttributesToTarget(t *testing.T) {{ "{" }}
    	id, _ := uuid.NewV7()
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}id: {{ "{" }}ID: id, Status: user.StatusEnabled{{ "}" }}{{ "}" }}{{ "}" }}
    	aw := audit.NewMemoryWriter()
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, aw, &fakePasswordSetter{{ "{" }}{{ "}" }})

    	if err := svc.BanUser(context.Background(), id.String(), ""); err != nil {{ "{" }}
    		t.Fatalf("ban: %v", err)
    	{{ "}" }}
    	entries := aw.Entries()
    	if len(entries) != 1 || entries[0].Action != "user.ban" {{ "{" }}
    		t.Fatalf("expected 1 audit entry action=user.ban, got %+v", entries)
    	{{ "}" }}
    	if entries[0].ActorUID != id.String() || entries[0].Target != id.String() {{ "{" }}
    		t.Fatalf("expected actor and target both %s, got %+v", id.String(), entries[0])
    	{{ "}" }}
    {{ "}" }}

    func TestUnbanUser_WritesAuditEntry(t *testing.T) {{ "{" }}
    	id, _ := uuid.NewV7()
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}id: {{ "{" }}ID: id, Status: user.StatusBanned{{ "}" }}{{ "}" }}{{ "}" }}
    	aw := audit.NewMemoryWriter()
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, aw, &fakePasswordSetter{{ "{" }}{{ "}" }})

    	if err := svc.UnbanUser(context.Background(), id.String(), "admin-1"); err != nil {{ "{" }}
    		t.Fatalf("unban: %v", err)
    	{{ "}" }}
    	if repo.users[id].Status != user.StatusEnabled {{ "{" }}
    		t.Fatal("expected status enabled")
    	{{ "}" }}
    	entries := aw.Entries()
    	if len(entries) != 1 || entries[0].Action != "user.unban" {{ "{" }}
    		t.Fatalf("expected 1 audit entry action=user.unban, got %+v", entries)
    	{{ "}" }}
    	if entries[0].ActorUID != "admin-1" || entries[0].Target != id.String() {{ "{" }}
    		t.Fatalf("expected actor=admin-1 target=%s, got %+v", id.String(), entries[0])
    	{{ "}" }}
    {{ "}" }}

    func TestResetPassword_DelegatesToSharedSetter(t *testing.T) {{ "{" }}
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}{{ "}" }}{{ "}" }}
    	ps := &fakePasswordSetter{{ "{" }}{{ "}" }}
    	aw := audit.NewMemoryWriter()
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, aw, ps)

    	if err := svc.ResetPassword(context.Background(), "u1", "new-password-1"); err != nil {{ "{" }}
    		t.Fatalf("expected success, got error: %v", err)
    	{{ "}" }}
    	if len(ps.calls) != 1 || ps.calls[0] != "u1:new-password-1" {{ "{" }}
    		t.Fatalf("expected SetPasswordForAdmin called once with u1:new-password-1, got %v", ps.calls)
    	{{ "}" }}
    	if len(aw.Entries()) != 0 {{ "{" }}
    		t.Fatalf("expected ResetPassword to not itself write an audit entry, got %+v", aw.Entries())
    	{{ "}" }}
    {{ "}" }}

    func TestListUserIdentities(t *testing.T) {{ "{" }}
    	id, _ := uuid.NewV7()
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}id: {{ "{" }}ID: id{{ "}" }}{{ "}" }}{{ "}" }}
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, audit.NewMemoryWriter(), &fakePasswordSetter{{ "{" }}{{ "}" }})

    	ids, err := svc.ListUserIdentities(context.Background(), id.String())
    	if err != nil {{ "{" }}
    		t.Fatalf("list identities: %v", err)
    	{{ "}" }}
    	if len(ids) != 1 || ids[0].Provider != "github" {{ "{" }}
    		t.Fatalf("unexpected identities: %+v", ids)
    	{{ "}" }}
    {{ "}" }}

    func TestGetUser_ReturnsDTO(t *testing.T) {{ "{" }}
    	id, _ := uuid.NewV7()
    	username := "alice"
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}id: {{ "{" }}ID: id, Username: &username, Nickname: "Alice", Status: user.StatusEnabled{{ "}" }}{{ "}" }}{{ "}" }}
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, audit.NewMemoryWriter(), &fakePasswordSetter{{ "{" }}{{ "}" }})

    	dto, err := svc.GetUser(context.Background(), id.String())
    	if err != nil {{ "{" }}
    		t.Fatalf("get user: %v", err)
    	{{ "}" }}
    	if dto.Uid != id.String() || dto.Username != "alice" || dto.Nickname != "Alice" || dto.Status != user.StatusEnabled {{ "{" }}
    		t.Fatalf("unexpected dto: %+v", dto)
    	{{ "}" }}
    {{ "}" }}

    func TestGetUser_NotFound_ReturnsError(t *testing.T) {{ "{" }}
    	id, _ := uuid.NewV7()
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}{{ "}" }}{{ "}" }}
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, audit.NewMemoryWriter(), &fakePasswordSetter{{ "{" }}{{ "}" }})

    	if _, err := svc.GetUser(context.Background(), id.String()); err == nil {{ "{" }}
    		t.Fatal("expected error for missing user")
    	{{ "}" }}
    {{ "}" }}

    func TestListUsers_ClampsLimit(t *testing.T) {{ "{" }}
    	repo := &fakeRepo{{ "{" }}users: map[user.ID]*user.User{{ "{" }}{{ "}" }}{{ "}" }}
    	svc := New(repo, &fakeBlacklist{{ "{" }}{{ "}" }}, audit.NewMemoryWriter(), &fakePasswordSetter{{ "{" }}{{ "}" }})
    	ctx := context.Background()

    	if _, err := svc.ListUsers(ctx, ListUsersInput{{ "{" }}Limit: 10000{{ "}" }}); err != nil {{ "{" }}
    		t.Fatalf("list users: %v", err)
    	{{ "}" }}
    	if repo.lastLimit != 100 {{ "{" }}
    		t.Fatalf("expected limit clamped to 100, got %d", repo.lastLimit)
    	{{ "}" }}

    	if _, err := svc.ListUsers(ctx, ListUsersInput{{ "{" }}Limit: 0{{ "}" }}); err != nil {{ "{" }}
    		t.Fatalf("list users: %v", err)
    	{{ "}" }}
    	if repo.lastLimit != 20 {{ "{" }}
    		t.Fatalf("expected default limit 20, got %d", repo.lastLimit)
    	{{ "}" }}
    {{ "}" }}
