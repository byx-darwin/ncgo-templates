syntax = "proto3";

package api.user.v1;

option go_package = "{{.Module}}/kitex_gen/api/user/v1";

message RegisterReq {
  string username = 1;
  string password = 2;
}
message RegisterResp {
  string uid = 1;
}

message LoginReq {
  string username = 1;
  string password = 2;
  // client_ip/user_agent are optional (empty string = unknown). The calling
  // BFF populates them from the original end-user's HTTP request when
  // available; they land in the audit trail's promoted ip_address/user_agent
  // columns so login auditing can be filtered by those two dimensions.
  string client_ip = 3;
  string user_agent = 4;
}
message LoginResp {
  string uid = 1;
  string token = 2;
}

message OAuthStartReq {
  string provider = 1;
  // purpose distinguishes a login-flow start ("login") from a bind-flow
  // start ("bind"); the resulting state token is tagged with it and the
  // matching callback (OAuthCallback for "login", BindProvider for "bind")
  // rejects the state if the purpose (or provider) doesn't match. Defaults
  // to "login" when empty.
  string purpose = 2;
  // uid is the already-authenticated user starting a bind flow. Required
  // when purpose == "bind" (OAuthStart rejects a bind request with an
  // empty uid); ignored when purpose == "login". The caller (a BFF/gateway)
  // MUST populate this only from a verified JWT, never from unauthenticated
  // client input.
  string uid = 3;
}
message OAuthStartResp {
  string redirect_url = 1;
}

message OAuthCallbackReq {
  string provider = 1;
  string state = 2;
  string code = 3;
}
message OAuthCallbackResp {
  string uid = 1;
  string token = 2;
}

message BindProviderReq {
  reserved 1;
  reserved "uid";
  // provider/state/code identify the OAuth callback being completed. The
  // user being bound is NOT taken from this message — it comes from the
  // uid embedded in the OAuth state (see OAuthStartReq.uid), which was set
  // when the bind flow was started by an already-authenticated caller.
  // This RPC no longer trusts a client-supplied uid.
  string provider = 2;
  string state = 3;
  string code = 4;
}
message BindProviderResp {}

message UnbindProviderReq {
  // uid MUST be extracted from the caller's verified JWT by the invoking
  // BFF/gateway — see BindProviderReq.uid's comment; the same trust
  // boundary and authorization-bypass risk applies here.
  string uid = 1;
  string provider = 2;
}
message UnbindProviderResp {}

message ListUsersReq {
  int32 limit = 1;
  int32 offset = 2;
}
message UserItem {
  string uid = 1;
  string username = 2;
  string nickname = 3;
  int32 status = 4;
  string phone = 5;
  string email = 6;
  string avatar = 7;
}
message ListUsersResp {
  repeated UserItem users = 1;
  int64 total = 2;
}

message BanUserReq {
  // uid is the target end-user being banned.
  string uid = 1;
  // operator_uid identifies the admin who performed the action; it is recorded
  // as the audit entry's actor_uid while uid is recorded as the target. Trust
  // boundary matches AdminUnbindProviderReq: the calling BFF's own RBAC/JWT
  // verification is trusted and user-kitex does NOT re-verify the operator's
  // identity — this field exists purely for audit attribution. Optional: when
  // empty, the audit entry falls back to attributing the action to uid.
  string operator_uid = 2;
}
message BanUserResp {}

message UnbanUserReq {
  // uid is the target end-user being unbanned.
  string uid = 1;
  // operator_uid identifies the admin who performed the action; it is recorded
  // as the audit entry's actor_uid while uid is recorded as the target. Trust
  // boundary matches AdminUnbindProviderReq: the calling BFF's own RBAC/JWT
  // verification is trusted and user-kitex does NOT re-verify the operator's
  // identity — this field exists purely for audit attribution. Optional: when
  // empty, the audit entry falls back to attributing the action to uid.
  string operator_uid = 2;
}
message UnbanUserResp {}

message ForceLogoutReq {
  // uid is the target end-user whose sessions are being revoked.
  string uid = 1;
  // operator_uid identifies the admin who performed the action; it is recorded
  // as the audit entry's actor_uid while uid is recorded as the target. Trust
  // boundary matches AdminUnbindProviderReq: the calling BFF's own RBAC/JWT
  // verification is trusted and user-kitex does NOT re-verify the operator's
  // identity — this field exists purely for audit attribution. Optional: when
  // empty, the audit entry falls back to attributing the action to uid.
  string operator_uid = 2;
}
message ForceLogoutResp {}

message ListUserIdentitiesReq {
  string uid = 1;
}
message IdentityItem {
  string name = 3;
  string provider_type = 4;
  string provider = 1;
  string provider_user_id = 2;
}
message ListUserIdentitiesResp {
  repeated IdentityItem identities = 1;
}

message GetUserReq {
  string uid = 1;
}
message GetUserResp {
  UserItem user = 1;
}

message AdminUnbindProviderReq {
  string operator_uid = 3;
  // uid is the target end-user, specified by an admin operator via
  // admin-bff-hertz. Trust boundary: admin-bff-hertz's own RBAC
  // authorization (the "terminal_user:unbind-identity" permission) gates
  // this call — user-kitex does not re-verify the caller's identity here,
  // matching the existing admin RPC surface (BanUser/UnbanUser/ForceLogout/
  // ListUsers already work this way: no per-call caller-identity check,
  // trust is placed in the calling BFF having already authorized the
  // operator). Do NOT confuse this with UnbindProviderReq, which is for
  // self-service callers acting on their own already-authenticated uid.
  string uid = 1;
  string provider = 2;
}
message AdminUnbindProviderResp {}

message ChangePasswordReq {
  // uid MUST be extracted from the caller's verified JWT by the invoking
  // BFF — same trust boundary as UnbindProviderReq.uid.
  string uid = 1;
  string old_password = 2;
  string new_password = 3;
  // client_ip/user_agent are optional (empty string = unknown), populated by
  // the calling BFF from the original end-user's HTTP request when available.
  string client_ip = 4;
  string user_agent = 5;
}
message ChangePasswordResp {}

message ResetPasswordReq {
  // uid is the target end-user, specified by an admin operator via
  // admin-bff-hertz. Trust boundary matches AdminUnbindProviderReq: the
  // calling BFF's RBAC check ("terminal_user:password-reset" permission)
  // gates this call, user-kitex does not re-verify caller identity.
  string uid = 1;
  string new_password = 2;
  // client_ip/user_agent are optional (empty string = unknown), populated by
  // the calling BFF from the original end-user's HTTP request when available.
  // Reserved for a follow-up: admin-bff-hertz does not yet forward them, so
  // user-kitex currently records this path with empty values.
  string client_ip = 3;
  string user_agent = 4;
  // operator_uid identifies the admin who performed the reset; it is recorded
  // as the audit entry's actor_uid while uid is recorded as the target. Trust
  // boundary matches AdminUnbindProviderReq: the calling BFF's own RBAC/JWT
  // verification is trusted and user-kitex does NOT re-verify the operator's
  // identity — this field exists purely for audit attribution. Optional: when
  // empty, the audit entry falls back to attributing the action to uid.
  string operator_uid = 5;
}
message ResetPasswordResp {}

message ListAuditLogsReq {
  // actor_uid is the subject uid the query is about. It matches entries the
  // user performed (actor_uid) AND entries performed against them by an admin
  // (target), so admin-initiated bans/resets/force-logouts against this uid
  // are included. The field keeps its name for wire compatibility.
  string actor_uid = 1;
  string action = 2;      // optional filter, empty = no filter
  string start_time = 3;  // optional, RFC3339
  string end_time = 4;    // optional, RFC3339
  int32 limit = 5;
  int32 offset = 6;
}
message AuditLogItem {
  string actor_uid = 1;
  string action = 2;
  string target = 3;
  string ip_address = 4;
  string user_agent = 5;
  string detail_json = 6;
  string created_at = 7;  // RFC3339
}
message ListAuditLogsResp {
  repeated AuditLogItem entries = 1;
  int64 total = 2;
}

message RequestPasswordResetReq {
  // identifier is an email address or phone number, per channel.
  string identifier = 1;
  string channel = 2; // "email" | "sms" — explicit, never inferred from identifier's format
}
message RequestPasswordResetResp {} // always empty on success; success is returned whether or not identifier matched an account

message ConfirmPasswordResetReq {
  string credential = 1;    // the email link's token, or the SMS code
  string new_password = 2;
  string phone = 3; // required when the matched token's channel is "sms"; ignored for "email" tokens. A missing/mismatched phone returns the same generic invalid-credential error as any other failure — see design doc's anti-enumeration section.
}
message ConfirmPasswordResetResp {}


// Application account v2. The environment is server-controlled; client_id is
// an application client policy key, not an identity or authorization proof.
message AccountClientReq { string client_id = 1; }
message AccountCodeReq { string client_id = 1; string kind = 2; string identifier = 3; string purpose = 4; string access_token = 5; string client_ip = 6; }
message AccountLoginReq { string client_id = 1; string kind = 2; string mode = 3; string identifier = 4; string credential = 5; string client_ip = 6; string user_agent = 7; }
message AccountTokenReq { string access_token = 1; string client_id = 2; }
message AccountExchangeResp { AccountTokens tokens = 1; string proof = 2; string purpose = 3; }
message AccountExchangeReq { string client_id = 1; string code = 2; }
message AccountRefreshReq { string refresh_token = 1; string client_id = 2; }
message AccountProfileReq { string access_token = 1; string client_id = 2; string nickname = 3; string avatar = 4; }
message AccountProofReq { string access_token = 1; string client_id = 2; string mode = 3; string kind = 4; string identifier = 5; string credential = 6; string client_ip = 7; }
message AccountContactReq { string access_token = 1; string client_id = 2; string operation = 3; string kind = 4; string identifier = 5; string code = 6; string proof = 7; string client_ip = 8; }
message AccountPasswordReq { string access_token = 1; string client_id = 2; string new_password = 3; string old_password = 4; string proof = 5; }
message AccountResetReq { string client_id = 1; string kind = 2; string identifier = 3; string code = 4; string new_password = 5; string client_ip = 6; }
message AccountOAuthStartReq { string client_id = 1; string config_id = 2; string purpose = 3; string access_token = 4; string proof = 5; string return_url = 6; }
message AccountOAuthCompleteReq { string client_id = 1; string config_id = 2; string state = 3; string code = 4; string client_ip = 5; string user_agent = 6; }
message AccountEmptyReq { string operator_uid = 1; }
message AccountLoginConfig { string id = 1; string kind = 2; string provider = 3; string name = 4; string environment = 5; repeated string clients = 6; bool enabled = 7; int32 sort = 8; map<string,string> settings = 9; map<string,string> secret = 10; bool has_secret = 11; }
message AccountSaveConfigReq { AccountLoginConfig config = 1; string operator_uid = 2; }
message AccountTestConfigReq { string config_id = 1; string target = 2; string operator_uid = 3; }
message AccountEmptyResp {}
message AccountTokens { string uid = 1; string access_token = 2; string refresh_token = 3; int64 expires_in = 4; bool is_new_user = 5; }
message AccountSessionResp { string uid = 1; string session_id = 2; string client_id = 3; }
message AccountIdentity { string config_id = 1; string provider = 2; string name = 3; }
message AccountProfileResp { string uid = 1; string nickname = 2; string avatar = 3; string phone = 4; string email = 5; bool has_password = 6; repeated AccountIdentity identities = 7; }
message AccountProofResp { string proof = 1; }
message AccountLoginMethod { string id = 1; string kind = 2; string provider = 3; string name = 4; string icon = 5; int32 sort = 6; }
message AccountMethodsResp { repeated AccountLoginMethod methods = 1; }
message AccountOAuthStartResp { string redirect_url = 1; string state = 2; string flow = 3; string app_id = 4; string auth_info = 5; }
message AccountOAuthCompleteResp { AccountTokens tokens = 1; string return_url = 2; string purpose = 3; string proof = 4; string client_id = 5; string exchange_code = 6; }
message AccountConfigListResp { string environment = 1; repeated AccountLoginConfig configs = 2; }

service UserService {
  rpc AccountMethods(AccountClientReq) returns (AccountMethodsResp);
  rpc AccountSendCode(AccountCodeReq) returns (AccountEmptyResp);
  rpc AccountLogin(AccountLoginReq) returns (AccountTokens);
  rpc AccountExchange(AccountExchangeReq) returns (AccountExchangeResp);
  rpc AccountRefresh(AccountRefreshReq) returns (AccountTokens);
  rpc AccountVerify(AccountTokenReq) returns (AccountSessionResp);
  rpc AccountLogout(AccountTokenReq) returns (AccountEmptyResp);
  rpc AccountProfile(AccountTokenReq) returns (AccountProfileResp);
  rpc AccountUpdateProfile(AccountProfileReq) returns (AccountProfileResp);
  rpc AccountReauthenticate(AccountProofReq) returns (AccountProofResp);
  rpc AccountContact(AccountContactReq) returns (AccountEmptyResp);
  rpc AccountPassword(AccountPasswordReq) returns (AccountEmptyResp);
  rpc AccountResetPassword(AccountResetReq) returns (AccountEmptyResp);
  rpc AccountOAuthStart(AccountOAuthStartReq) returns (AccountOAuthStartResp);
  rpc AccountOAuthComplete(AccountOAuthCompleteReq) returns (AccountOAuthCompleteResp);
  // Trusted admin BFF only: operator_uid is populated from its verified admin JWT.
  rpc AccountListConfigs(AccountEmptyReq) returns (AccountConfigListResp);
  rpc AccountSaveConfig(AccountSaveConfigReq) returns (AccountLoginConfig);
  rpc AccountTestConfig(AccountTestConfigReq) returns (AccountEmptyResp);

  rpc Register(RegisterReq) returns (RegisterResp);
  rpc Login(LoginReq) returns (LoginResp);
  rpc OAuthStart(OAuthStartReq) returns (OAuthStartResp);
  rpc OAuthCallback(OAuthCallbackReq) returns (OAuthCallbackResp);
  rpc BindProvider(BindProviderReq) returns (BindProviderResp);
  rpc UnbindProvider(UnbindProviderReq) returns (UnbindProviderResp);

  rpc ListUsers(ListUsersReq) returns (ListUsersResp);
  rpc BanUser(BanUserReq) returns (BanUserResp);
  rpc UnbanUser(UnbanUserReq) returns (UnbanUserResp);
  rpc ForceLogout(ForceLogoutReq) returns (ForceLogoutResp);
  rpc ListUserIdentities(ListUserIdentitiesReq) returns (ListUserIdentitiesResp);

  rpc GetUser(GetUserReq) returns (GetUserResp);
  rpc AdminUnbindProvider(AdminUnbindProviderReq) returns (AdminUnbindProviderResp);
  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordResp);
  rpc ResetPassword(ResetPasswordReq) returns (ResetPasswordResp);
  rpc ListAuditLogs(ListAuditLogsReq) returns (ListAuditLogsResp);
  rpc RequestPasswordReset(RequestPasswordResetReq) returns (RequestPasswordResetResp);
  rpc ConfirmPasswordReset(ConfirmPasswordResetReq) returns (ConfirmPasswordResetResp);
}
