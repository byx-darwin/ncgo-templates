# Hertz custom template — internal/router/pb/middleware.go
# Generates router middleware helpers (rootMw/_pingMw) consumed by the
# per-service router file internal/router/pb/{service}.go, which ncgo's
# loop_service overlay generates from the IDL. Requires ncgo including PR #71
# (commit 0d5a8df), which fixes per-service file generation for Hertz IDLs;
# with that fix the per-service router owns Register, so no fallback is defined here.
path: internal/router/pb/middleware.go
update_behavior:
    type: cover
loop_service: true
body: |-
    // Code generated by hertz generator.

    package pb

    import (
    	"github.com/cloudwego/hertz/pkg/app"
    )

    func rootMw() []app.HandlerFunc {
    	// your code...
    	return nil
    }

    func _pingMw() []app.HandlerFunc {
    	// your code...
    	return nil
    }
