        for _, u := range out.Users {{ "{" }}
            items = append(items, &userv1.UserItem{{ "{" }}Phone: u.Phone, Email: u.Email, Avatar: u.Avatar, Uid: u.Uid, Username: u.Username, Nickname: u.Nickname, Status: int32(u.Status){{ "}" }})
