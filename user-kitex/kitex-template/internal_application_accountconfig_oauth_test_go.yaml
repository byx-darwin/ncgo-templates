    func TestAlipaySignsRequestAndVerifiesExactResponseBytes(t *testing.T) {{ "{" }}
        merchant := testRSA(t)
        provider := testRSA(t)
        tamper := false
        server := httptest.NewTLSServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {{ "{" }}
            r.ParseForm()
            v := r.PostForm
            sig, _ := base64.StdEncoding.DecodeString(v.Get("sign"))
            v.Del("sign")
            parts := []string{{ "{" }}{{ "}" }}
            keys := make([]string, 0, len(v))
            for k := range v {{ "{" }}
                keys = append(keys, k)
            {{ "}" }}
            sort.Strings(keys)
            for _, key := range keys {{ "{" }}
                parts = append(parts, key+"="+v.Get(key))
            {{ "}" }}
            h := sha256.Sum256([]byte(strings.Join(parts, "&")))
            if rsa.VerifyPKCS1v15(&merchant.PublicKey, crypto.SHA256, h[:], sig) != nil {{ "{" }}
                t.Error("invalid Alipay request signature")
            {{ "}" }}
            raw := `{{ "{" }}"user_id":"20880000000001","access_token":"private-token","code":"10000"{{ "}" }}`
            responseKey := "alipay_system_oauth_token_response"
            if v.Get("method") == "alipay.user.info.share" {{ "{" }}
                raw = `{{ "{" }}"user_id":"20880000000001","nick_name":"Alice","code":"10000"{{ "}" }}`
                responseKey = "alipay_user_info_share_response"
            {{ "}" }}
            digest := sha256.Sum256([]byte(raw))
            signed, _ := rsa.SignPKCS1v15(rand.Reader, provider, crypto.SHA256, digest[:])
            if tamper {{ "{" }}
                raw = strings.Replace(raw, "20880000000001", "20880000000002", 1)
            {{ "}" }}
            fmt.Fprintf(w, `{{ "{" }}%q:%s,"sign":%q{{ "}" }}`, responseKey, raw, base64.StdEncoding.EncodeToString(signed))
        {{ "}" }}))
        defer server.Close()
        m := fixtureManager(t, server)
        c := Config{{ "{" }}ID: "alipay", Kind: "oauth", Provider: "alipay", Environment: "test", Enabled: true, Clients: []string{{ "{" }}"app"{{ "}" }}, Settings: map[string]string{{ "{" }}"client_id": "app", "redirect_url": "https://example.com/callback", "return_urls": `["https://example.com/done"]`{{ "}" }}, Secret: map[string]string{{ "{" }}"private_key": privatePEM(merchant), "public_key": publicPEM(provider){{ "}" }}{{ "}" }}
        got, err := m.OAuthExchange(context.Background(), c, "code", "verifier", "nonce")
        if err != nil || got.Subject != "20880000000001" {{ "{" }}
            t.Fatalf("Alipay exchange: %v", err)
        {{ "}" }}
        tamper = true
        if _, err = m.OAuthExchange(context.Background(), c, "code", "verifier", "nonce"); err == nil {{ "{" }}
            t.Fatal("accepted tampered Alipay response")
        {{ "}" }}
    {{ "}" }}
