                    {{ "}" }}
                {{ "}" }})
            {{ "}" }}
        {{ "}" }}
    {{ "}" }}
    func TestOAuthCallbackRejectsUnexpectedCredentialsAndUnsafeRedirect(t *testing.T) {{ "{" }}
        for _, completion := range []*userv1.AccountOAuthCompleteResp{{ "{" }}
            {{ "{" }}ClientId: "app", Purpose: "login", ExchangeCode: "core-grant", ReturnUrl: "https://frontend.test/done", Tokens: &userv1.AccountTokens{{ "{" }}AccessToken: "should-not-leak"{{ "}" }}{{ "}" }},
            {{ "{" }}ClientId: "app", Purpose: "reauth", ExchangeCode: "core-grant", ReturnUrl: "https://frontend.test/done", Proof: "should-not-leak"{{ "}" }},
            {{ "{" }}ClientId: "app", Purpose: "login", ExchangeCode: "core-grant", ReturnUrl: "javascript:alert(1)"{{ "}" }},
            {{ "{" }}ClientId: "app", Purpose: "login", ExchangeCode: "core-grant", ReturnUrl: "https://user:secret@frontend.test/done"{{ "}" }},
        {{ "}" }} {{ "{" }}
            f := &fakeOAuthClient{{ "{" }}completion: completion{{ "}" }}
            store := &memoryGrantStore{{ "{" }}{{ "}" }}
            h := oauthEngine(f, store)
            w := ut.PerformRequest(h.Engine, "GET", "/cfg/callback?state=s&code=c", nil)
            if w.Result().StatusCode() == 302 || strings.Contains(w.Body.String(), "should-not-leak") || store.puts != 0 || w.Result().Header.Get("Cache-Control") != "no-store" || w.Result().Header.Get("Referrer-Policy") != "no-referrer" {{ "{" }}
                t.Fatal("unsafe callback response accepted")
            {{ "}" }}
        {{ "}" }}
        f := &fakeOAuthClient{{ "{" }}{{ "}" }}
        f.verifyErr = context.Canceled
        h := oauthEngine(f, nil)
        raw := `{{ "{" }}"client_id":"app","code":"core-grant"{{ "}" }}`
        w := ut.PerformRequest(h.Engine, "POST", "/exchange", &ut.Body{{ "{" }}Body: strings.NewReader(raw), Len: len(raw){{ "}" }})
        if w.Result().StatusCode() == 200 || strings.Contains(w.Body.String(), "secret-token") || w.Result().Header.Get("Cache-Control") != "no-store" {{ "{" }}
