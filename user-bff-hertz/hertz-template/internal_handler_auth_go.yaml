# ncgo exported template — internal/handler/auth.go
path: internal/handler/auth.go
update_behavior:
    type: skip
loop_service: true
body: |
    package handler

    import (
    	"context"
    	"encoding/json"
    	"strings"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/middleware"
    	"{{.Module}}/internal/pkg/response"
    	userv1 "{{.Module}}/kitex_gen/api/user/v1"
    	userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
    )

    type AuthHandler struct {{ "{" }}
    	userCli userservice.Client
    {{ "}" }}

    func NewAuthHandler(userCli userservice.Client) *AuthHandler {{ "{" }}
    	return &AuthHandler{{ "{" }}userCli: userCli{{ "}" }}
    {{ "}" }}

    type registerReq struct {{ "{" }}
    	Username string `json:"username"`
    	Password string `json:"password"`
    {{ "}" }}

    func (h *AuthHandler) Register(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req registerReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	resp, err := h.userCli.Register(ctx, &userv1.RegisterReq{{ "{" }}Username: req.Username, Password: req.Password{{ "}" }})
    	if err != nil {{ "{" }}
    		response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, map[string]string{{ "{" }}"uid": resp.Uid{{ "}" }})
    {{ "}" }}

    type loginReq struct {{ "{" }}
    	Username string `json:"username"`
    	Password string `json:"password"`
    {{ "}" }}

    func (h *AuthHandler) Login(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req loginReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	// Forward the end-user's IP and User-Agent so user-kitex can record
    	// them on the login audit entry (both fields are optional; an empty
    	// string simply means "unknown" downstream).
    	resp, err := h.userCli.Login(ctx, &userv1.LoginReq{{ "{" }}Username: req.Username, Password: req.Password, ClientIp: c.ClientIP(), UserAgent: strings.TrimSpace(c.Request.Header.Get("User-Agent")){{ "}" }})
    	if err != nil {{ "{" }}
    		response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, map[string]string{{ "{" }}"uid": resp.Uid, "token": resp.Token{{ "}" }})
    {{ "}" }}

    type changePasswordReq struct {{ "{" }}
    	OldPassword string `json:"old_password"`
    	NewPassword string `json:"new_password"`
    {{ "}" }}

    func (h *AuthHandler) ChangePassword(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	claims, ok := middleware.GetClaims(c)
    	if !ok {{ "{" }}
    		response.ErrorCode(c, response.CodeTokenInvalid)
    		return
    	{{ "}" }}
    	var req changePasswordReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	// ClientIp/UserAgent feed the password-change audit entries (success
    	// and failed-old-password) in user-kitex — see Login above.
    	if _, err := h.userCli.ChangePassword(ctx, &userv1.ChangePasswordReq{{ "{" }}Uid: claims.Uid, OldPassword: req.OldPassword, NewPassword: req.NewPassword, ClientIp: c.ClientIP(), UserAgent: strings.TrimSpace(c.Request.Header.Get("User-Agent")){{ "}" }}); err != nil {{ "{" }}
    		response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, map[string]string{{ "{" }}"status": "password_changed"{{ "}" }})
    {{ "}" }}

    type requestPasswordResetReq struct {{ "{" }}
    	Identifier string `json:"identifier"`
    	Channel    string `json:"channel"`
    {{ "}" }}

    func (h *AuthHandler) RequestPasswordReset(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req requestPasswordResetReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	if _, err := h.userCli.RequestPasswordReset(ctx, &userv1.RequestPasswordResetReq{{ "{" }}Identifier: req.Identifier, Channel: req.Channel{{ "}" }}); err != nil {{ "{" }}
    		response.Err(c, err)
    		return
    	{{ "}" }}
    	// Always the same success body, regardless of whether identifier
    	// matched an account — see usersvc.RequestPasswordReset's doc comment.
    	response.OK(c, map[string]string{{ "{" }}"status": "reset_requested"{{ "}" }})
    {{ "}" }}

    type confirmPasswordResetReq struct {{ "{" }}
    	Credential  string `json:"credential"`
    	NewPassword string `json:"new_password"`
    {{ "}" }}

    func (h *AuthHandler) ConfirmPasswordReset(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req confirmPasswordResetReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	if _, err := h.userCli.ConfirmPasswordReset(ctx, &userv1.ConfirmPasswordResetReq{{ "{" }}Credential: req.Credential, NewPassword: req.NewPassword{{ "}" }}); err != nil {{ "{" }}
    		response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, map[string]string{{ "{" }}"status": "password_reset"{{ "}" }})
    {{ "}" }}
