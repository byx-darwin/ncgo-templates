    func TestTerminalUserHandler_ListAuditLogs_Success(t *testing.T) {{ "{" }}
    	h := NewTerminalUserHandler(&fakeTerminalUserClient{{ "{" }}{{ "}" }})
    	ctx, c := newTerminalUserTestCtx()
    	c.Params = append(c.Params, param.Param{{ "{" }}Key: "uid", Value: "u1"{{ "}" }})
    	h.ListAuditLogs(ctx, c)
    	if c.Response.StatusCode() != 200 {{ "{" }}
    		t.Fatalf("status = %d, want 200: %s", c.Response.StatusCode(), c.Response.Body())
    	{{ "}" }}
    	// The response envelope may be produced either via plain encoding/json
    	// (map/struct data) or via protojson (when data is a proto.Message, as
    	// ListAuditLogsResp is) — protojson renders int64 fields as JSON strings.
    	// json.RawMessage tolerates either shape without over-asserting on it.
    	var body struct {{ "{" }}
    		Data struct {{ "{" }}
    			Entries []json.RawMessage `json:"entries"`
    			Total   json.RawMessage   `json:"total"`
    		{{ "}" }} `json:"data"`
    	{{ "}" }}
    	if err := json.Unmarshal(c.Response.Body(), &body); err != nil {{ "{" }}
    		t.Fatalf("failed to unmarshal response body %q: %v", c.Response.Body(), err)
    	{{ "}" }}
    	if len(body.Data.Entries) != 2 {{ "{" }}
    		t.Fatalf("entries len = %d, want 2 (body: %s)", len(body.Data.Entries), c.Response.Body())
    	{{ "}" }}
    	if !strings.Contains(string(body.Data.Total), "2") {{ "{" }}
    		t.Fatalf("total = %s, want to contain 2", body.Data.Total)
    	{{ "}" }}
    {{ "}" }}
