path: cmd/permgen/main.go
update_behavior:
    type: cover
body: |
    package main

    import (
        "bytes"
        "fmt"
        "os"
        "strings"

        "{{.Module}}/internal/pkg/authz"
    )

    func quote(s string) string {{ "{" }} return "'" + strings.ReplaceAll(s, "'", "''") + "'" {{ "}" }}

    // generate emits idempotent seed SQL. path/method are representative values;
    // HTTP enforcement uses authz.Routes, never database path/method fields.
    func generate() []byte {{ "{" }}
        var out bytes.Buffer
        fmt.Fprintln(&out, "-- Generated by admin/cmd/permgen from authz.Routes. Do not edit.")
        fmt.Fprintln(&out, "-- path/method are display values; one code may cover several routes.")
        fmt.Fprintln(&out, "BEGIN;")
        fmt.Fprintln(&out, `INSERT INTO permissions (code,type,name,path,sort,status) VALUES
    ('dashboard:view','menu','Dashboard','/dashboard',0,1),
    ('system:view','catalog','System','/system',1,1),
    ('system:user','menu','Users','/system/user',1,1),
    ('system:role','menu','Roles','/system/role',2,1),
    ('system:permission','menu','Permissions','/system/permission',3,1),
    ('system:rate-limit','menu','Rate Limits','/system/rate-limit',4,1),
    ('system:terminal-user','menu','Terminal Users','/system/terminal-user',5,1)
    ON CONFLICT (code,type) DO UPDATE SET name=EXCLUDED.name,path=EXCLUDED.path,sort=EXCLUDED.sort;
    UPDATE permissions SET parent_id=(SELECT id FROM permissions WHERE code='system:view' AND type='catalog')
    WHERE code IN ('system:user','system:role','system:permission','system:rate-limit','system:terminal-user') AND type='menu';`)
        seen := map[string]bool{{ "{}" }}
        for _, rp := range authz.Routes {{ "{" }}
            if rp.Code == "" {{ "{" }} continue {{ "}" }}
            for _, typ := range []string{{ "{" }}"api", "button"{{ "}" }} {{ "{" }}
                if typ == "button" && rp.Button == "" {{ "{" }} continue {{ "}" }}
                key := rp.Code + "|" + typ
                if seen[key] {{ "{" }} continue {{ "}" }}
                seen[key] = true
                path, method := "NULL", "NULL"
                if typ == "api" {{ "{" }} path, method = quote(rp.Path), quote(rp.Method) {{ "}" }}
                fmt.Fprintf(&out, "INSERT INTO permissions (code,type,name,path,method,parent_id,sort,status) VALUES (%s,%s,%s,%s,%s,(SELECT id FROM permissions WHERE code=%s AND type='menu'),0,1) ON CONFLICT (code,type) DO UPDATE SET name=EXCLUDED.name,path=EXCLUDED.path,method=EXCLUDED.method,parent_id=EXCLUDED.parent_id;\n", quote(rp.Code),quote(typ),quote(rp.Code),path,method,quote(rp.Menu))
            {{ "}" }}
        {{ "}" }}
        fmt.Fprintln(&out, "COMMIT;")
        return out.Bytes()
    {{ "}" }}

    func main() {{ "{" }}
        if _, err := os.Stdout.Write(generate()); err != nil {{ "{" }} fmt.Fprintln(os.Stderr, err); os.Exit(1) {{ "}" }}
    {{ "}" }}
