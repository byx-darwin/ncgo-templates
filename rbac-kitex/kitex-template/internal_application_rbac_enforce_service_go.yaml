# ncgo exported template — internal/application/rbac/enforce_service.go
path: internal/application/rbac/enforce_service.go
update_behavior:
    type: skip
body: |
    package rbacsvc

    import (
    	"context"
    	"fmt"
    )

    // Enforcer is the Casbin surface used by application services. The concrete
    // *casbin.Enforcer satisfies it; tests may substitute a memory-backed enforcer.
    type Enforcer interface {{ "{" }}
    	AddPolicy(params ...any) (bool, error)
    	RemovePolicy(params ...any) (bool, error)
    	RemoveFilteredPolicy(fieldIndex int, fieldValues ...string) (bool, error)
    	RemoveFilteredGroupingPolicy(fieldIndex int, fieldValues ...string) (bool, error)
    	AddRoleForUser(user string, role string, domain ...string) (bool, error)
    	DeleteRoleForUser(user string, role string, domain ...string) (bool, error)
    	Enforce(rvals ...any) (bool, error)
    {{ "}" }}

    // EnforceService answers authorization questions against the Casbin enforcer.
    type EnforceService struct {{ "{" }}
    	enforcer Enforcer
    {{ "}" }}

    // New creates an EnforceService.
    func New(enforcer Enforcer) *EnforceService {{ "{" }}
    	return &EnforceService{{ "{" }}enforcer: enforcer{{ "}" }}
    {{ "}" }}

    // Enforce reports whether uid may perform act on obj. The subject is the
    // string form of the uid; role membership is resolved by the enforcer's
    // g(user_id, role_code) rules.
    func (s *EnforceService) Enforce(ctx context.Context, uid int64, obj, act string) (bool, error) {{ "{" }}
    	return s.enforcer.Enforce(fmt.Sprint(uid), obj, act)
    {{ "}" }}
