    func TestAliyunSignedDeliveryAndSanitizedProviderFailure(t *testing.T) {{ "{" }}
        server := httptest.NewTLSServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {{ "{" }}
            if r.Method != "POST" {{ "{" }}
                t.Error("SMS must POST")
            {{ "}" }}
