# ncgo exported template — internal/pkg/middleware/authz.go
path: internal/pkg/middleware/authz.go
update_behavior:
    type: cover
body: |
    package middleware

    import (
    	"context"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/response"
    	api "github.com/test/{{ToLower .ServiceName}}/services/authority/kitex_gen/api/admin/v1"
    	"github.com/test/{{ToLower .ServiceName}}/services/authority/kitex_gen/api/admin/v1/rbacservice"
    )

    type permissionKey struct{{ "{" }}{{ "}" }}

    // SetPermission stores the required permission in the request context
    func SetPermission(c *app.RequestContext, code string) {{ "{" }}
    	c.Set("permission", code)
    {{ "}" }}

    // GetPermission retrieves the required permission from the request context
    func GetPermission(c *app.RequestContext) string {{ "{" }}
    	val, exists := c.Get("permission")
    	if !exists {{ "{" }}
    		return ""
    	{{ "}" }}
    	code, _ := val.(string)
    	return code
    {{ "}" }}

    // RequirePermission sets the required permission for a route
    func RequirePermission(code string) app.HandlerFunc {{ "{" }}
    	return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
    		SetPermission(c, code)
    		c.Next(ctx)
    	{{ "}" }}
    {{ "}" }}

    // Authz returns an authorization middleware that checks permissions via RBAC service
    func Authz(rbacCli rbacservice.Client) app.HandlerFunc {{ "{" }}
    	return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
    		perm := GetPermission(c)
    		if perm == "" {{ "{" }}
    			c.Next(ctx)
    			return
    		{{ "}" }}

    		_, ok := GetClaims(c)
    		if !ok {{ "{" }}
    			response.ErrorCode(c, response.CodeUnauthorized)
    			c.Abort()
    			return
    		{{ "}" }}

    		resp, err := rbacCli.Enforce(ctx, &api.EnforceReq{{ "{" }}
    			Uid: 0, // TODO: convert claims.UserID to int64
    			Obj: perm,
    			Act: "execute",
    		{{ "}" }})
    		if err != nil {{ "{" }}
    			response.ErrorCode(c, response.CodeInternalError)
    			c.Abort()
    			return
    		{{ "}" }}

    		if !resp.Allowed {{ "{" }}
    			response.ErrorCode(c, response.CodePermissionDenied)
    			c.Abort()
    			return
    		{{ "}" }}

    		c.Next(ctx)
    	{{ "}" }}
    {{ "}" }}
