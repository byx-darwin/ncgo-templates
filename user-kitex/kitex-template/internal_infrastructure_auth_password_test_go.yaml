body: |
    package auth

    import (
    	"strings"
    	"testing"
    )

    func TestPasswordHashVerifyRoundTrip(t *testing.T) {{ "{" }}
    	hash, err := HashPassword("s3cret-Pass!2024")
    	if err != nil {{ "{" }}
    		t.Fatalf("HashPassword: %v", err)
    	{{ "}" }}
    	if hash == "" {{ "{" }}
    		t.Fatal("hash is empty")
    	{{ "}" }}

    	// Verify PHC format
    	if !strings.HasPrefix(hash, "$argon2id$v=19$") {{ "{" }}
    		t.Fatalf("hash %q does not have PHC argon2id prefix", hash)
    	{{ "}" }}

    	// Correct password
    	ok, err := VerifyPassword("s3cret-Pass!2024", hash)
    	if err != nil {{ "{" }}
    		t.Fatalf("VerifyPassword: %v", err)
    	{{ "}" }}
    	if !ok {{ "{" }}
    		t.Fatal("VerifyPassword(correct) = false, want true")
    	{{ "}" }}

    	// Wrong password
    	ok, err = VerifyPassword("wrong-pass", hash)
    	if err != nil {{ "{" }}
    		t.Fatalf("VerifyPassword(wrong): %v", err)
    	{{ "}" }}
    	if ok {{ "{" }}
    		t.Fatal("VerifyPassword(wrong) = true, want false")
    	{{ "}" }}
    {{ "}" }}

    func TestPasswordHashUniqueness(t *testing.T) {{ "{" }}
    	// Same password should produce different hashes (random salt)
    	h1, _ := HashPassword("same-password")
    	h2, _ := HashPassword("same-password")
    	if h1 == h2 {{ "{" }}
    		t.Fatal("two hashes of the same password are identical — salt not random")
    	{{ "}" }}
    {{ "}" }}

    func TestVerifyPasswordInvalidFormat(t *testing.T) {{ "{" }}
    	tests := []struct{{ "{" }}
    		name string
    		hash string
    	{{ "}" }}{{ "{" }}
    		{{"{"}}"empty", ""{{"}"}},
    		{{"{"}}"garbage", "not-a-valid-hash"{{"}"}},
    		{{"{"}}"wrong algorithm", "$bcrypt$v=19$m=65536,t=3,p=4$abc$def"{{"}"}},
    	{{ "}" }}
    	for _, tt := range tests {{ "{" }}
    		_, err := VerifyPassword("password", tt.hash)
    		if err == nil {{ "{" }}
    			t.Errorf("VerifyPassword(%s) expected error for invalid format", tt.name)
    		{{ "}" }}
    	{{ "}" }}
    {{ "}" }}

    func TestHashContainsParams(t *testing.T) {{ "{" }}
    	hash, _ := HashPassword("test")
    	// Verify that m, t, p params are embedded in the hash
    	if !strings.Contains(hash, "m=65536") {{ "{" }}
    		t.Error("hash missing memory param m=65536")
    	{{ "}" }}
    	if !strings.Contains(hash, "t=3") {{ "{" }}
    		t.Error("hash missing iterations param t=3")
    	{{ "}" }}
    	if !strings.Contains(hash, "p=4") {{ "{" }}
    		t.Error("hash missing parallelism param p=4")
    	{{ "}" }}
    {{ "}" }}
