    func (r *Repo) GetByCode(ctx context.Context, code string) ([]*permission.Permission, error) {{ "{" }}
    	rows, err := r.q.GetPermissionByCode(ctx, code)
    	if err != nil {{ "{" }}
    		return nil, err
