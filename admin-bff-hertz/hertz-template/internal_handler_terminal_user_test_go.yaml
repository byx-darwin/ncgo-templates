            {{ "}" }}
        {{ "}" }}
        if err := json.Unmarshal(c.Response.Body(), &detail); err != nil {{ "{" }}
            t.Fatal(err)
        {{ "}" }}
        if detail.Data.User["phone"] != "+8613800000000" || detail.Data.User["email"] != "person@example.com" || detail.Data.User["avatar"] != "https://cdn.test/avatar.png" {{ "{" }}
            t.Fatalf("detail fields dropped: %s", c.Response.Body())
