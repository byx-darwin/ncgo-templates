    // assertParamInvalid checks that the handler rejected the request via
    // response.ErrorCode(c, response.CodeRequestParamInvalid). The HTTP status
    // this maps to is deliberately not asserted here: response.StatusFromCode's
    // switch (internal/pkg/response/response.go, pre-existing scaffold code,
    // unrelated to this handler) has no case for CodeRequestParamInvalid /
    // CodeParamInvalid and so currently falls through to its default (500)
    // rather than 400 — asserting the business error code is what this
    // handler is actually responsible for.
    func assertParamInvalid(t *testing.T, c *app.RequestContext) {{ "{" }}
        t.Helper()
        var body response.ErrBody
        if err := json.Unmarshal(c.Response.Body(), &body); err != nil {{ "{" }}
            t.Fatalf("failed to unmarshal response body %q: %v", c.Response.Body(), err)
        {{ "}" }}
        if body.Code != response.CodeRequestParamInvalid {{ "{" }}
            t.Fatalf("code = %d, want %d (CodeRequestParamInvalid)", body.Code, response.CodeRequestParamInvalid)
        {{ "}" }}
        if c.Response.StatusCode() == 200 {{ "{" }}
            t.Fatalf("status = %d, want a non-200 error status", c.Response.StatusCode())
        {{ "}" }}
    {{ "}" }}

    func TestTerminalUserHandler_List_ReturnsUsers(t *testing.T) {{ "{" }}
