            parts := []string{{ "{" }}{{ "}" }}
            for _, k := range keys {{ "{" }}
                parts = append(parts, esc(k)+"="+esc(q.Get(k)))
            {{ "}" }}
            mac := hmac.New(sha1.New, []byte("private-key&"))
            mac.Write([]byte("POST&%2F&" + esc(strings.Join(parts, "&"))))
            if sig != base64.StdEncoding.EncodeToString(mac.Sum(nil)) {{ "{" }}
                t.Error("invalid Aliyun signature")
