    func TestResolverCachesPositiveLookupUntilTTLExpires(t *testing.T) {{ "{" }}
    	calls := 0
    	maxRequests := 3
    	resolver := NewResolver(conf.RateLimitConfig{{ "{" }}Source: conf.RateLimitSourceConfig{{ "{" }}Type: "grpc", CacheTTLSeconds: config.Duration{{ "{" }}Duration: 1 * time.Second{{ "}" }}, FallbackOnError: true{{ "}}" }}, Options{{ "{" }}GRPC: ResolveFunc(func(ctx context.Context, lookup Lookup) (*conf.RateLimit{{.ServiceName}}Config, bool, error) {{ "{" }}
    		_ = ctx
    		_ = lookup
    		calls++
    		return &conf.RateLimit{{.ServiceName}}Config{{ "{" }}Enabled: true, Strategy: "fixed_window", WindowSeconds: config.Duration{{ "{" }}Duration: 60 * time.Second{{ "}" }}, MaxRequests: maxRequests{{ "}" }}, true, nil
    	{{ "}" }}){{ "}" }})

    	first, err := resolver.Resolve(context.Background(), Lookup{{ "{" }}Phase: "pre_auth", AppKey: "app-1", Path: "/orders"{{ "}" }})
    	if err != nil {{ "{" }}
    		t.Fatalf("Resolve first: %v", err)
    	{{ "}" }}
    	if first.{{.ServiceName}}.MaxRequests != 3 {{ "{" }}
    		t.Fatalf("first max_requests = %d, want 3", first.{{.ServiceName}}.MaxRequests)
    	{{ "}" }}

    	maxRequests = 7
    	second, err := resolver.Resolve(context.Background(), Lookup{{ "{" }}Phase: "pre_auth", AppKey: "app-1", Path: "/orders"{{ "}" }})
    	if err != nil {{ "{" }}
    		t.Fatalf("Resolve second: %v", err)
    	{{ "}" }}
    	if second.{{.ServiceName}}.MaxRequests != 3 {{ "{" }}
    		t.Fatalf("second max_requests = %d, want cached 3", second.{{.ServiceName}}.MaxRequests)
    	{{ "}" }}
    	if calls != 1 {{ "{" }}
    		t.Fatalf("calls = %d, want 1 before ttl expiry", calls)
    	{{ "}" }}

    	time.Sleep(1100 * time.Millisecond)

    	third, err := resolver.Resolve(context.Background(), Lookup{{ "{" }}Phase: "pre_auth", AppKey: "app-1", Path: "/orders"{{ "}" }})
    	if err != nil {{ "{" }}
    		t.Fatalf("Resolve third: %v", err)
    	{{ "}" }}
    	if third.{{.ServiceName}}.MaxRequests != 7 {{ "{" }}
    		t.Fatalf("third max_requests = %d, want refreshed 7", third.{{.ServiceName}}.MaxRequests)
    	{{ "}" }}
    	if calls != 2 {{ "{" }}
    		t.Fatalf("calls = %d, want 2 after ttl expiry", calls)
    	{{ "}" }}
    {{ "}" }}

