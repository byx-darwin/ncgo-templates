syntax = "proto3";

package api.ratelimit.v1;

option go_package = "github.com/byx-darwin/ncgo-templates/admin-bff-hertz/kitex_gen/api/ratelimit/v1;ratelimitv1";

import "api.proto";

// RuleService handles rate limit rule management
service RuleService {
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse);
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
}

message RateLimitRule {
  int64 id = 1;
  string name = 2;
  string path_pattern = 3;
  string method = 4;
  int64 limit = 5;
  int64 window_seconds = 6;
  string strategy = 7;
  bool enabled = 8;
}

message ListRulesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListRulesResponse {
  repeated RateLimitRule rules = 1;
  int32 total = 2;
}

message CreateRuleRequest {
  string name = 1;
  string path_pattern = 2;
  string method = 3;
  int64 limit = 4;
  int64 window_seconds = 5;
  string strategy = 6;
  bool enabled = 7;
}

message CreateRuleResponse {
  RateLimitRule rule = 1;
}

message UpdateRuleRequest {
  int64 id = 1;
  string name = 2;
  string path_pattern = 3;
  string method = 4;
  int64 limit = 5;
  int64 window_seconds = 6;
  string strategy = 7;
  bool enabled = 8;
}

message UpdateRuleResponse {
  RateLimitRule rule = 1;
}

message DeleteRuleRequest {
  int64 id = 1;
}

message DeleteRuleResponse {
  bool success = 1;
}
