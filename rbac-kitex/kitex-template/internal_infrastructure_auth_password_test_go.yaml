path: internal/infrastructure/auth/password_test.go
update_behavior:
    type: cover
body: |-
    package auth

    import "testing"

    func TestPasswordHashVerifyRoundTrip(t *testing.T) {
    	hash, err := HashPassword("s3cret-pass")
    	if err != nil {
    		t.Fatalf("HashPassword: %v", err)
    	}
    	if hash == "" {
    		t.Fatal("hash is empty")
    	}
    	ok, err := VerifyPassword(hash, "s3cret-pass")
    	if err != nil {
    		t.Fatalf("VerifyPassword: %v", err)
    	}
    	if !ok {
    		t.Fatal("VerifyPassword(correct) = false, want true")
    	}
    	ok, err = VerifyPassword(hash, "wrong-pass")
    	if err != nil {
    		t.Fatalf("VerifyPassword(wrong): %v", err)
    	}
    	if ok {
    		t.Fatal("VerifyPassword(wrong) = true, want false")
    	}
    }

