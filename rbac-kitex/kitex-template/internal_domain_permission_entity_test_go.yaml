    			t.Fatalf("method = %q, want %q", p.Method, strings.ToUpper(m))
    		{{ "}" }}
    	{{ "}" }}
    {{ "}" }}

    func TestNewMenuTypeClearsMethod(t *testing.T) {{ "{" }}
    	for _, typ := range []string{{ "{" }}TypeCatalog, TypeMenu, TypeButton{{ "}" }} {{ "{" }}
