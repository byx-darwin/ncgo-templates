# ncgo exported template — internal/infrastructure/auth/password.go
path: internal/infrastructure/auth/password.go
update_behavior:
    type: cover
body: |
    package auth

    import (
    	"crypto/rand"
    	"crypto/subtle"
    	"encoding/base64"
    	"fmt"
    	"strings"

    	"golang.org/x/crypto/argon2"
    )

    // argon2Params holds the tuning knobs for Argon2id.
    type argon2Params struct {
    	memory      uint32
    	iterations  uint32
    	parallelism uint8
    	saltLength  uint32
    	keyLength   uint32
    }

    // DefaultArgon2Params are the production-recommended Argon2id parameters.
    // Meets OWASP recommendations for memory-hard KDFs:
    //   - 64 MiB memory  → anti-GPU/ASIC
    //   - 3 iterations   → CPU cost
    //   - 4 threads      → parallelism
    //   - 16-byte salt   → anti-rainbow-table
    //   - 32-byte key    → output size
    var DefaultArgon2Params = &argon2Params{
    	memory:      64 * 1024,
    	iterations:  3,
    	parallelism: 4,
    	saltLength:  16,
    	keyLength:   32,
    }

    // HashPassword encodes a plaintext password using Argon2id and returns
    // the result in PHC string format:
    //
    //	$argon2id$v=19$m=65536,t=3,p=4$<base64_salt>$<base64_hash>
    func HashPassword(password string) (string, error) {{ "{" }}
    	p := DefaultArgon2Params

    	salt := make([]byte, p.saltLength)
    	if _, err := rand.Read(salt); err != nil {{ "{" }}
    		return "", fmt.Errorf("auth: generate salt: %w", err)
    	{{ "}" }}

    	hash := argon2.IDKey([]byte(password), salt, p.iterations, p.memory, p.parallelism, p.keyLength)

    	b64Salt := base64.RawStdEncoding.EncodeToString(salt)
    	b64Hash := base64.RawStdEncoding.EncodeToString(hash)

    	return fmt.Sprintf("$argon2id$v=19$m=%d,t=%d,p=%d$%s$%s",
    		p.memory, p.iterations, p.parallelism, b64Salt, b64Hash), nil
    {{ "}" }}

    // VerifyPassword parses the PHC-encoded hash, re-derives the key with the
    // same parameters and salt, and performs a constant-time comparison.
    // The parameters are read from the stored hash so that old hashes remain
    // valid even after DefaultArgon2Params is bumped.
    func VerifyPassword(password, encodedHash string) (bool, error) {{ "{" }}
    	parts := strings.Split(encodedHash, "$")
    	if len(parts) != 6 || parts[1] != "argon2id" {{ "{" }}
    		return false, fmt.Errorf("auth: invalid hash format")
    	{{ "}" }}

    	var p argon2Params
    	if _, err := fmt.Sscanf(parts[3], "m=%d,t=%d,p=%d", &p.memory, &p.iterations, &p.parallelism); err != nil {{ "{" }}
    		return false, fmt.Errorf("auth: parse hash params: %w", err)
    	{{ "}" }}

    	salt, err := base64.RawStdEncoding.DecodeString(parts[4])
    	if err != nil {{ "{" }}
    		return false, fmt.Errorf("auth: decode salt: %w", err)
    	{{ "}" }}

    	decodedHash, err := base64.RawStdEncoding.DecodeString(parts[5])
    	if err != nil {{ "{" }}
    		return false, fmt.Errorf("auth: decode hash: %w", err)
    	{{ "}" }}

    	computedHash := argon2.IDKey([]byte(password), salt, p.iterations, p.memory, p.parallelism, uint32(len(decodedHash)))

    	return subtle.ConstantTimeCompare(decodedHash, computedHash) == 1, nil
    {{ "}" }}
