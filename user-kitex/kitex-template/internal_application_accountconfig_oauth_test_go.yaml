        c := Config{{ "{" }}ID: "oidc", Kind: "oauth", Provider: "oidc", Environment: "test", Enabled: true, Clients: []string{{ "{" }}"app"{{ "}" }}, Settings: map[string]string{{ "{" }}"client_id": "client", "issuer_url": issuer, "redirect_url": issuer + "/callback", "return_urls": `["https://example.com/done"]`{{ "}" }}, Secret: map[string]string{{ "{" }}"client_secret": "secret"{{ "}" }}{{ "}" }}
        start, err := m.OAuthStart(context.Background(), c, "state", "expected-nonce", strings.Repeat("c", 43))
        if err != nil {{ "{" }}
            t.Fatal(err)
        {{ "}" }}
        u, _ := url.Parse(start)
        if u.Query().Get("nonce") != "expected-nonce" || u.Query().Get("state") != "state" || u.Query().Get("code_challenge_method") != "S256" {{ "{" }}
            t.Fatal("OAuth start dropped nonce/state/PKCE")
        {{ "}" }}
        identity, err := m.OAuthExchange(context.Background(), c, "code", strings.Repeat("v", 43), "expected-nonce")
        if err != nil || identity.Subject != "subject" || identity.Nickname != "Alice" {{ "{" }}
            t.Fatalf("verified OIDC login: %v", err)
        {{ "}" }}
        nonce = "wrong"
