syntax = "proto3";

package api.rbac.v1;

option go_package = "api/rbac/v1;rbacv1";

import "api.proto";

// RBACService handles role-based access control operations
service RBACService {
  rpc Enforce(EnforceReq) returns (EnforceResp);

  // User management
  rpc ListUsers(ListUsersReq) returns (ListUsersResp);
  rpc GetUser(GetUserReq) returns (GetUserResp);
  rpc CreateUser(CreateUserReq) returns (CreateUserResp);
  rpc UpdateUser(UpdateUserReq) returns (UpdateUserResp);
  rpc DeleteUser(DeleteUserReq) returns (DeleteUserResp);

  // Role management
  rpc ListRoles(ListRolesReq) returns (ListRolesResp);
  rpc CreateRole(CreateRoleReq) returns (CreateRoleResp);
  rpc UpdateRole(UpdateRoleReq) returns (UpdateRoleResp);
  rpc DeleteRole(DeleteRoleReq) returns (DeleteRoleResp);
  rpc AssignRolesToUser(AssignRolesToUserReq) returns (AssignRolesToUserResp);

  // Permission management
  rpc ListPermissions(ListPermissionsReq) returns (ListPermissionsResp);
  rpc GetPermission(GetPermissionReq) returns (GetPermissionResp);
  rpc CreatePermission(CreatePermissionReq) returns (CreatePermissionResp);
  rpc UpdatePermission(UpdatePermissionReq) returns (UpdatePermissionResp);
  rpc DeletePermission(DeletePermissionReq) returns (DeletePermissionResp);
  rpc GrantPermissionsToRole(GrantPermissionsToRoleReq) returns (GrantPermissionsToRoleResp);

  // Menu management
  rpc ListMenus(ListMenusReq) returns (ListMenusResp);

  // Current user operations
  rpc GetUserMenuTree(GetUserMenuTreeReq) returns (GetUserMenuTreeResp);
  rpc GetUserPermCodes(GetUserPermCodesReq) returns (GetUserPermCodesResp);
}

message EnforceReq {
  string uid = 1;
  string obj = 2;
  string act = 3;
}

message EnforceResp {
  bool allowed = 1;
}

// User messages
message User {
  string id = 1;
  string username = 2;
  int32 status = 3;
  repeated string roles = 4;
  string nickname = 5;
  string avatar = 6;
  string email = 7;
  string phone = 8;
}

message ListUsersReq {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResp {
  repeated User users = 1;
  int32 total = 2;
}

message GetUserReq {
  string id = 1;
}

message GetUserResp {
  User user = 1;
}

message CreateUserReq {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string avatar = 4;
  string email = 5;
  string phone = 6;
}

message CreateUserResp {
  User user = 1;
}

message UpdateUserReq {
  string id = 1;
  optional string password = 2;
  optional int32 status = 3;
  optional string nickname = 4;
  optional string avatar = 5;
  optional string email = 6;
  optional string phone = 7;
}

message UpdateUserResp {
  User user = 1;
}

message DeleteUserReq {
  string id = 1;
}

message DeleteUserResp {
  bool success = 1;
}

// Role messages
message Role {
  string id = 1;
  string code = 2;
  string name = 3;
  int32 status = 4;
  string remark = 5;
  repeated string permissions = 6;
}

message ListRolesReq {
  int32 page = 1;
  int32 page_size = 2;
}

message ListRolesResp {
  repeated Role roles = 1;
  int32 total = 2;
}

message CreateRoleReq {
  string code = 1;
  string name = 2;
  string remark = 3;
}

message CreateRoleResp {
  Role role = 1;
}

message UpdateRoleReq {
  string id = 1;
  string name = 2;
  optional int32 status = 3;
  optional string remark = 4;
}

message UpdateRoleResp {
  Role role = 1;
}

message DeleteRoleReq {
  string id = 1;
}

message DeleteRoleResp {
  bool success = 1;
}

message AssignRolesToUserReq {
  string user_id = 1;
  repeated string role_ids = 2;
}

message AssignRolesToUserResp {}

// Permission messages
message Permission {
  string id = 1;
  string code = 2;
  string type = 3;
  string name = 4;
  string parent_id = 5;
  string path = 6;
  string icon = 7;
  string route_name = 8;
  string redirect = 9;
  bool keep_alive = 10;
  bool hide_in_menu = 11;
  bool is_external = 12;
  string method = 13;
  int32 sort = 14;
  int32 status = 15;
  string description = 16;
}

message ListPermissionsReq {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPermissionsResp {
  repeated Permission permissions = 1;
  int32 total = 2;
}

message GetPermissionReq {
  string id = 1;
}

message GetPermissionResp {
  Permission permission = 1;
}

message CreatePermissionReq {
  string code = 1;
  string type = 2;
  string name = 3;
  string parent_id = 4;
  string path = 5;
  string icon = 6;
  string route_name = 7;
  string redirect = 8;
  bool keep_alive = 9;
  bool hide_in_menu = 10;
  bool is_external = 11;
  string method = 12;
  int32 sort = 13;
  int32 status = 14;
  string description = 15;
}

message CreatePermissionResp {
  Permission permission = 1;
}

message UpdatePermissionReq {
  string id = 1;
  optional string code = 2;
  optional string type = 3;
  optional string name = 4;
  optional string parent_id = 5;
  optional string path = 6;
  optional string icon = 7;
  optional string route_name = 8;
  optional string redirect = 9;
  optional bool keep_alive = 10;
  optional bool hide_in_menu = 11;
  optional bool is_external = 12;
  optional string method = 13;
  optional int32 sort = 14;
  optional int32 status = 15;
  optional string description = 16;
}

message UpdatePermissionResp {
  Permission permission = 1;
}

message DeletePermissionReq {
  string id = 1;
}

message DeletePermissionResp {
  bool success = 1;
}

message GrantPermissionsToRoleReq {
  string role_id = 1;
  repeated string permission_codes = 2;
}

message GrantPermissionsToRoleResp {}

// Menu messages
message Menu {
  string id = 1;
  string code = 2;
  string name = 3;
  string parent_id = 4;
  string type = 5;
  string path = 6;
  string icon = 7;
  string route_name = 8;
  string redirect = 9;
  bool keep_alive = 10;
  bool hide_in_menu = 11;
  bool is_external = 12;
  int32 sort = 13;
}

message ListMenusReq {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMenusResp {
  repeated Menu menus = 1;
  int32 total = 2;
}

message GetUserMenuTreeReq {
  string uid = 1;
}

message MenuNode {
  Menu menu = 1;
  repeated MenuNode children = 2;
}

message GetUserMenuTreeResp {
  repeated MenuNode roots = 1;
}

message GetUserPermCodesReq {
  string uid = 1;
}

message GetUserPermCodesResp {
  repeated string codes = 1;
}
