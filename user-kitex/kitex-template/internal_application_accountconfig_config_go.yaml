        if err != nil {{ "{" }}
            return nil, errors.New("cannot read account configuration")
        {{ "}" }}
        defer rows.Close()
        out := []Config{{ "{" }}{{ "}" }}
        for rows.Next() {{ "{" }}
            c, err := m.scan(rows, decrypt)
            if err != nil {{ "{" }}
                return nil, errors.New("cannot decode account configuration")
            {{ "}" }}
            out = append(out, c)
        {{ "}" }}
        if rows.Err() != nil {{ "{" }}
            return nil, errors.New("cannot read account configuration")
        {{ "}" }}
