# rbac-kitex template — internal/infrastructure/auth/password.go
path: internal/infrastructure/auth/password.go
update_behavior:
  type: cover
body: |-
  package auth

  import "github.com/alexedwards/argon2id"

  // HashPassword hashes a plaintext password using argon2id.
  func HashPassword(plain string) (string, error) {
  	return argon2id.CreateHash(plain, argon2id.DefaultParams)
  }

  // VerifyPassword reports whether plain matches the argon2id hash.
  func VerifyPassword(hash, plain string) (bool, error) {
  	return argon2id.ComparePasswordAndHash(plain, hash)
  }

