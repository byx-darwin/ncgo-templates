            scope := date + "/sms/tc3_request"
            canonical := "POST\n/\n\ncontent-type:application/json; charset=utf-8\nhost:sms.tencentcloudapi.com\n\ncontent-type;host\n" + hash(body)
            signing := h(h(h([]byte("TC3private-key"), date), "sms"), "tc3_request")
            expected := "TC3-HMAC-SHA256 Credential=key-id/" + scope + ", SignedHeaders=content-type;host, Signature=" + hex.EncodeToString(h(signing, "TC3-HMAC-SHA256\n"+timestamp+"\n"+scope+"\n"+hash([]byte(canonical))))
