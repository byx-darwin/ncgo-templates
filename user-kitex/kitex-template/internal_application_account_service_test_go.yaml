            t.Fatal("initial password accepted third-party proof without contact verification")
        {{ "}" }}
        proof = phoneProof(t, s, f, tok, "13800138000")
        if e := s.Password(ctx, PasswordInput{{ "{" }}AccessToken: tok.AccessToken, ClientID: "web", NewPassword: "password123", Proof: proof{{ "}" }}); e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        passwordSession, e := s.Login(ctx, LoginInput{{ "{" }}ClientID: "web", Kind: "phone", Mode: "password", Identifier: "13800138000", Credential: "password123"{{ "}" }})
        if e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        if e = s.SendCode(ctx, CodeInput{{ "{" }}ClientID: "web", Kind: "phone", Identifier: "13800138000", Purpose: "reset"{{ "}" }}); e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        if e = s.ResetPassword(ctx, ResetInput{{ "{" }}ClientID: "web", Kind: "phone", Identifier: "13800138000", Code: f.code, NewPassword: "newpassword123"{{ "}" }}); e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        for _, v := range []Tokens{{ "{" }}tok, passwordSession{{ "}" }} {{ "{" }}
            if _, e = s.Verify(ctx, v.AccessToken, "web"); e == nil {{ "{" }}
                t.Fatal("password reset kept old session")
            {{ "}" }}
        {{ "}" }}
    {{ "}" }}
    func TestPasswordlessContactCannotJustifyRemovingOnlyOAuth(t *testing.T) {{ "{" }}
