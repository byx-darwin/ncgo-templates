# ncgo exported template — internal/base/server/server.go
path: internal/base/server/server.go
update_behavior:
    type: cover
body: |
    // Code generated by kitex generator. Edited for user-kitex.

    package server

    import (
    	"context"
    	"log"
    	"net"
    	"time"

    	"github.com/cloudwego/kitex/pkg/endpoint"
    	"github.com/cloudwego/kitex/pkg/rpcinfo"
    	"github.com/cloudwego/kitex/pkg/transmeta"
    	kitexserver "github.com/cloudwego/kitex/server"
    	"github.com/jackc/pgx/v5/pgxpool"
    	"github.com/redis/go-redis/v9"
    	"github.com/samber/do/v2"

    	"github.com/byx-darwin/go-tools/go-framework/config"
    	"github.com/byx-darwin/go-tools/go-framework/kitex/observability"

    	useradminsvc "{{.Module}}/internal/application/useradmin"
    	usersvc "{{.Module}}/internal/application/user"
    	"{{.Module}}/internal/base/conf"
    	"{{.Module}}/internal/base/data"
    	"{{.Module}}/internal/db/gen"
    	"{{.Module}}/internal/handler"
    	authinfra "{{.Module}}/internal/infrastructure/auth"
    	"{{.Module}}/internal/pkg/interceptor"
    	"{{.Module}}/internal/pkg/oauth"
    	"{{.Module}}/internal/pkg/rpcerror"
    	userrepo "{{.Module}}/internal/repository/user"
    	"{{.Module}}/kitex_gen/api/user/v1/userservice"
    )

    // Run wires the end-user account service (local password login + third-
    // party OAuth/OIDC + admin management RPCs) and starts it on the
    // configured address.
    func Run(extraOptions ...kitexserver.Option) {{ "{" }}
    	cfg := conf.Get()
    	if cfg == nil {{ "{" }}
    		cfg = conf.Default()
    	{{ "}" }}

    	// OTel tracing — enabled when jaeger config is present
    	if cfg.Jaeger != nil && cfg.Jaeger.Enable {{ "{" }}
    		provider, err := observability.NewProvider(context.Background(), config.ObservabilityConfig{{ "{" }}
    			Enabled:     true,
    			Endpoint:    cfg.Jaeger.Endpoint,
    			ServiceName: cfg.Server.Registry.Name,
    		{{ "}" }})
    		if err != nil {{ "{" }}
    			log.Fatalf("init observability: %+v", err)
    		{{ "}" }}
    		defer func() {{ "{" }}
    			if shutdownErr := provider.Shutdown(); shutdownErr != nil {{ "{" }}
    				log.Printf("shutdown observability: %v", shutdownErr)
    			{{ "}" }}
    		{{ "}" }}()
    	{{ "}" }}

    	// ncgo:wire:logging:init

    	injector := do.New()
    	defer func() {{ "{" }} _ = injector.Shutdown() {{ "}" }}()
    	do.ProvideValue(injector, cfg)

    	var (
    		pool *pgxpool.Pool
    		q    *gen.Queries
    	)
    	if cfg.Database.Enabled {{ "{" }}
    		var cleanup func()
    		pool, q, cleanup = provideRepository(cfg.Database)
    		defer cleanup()
    	{{ "}" }} else {{ "{" }}
    		log.Printf("warning: database disabled — UserService RPC calls will fail until database.enabled=true with a DSN")
    	{{ "}" }}

    	userRepo := userrepo.New(q, pool)

    	var (
    		stateStore oauth.StateStore
    		blacklist  useradminsvc.Blacklist = noopBlacklist{{ "{" }}{{ "}" }}
    	)
    	if cfg.Redis.Enabled {{ "{" }}
    		redisClient := redis.NewClient(&redis.Options{{ "{" }}
    			Addr:     cfg.Redis.Addr,
    			Password: cfg.Redis.Password,
    			DB:       cfg.Redis.DB,
    		{{ "}" }})
    		stateStore = oauth.NewRedisStateStore(redisClient)
    		blacklist = newRedisBlacklist(redisClient, time.Duration(cfg.Auth.AccessTTLSeconds)*time.Second)
    	{{ "}" }} else {{ "{" }}
    		log.Printf("warning: redis disabled — OAuth start/callback/bind and admin force-logout will fail until redis.enabled=true")
    	{{ "}" }}

    	providers := buildOAuthRegistry(cfg.OAuth)

    	jwtMgr := authinfra.NewJWTManager(cfg.Auth.JWTSecret)
    	tokenTTL := time.Duration(cfg.Auth.AccessTTLSeconds) * time.Second

    	userSvc := usersvc.New(userRepo, jwtMgr, providers, stateStore, tokenTTL)
    	adminSvc := useradminsvc.New(userRepo, blacklist)
    	userHandler := handler.NewUserServiceHandlerImpl(userSvc, adminSvc)

    	addr, err := net.ResolveTCPAddr("tcp", cfg.Server.RPC.Port)
    	if err != nil {{ "{" }}
    		log.Fatalf("resolve server addr %q: %v", cfg.Server.RPC.Port, err)
    	{{ "}" }}

    	opts := []kitexserver.Option{{ "{" }}
    		kitexserver.WithServiceAddr(addr),
    		kitexserver.WithServerBasicInfo(&rpcinfo.EndpointBasicInfo{{ "{" }}ServiceName: cfg.Server.Registry.Name{{ "}" }}),
    		kitexserver.WithReadWriteTimeout(cfg.Server.Timeout.ReadWriteTimeout),
    		kitexserver.WithExitWaitTime(cfg.Server.Timeout.ExitWaitTimeout),
    		kitexserver.WithMetaHandler(transmeta.ServerTTHeaderHandler),
    		kitexserver.WithMiddleware(endpoint.Chain(
    			// Optional structured logging wiring (after `ncgo add infra logging`):
    			// import "{{.Module}}/internal/base/logging"
    			// Initialize logging before building opts, then replace the default
    			// RequestID/AccessLog/Recovery interceptors below with:
    			// logging.KitexRequestID(),
    			// logging.KitexAccessLog(),
    			// logging.KitexRecovery(),
    			// ncgo:wire:logging:server-middleware
    			interceptor.RequestID(),
    			// Optional release canary wiring (after `ncgo add infra canary`):
    			// import "{{.Module}}/internal/base/release"
    			// release.KitexTraffic(), // reads and propagates traffic.* metadata
    			// ncgo:wire:canary:server-traffic
    			interceptor.AccessLog(),
    			interceptor.Recovery(),
    			// Optional rate-limit wiring (after `ncgo add infra rate-limit`):
    			// import "{{.Module}}/internal/base/middleware"
    			// middleware.RateLimit(cfg.RateLimit),
    			// ncgo:wire:ratelimit:server-middleware
    			interceptor.RequestTimeout(cfg.RPC.RequestTimeoutSeconds.Duration),
    		)),
    		kitexserver.WithErrorHandler(func(ctx context.Context, err error) error {{ "{" }}
    			_ = ctx
    			return rpcerror.ToBizError(err)
    		{{ "}" }}),
    	{{ "}" }}

    	// ncgo:wire:registry:server

    	// Optional static rate-limit safety net (after `ncgo add infra rate-limit`):
    	// middleware.StaticLimitOption mounts kitexserver.WithLimit when configured.
    	// ncgo:wire:ratelimit:static-limit
    	opts = append(opts, extraOptions...)

    	svr := userservice.NewServer(userHandler, opts...)
    	if err := svr.Run(); err != nil {{ "{" }}
    		log.Fatalf("server.Run: %v", err)
    	{{ "}" }}
    {{ "}" }}

    // buildOAuthRegistry instantiates only the provider adapters enabled in
    // conf.yaml. All five adapters are always compiled into the binary;
    // disabled providers are simply never registered, so OAuthStart/
    // OAuthCallback/BindProvider return "provider not enabled" for them.
    func buildOAuthRegistry(cfg conf.OAuthConfig) oauth.Registry {{ "{" }}
    	providers := oauth.Registry{{ "{" }}{{ "}" }}
    	if cfg.Wechat.Enabled {{ "{" }}
    		providers["wechat"] = oauth.NewWeChatProvider(oauth.WeChatConfig{{ "{" }}
    			AppID:       cfg.Wechat.ClientID,
    			AppSecret:   cfg.Wechat.ClientSecret,
    			RedirectURL: cfg.Wechat.RedirectURL,
    		{{ "}" }})
    	{{ "}" }}
    	if cfg.Alipay.Enabled {{ "{" }}
    		providers["alipay"] = oauth.NewAlipayProvider(oauth.AlipayConfig{{ "{" }}
    			AppID:      cfg.Alipay.ClientID,
    			PrivateKey: cfg.Alipay.ClientSecret,
    		{{ "}" }})
    	{{ "}" }}
    	if cfg.GitHub.Enabled {{ "{" }}
    		providers["github"] = oauth.NewGitHubProvider(oauth.GitHubConfig{{ "{" }}
    			ClientID:     cfg.GitHub.ClientID,
    			ClientSecret: cfg.GitHub.ClientSecret,
    			RedirectURL:  cfg.GitHub.RedirectURL,
    		{{ "}" }})
    	{{ "}" }}
    	if cfg.Google.Enabled {{ "{" }}
    		providers["google"] = oauth.NewGoogleProvider(cfg.Google.ClientID, cfg.Google.ClientSecret, cfg.Google.RedirectURL)
    	{{ "}" }}
    	if cfg.OIDC.Enabled {{ "{" }}
    		providers["oidc"] = oauth.NewOIDCProvider(oauth.OIDCConfig{{ "{" }}
    			Name:             "oidc",
    			ClientID:         cfg.OIDC.ClientID,
    			ClientSecret:     cfg.OIDC.ClientSecret,
    			RedirectURL:      cfg.OIDC.RedirectURL,
    			AuthEndpoint:     cfg.OIDC.AuthEndpoint,
    			TokenEndpoint:    cfg.OIDC.TokenEndpoint,
    			UserInfoEndpoint: cfg.OIDC.UserInfoEndpoint,
    			Scopes:           []string{{ "{" }}"openid", "email", "profile"{{ "}" }},
    		{{ "}" }})
    	{{ "}" }}
    	return providers
    {{ "}" }}

    // noopBlacklist is the fallback useradminsvc.Blacklist used when Redis is
    // disabled: ForceLogout succeeds at the application layer but revokes
    // nothing, matching the hermetic (no-Redis) startup path used by other
    // templates in this registry.
    type noopBlacklist struct{{ "{" }}{{ "}" }}

    func (noopBlacklist) Revoke(ctx context.Context, uid string) error {{ "{" }}
    	_ = ctx
    	_ = uid
    	return nil
    {{ "}" }}

    // redisBlacklist implements useradminsvc.Blacklist by writing a
    // revocation marker keyed by uid with a TTL equal to the access-token
    // TTL — long enough for any outstanding token to expire naturally. The
    // JWT-verifying middleware (base-hertz/admin-bff-hertz) is expected to
    // consult the same key; wiring that check is out of scope here.
    type redisBlacklist struct {{ "{" }}
    	client *redis.Client
    	ttl    time.Duration
    {{ "}" }}

    func newRedisBlacklist(client *redis.Client, ttl time.Duration) *redisBlacklist {{ "{" }}
    	return &redisBlacklist{{ "{" }}client: client, ttl: ttl{{ "}" }}
    {{ "}" }}

    func (b *redisBlacklist) Revoke(ctx context.Context, uid string) error {{ "{" }}
    	return b.client.Set(ctx, "user:blacklist:"+uid, "1", b.ttl).Err()
    {{ "}" }}

    func provideRepository(cfg conf.DatabaseConfig) (*pgxpool.Pool, *gen.Queries, func()) {{ "{" }}
    	startupCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
    	defer cancel()

    	pgCfg, err := data.NewPostgresConfig(cfg.DSN)
    	if err != nil {{ "{" }}
    		log.Fatalf("build postgres config: %+v", err)
    	{{ "}" }}
    	applyPostgresPoolConfig(pgCfg, cfg)
    	pool, err := data.NewPostgres(startupCtx, pgCfg)
    	if err != nil {{ "{" }}
    		log.Fatalf("connect postgres: %+v", err)
    	{{ "}" }}
    	d, cleanup, err := data.New(pool)
    	if err != nil {{ "{" }}
    		pool.Close()
    		log.Fatalf("init data: %+v", err)
    	{{ "}" }}
    	return d.Pool, d.Queries, cleanup
    {{ "}" }}

    func applyPostgresPoolConfig(pgCfg *pgxpool.Config, cfg conf.DatabaseConfig) {{ "{" }}
    	if cfg.MaxConns > 0 {{ "{" }}
    		pgCfg.MaxConns = cfg.MaxConns
    	{{ "}" }}
    	if cfg.MinConns > 0 {{ "{" }}
    		pgCfg.MinConns = cfg.MinConns
    	{{ "}" }}
    	pgCfg.MaxConnLifetime = cfg.MaxConnLifetimeSeconds.Duration
    	pgCfg.MaxConnIdleTime = cfg.MaxConnIdleTimeSeconds.Duration
    	pgCfg.HealthCheckPeriod = cfg.HealthCheckPeriodSeconds.Duration
    {{ "}" }}
