# ncgo exported template — internal/application/user/user_service.go
path: internal/application/user/user_service.go
update_behavior:
    type: cover
body: |-
    package usersvc

    import (
    	"context"
    	"errors"
    	"fmt"
    	"log"
    	"time"

    	"github.com/google/uuid"

    	"{{.Module}}/internal/domain/user"
    	"{{.Module}}/internal/infrastructure/audit"
    	"{{.Module}}/internal/infrastructure/auth"
    	"{{.Module}}/internal/pkg/oauth"
    )

    const (
    	// minUsernameLength/maxUsernameLength bound local-registration
    	// usernames. Adjust to taste; these are template defaults, not a
    	// hard protocol requirement.
    	minUsernameLength = 3
    	maxUsernameLength = 64
    	// minPasswordLength is a template default minimum; raise it (and/or
    	// add a complexity check) to match your own security policy.
    	minPasswordLength = 8
    )

    // dummyPasswordHash is a precomputed, valid-format Argon2id PHC hash for
    // a fixed, never-matching password. Login runs VerifyPassword against it
    // on the "username not found" path so that path takes about as long as
    // the real-user path (which always runs a real Argon2id verification) —
    // otherwise an unknown username returns near-instantly while a real
    // username spends tens of milliseconds in the KDF, and that timing gap
    // is itself a username-enumeration side channel even though both paths
    // already return the same generic error string.
    const dummyPasswordHash = "$argon2id$v=19$m=65536,t=3,p=4$QkDU1nAIfRMtROQZ6d/YHw$6DdGHU55QaOHHQ9wdPkbEqqFymUY/xHyokpBzOAhmls"

    // Service implements end-user self-service account operations:
    // local registration/login and third-party OAuth login/binding.
    type Service struct {{ "{" }}
    	repo       user.Repository
    	jwt        *auth.JWTManager
    	providers  oauth.Registry
    	stateStore oauth.StateStore
    	tokenTTL   time.Duration
    	audit      audit.Writer
    	blacklist  Blacklist
    {{ "}" }}

    // Blacklist revokes a JWT before its natural expiry. Mirrors
    // useradminsvc.Blacklist's shape exactly — server.go wires the same
    // concrete redisBlacklist/noopBlacklist instance into both services.
    type Blacklist interface {{ "{" }}
    	Revoke(ctx context.Context, uid string) error
    {{ "}" }}

    // New constructs a Service. providers may be a partial registry (only
    // providers enabled via conf.yaml). stateStore MUST be non-nil for any
    // call that exercises the OAuth path (OAuthStart/OAuthCallback/
    // BindProvider) — those methods call it unconditionally and will panic
    // on a nil stateStore. Unit tests that only exercise Register/Login may
    // safely pass nil, since those methods never touch it.
    func New(repo user.Repository, jwt *auth.JWTManager, providers oauth.Registry, stateStore oauth.StateStore, tokenTTL time.Duration, auditWriter audit.Writer, blacklist Blacklist) *Service {{ "{" }}
    	return &Service{{ "{" }}repo: repo, jwt: jwt, providers: providers, stateStore: stateStore, tokenTTL: tokenTTL, audit: auditWriter, blacklist: blacklist{{ "}" }}
    {{ "}" }}

    func parseUID(uid string) (user.ID, error) {{ "{" }}
    	return uuid.Parse(uid)
    {{ "}" }}

    // Register creates a local account and returns its uid.
    func (s *Service) Register(ctx context.Context, in RegisterInput) (RegisterOutput, error) {{ "{" }}
    	if l := len(in.Username); l < minUsernameLength || l > maxUsernameLength {{ "{" }}
    		return RegisterOutput{{ "{" }}{{ "}" }}, errors.New("user: username must be 3-64 characters")
    	{{ "}" }}
    	if len(in.Password) < minPasswordLength {{ "{" }}
    		return RegisterOutput{{ "{" }}{{ "}" }}, errors.New("user: password must be at least 8 characters")
    	{{ "}" }}
    	hash, err := auth.HashPassword(in.Password)
    	if err != nil {{ "{" }}
    		return RegisterOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	u, err := user.NewLocal(in.Username, hash)
    	if err != nil {{ "{" }}
    		return RegisterOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	if err := s.repo.Create(ctx, u); err != nil {{ "{" }}
    		if errors.Is(err, user.ErrUsernameTaken) {{ "{" }}
    			return RegisterOutput{{ "{" }}{{ "}" }}, errors.New("user: username already taken")
    		{{ "}" }}
    		return RegisterOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	return RegisterOutput{{ "{" }}Uid: u.ID.String(){{ "}" }}, nil
    {{ "}" }}

    // Login verifies local credentials and issues a JWT.
    func (s *Service) Login(ctx context.Context, in LoginInput) (LoginOutput, error) {{ "{" }}
    	u, err := s.repo.GetByUsername(ctx, in.Username)
    	if err != nil {{ "{" }}
    		if !errors.Is(err, user.ErrNotFound) {{ "{" }}
    			// Unexpected (e.g. DB connectivity) failure, not "no such
    			// user" — log it so an outage is distinguishable from a bad
    			// password, but still return the same generic error so this
    			// branch doesn't become a NEW enumeration vector.
    			log.Printf("user: GetByUsername failed: %v", err)
    		{{ "}" }}
    		// Run a dummy verification so this path costs about as much time
    		// as the real-user path below, closing the timing side-channel.
    		_, _ = auth.VerifyPassword(in.Password, dummyPasswordHash)
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}Action: "auth.login.failure", DetailJSON: `{{ "{" }}"reason":"user_not_found"{{ "}" }}`{{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: invalid credentials")
    	{{ "}" }}
    	if u.IsBanned() {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: u.ID.String(), Action: "auth.login.failure", DetailJSON: `{{ "{" }}"reason":"banned"{{ "}" }}`{{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: invalid credentials")
    	{{ "}" }}
    	if u.PasswordHash == nil {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: u.ID.String(), Action: "auth.login.failure", DetailJSON: `{{ "{" }}"reason":"no_local_password"{{ "}" }}`{{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: invalid credentials")
    	{{ "}" }}
    	ok, err := auth.VerifyPassword(in.Password, *u.PasswordHash)
    	if err != nil || !ok {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: u.ID.String(), Action: "auth.login.failure", DetailJSON: `{{ "{" }}"reason":"bad_password"{{ "}" }}`{{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: invalid credentials")
    	{{ "}" }}
    	return s.issueToken(ctx, u)
    {{ "}" }}

    func (s *Service) issueToken(ctx context.Context, u *user.User) (LoginOutput, error) {{ "{" }}
    	token, err := s.jwt.Sign(u.ID.String(), []string{{ "{" }}"user"{{ "}" }}, s.tokenTTL)
    	if err != nil {{ "{" }}
    		return LoginOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: u.ID.String(), Action: "auth.login.success"{{ "}" }})
    	return LoginOutput{{ "{" }}Uid: u.ID.String(), Token: token{{ "}" }}, nil
    {{ "}" }}

    const (
    	oauthPurposeLogin = "login"
    	oauthPurposeBind  = "bind"
    )

    // OAuthStart generates a CSRF state tagged with providerName and purpose
    // ("login" or "bind"), stores it, and returns the provider's redirect
    // URL. purpose must be validated/consumed by the matching callback
    // (OAuthCallback for "login", BindProvider for "bind") so a state minted
    // for one provider/flow can't be replayed against another.
    func (s *Service) OAuthStart(ctx context.Context, providerName, purpose, uid string) (string, error) {{ "{" }}
    	if purpose != oauthPurposeLogin && purpose != oauthPurposeBind {{ "{" }}
    		return "", errors.New("user: invalid oauth purpose")
    	{{ "}" }}
    	if purpose == oauthPurposeBind && uid == "" {{ "{" }}
    		return "", errors.New("user: uid required for bind purpose")
    	{{ "}" }}
    	p, ok := s.providers.Get(providerName)
    	if !ok {{ "{" }}
    		return "", errors.New("user: provider not enabled")
    	{{ "}" }}
    	state := uuid.NewString()
    	if err := s.stateStore.Put(ctx, state, providerName, purpose, uid, 10*time.Minute); err != nil {{ "{" }}
    		return "", err
    	{{ "}" }}
    	return p.AuthURL(state), nil
    {{ "}" }}

    // OAuthCallback exchanges the code, finds-or-creates the local user
    // bound to the provider identity, and issues a JWT.
    func (s *Service) OAuthCallback(ctx context.Context, in OAuthCallbackInput) (LoginOutput, error) {{ "{" }}
    	provider, purpose, _, ok, err := s.stateStore.Consume(ctx, in.State)
    	if err != nil {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}Action: "auth.login.failure", DetailJSON: fmt.Sprintf(`{{ "{" }}"reason":"oauth_state_error","provider":%q{{ "}" }}`, in.Provider){{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	if !ok || provider != in.Provider || purpose != oauthPurposeLogin {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}Action: "auth.login.failure", DetailJSON: fmt.Sprintf(`{{ "{" }}"reason":"oauth_state_invalid","provider":%q{{ "}" }}`, in.Provider){{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: oauth state invalid or expired")
    	{{ "}" }}

    	p, ok := s.providers.Get(in.Provider)
    	if !ok {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}Action: "auth.login.failure", DetailJSON: fmt.Sprintf(`{{ "{" }}"reason":"provider_not_enabled","provider":%q{{ "}" }}`, in.Provider){{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: provider not enabled")
    	{{ "}" }}

    	tok, err := p.ExchangeCode(ctx, in.Code)
    	if err != nil {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}Action: "auth.login.failure", DetailJSON: fmt.Sprintf(`{{ "{" }}"reason":"oauth_exchange_failed","provider":%q{{ "}" }}`, in.Provider){{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	info, err := p.FetchUserInfo(ctx, tok)
    	if err != nil {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}Action: "auth.login.failure", DetailJSON: fmt.Sprintf(`{{ "{" }}"reason":"oauth_fetch_userinfo_failed","provider":%q{{ "}" }}`, in.Provider){{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}

    	identity, err := s.repo.GetIdentityByProvider(ctx, in.Provider, info.ProviderUserID)
    	if errors.Is(err, user.ErrNotFound) {{ "{" }}
    		u, err := user.NewFromProvider()
    		if err != nil {{ "{" }}
    			return LoginOutput{{ "{" }}{{ "}" }}, err
    		{{ "}" }}
    		u.Nickname, u.Avatar, u.Email = info.Nickname, info.AvatarURL, info.Email
    		if err := s.repo.Create(ctx, u); err != nil {{ "{" }}
    			return LoginOutput{{ "{" }}{{ "}" }}, err
    		{{ "}" }}
    		newIdentity, err := user.NewIdentity(u.ID, in.Provider, info.ProviderUserID, info.RawJSON)
    		if err != nil {{ "{" }}
    			return LoginOutput{{ "{" }}{{ "}" }}, err
    		{{ "}" }}
    		if err := s.repo.CreateIdentity(ctx, newIdentity); err != nil {{ "{" }}
    			return LoginOutput{{ "{" }}{{ "}" }}, err
    		{{ "}" }}
    		return s.issueToken(ctx, u)
    	{{ "}" }}
    	if err != nil {{ "{" }}
    		return LoginOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}

    	u, err := s.repo.GetByID(ctx, identity.UserID)
    	if err != nil {{ "{" }}
    		return LoginOutput{{ "{" }}{{ "}" }}, err
    	{{ "}" }}
    	if u.IsBanned() {{ "{" }}
    		_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: u.ID.String(), Action: "auth.login.failure", DetailJSON: `{{ "{" }}"reason":"banned"{{ "}" }}`{{ "}" }})
    		return LoginOutput{{ "{" }}{{ "}" }}, errors.New("user: invalid credentials")
    	{{ "}" }}
    	return s.issueToken(ctx, u)
    {{ "}" }}

    // BindProvider links a third-party identity to an already-authenticated
    // user. The user being bound is NOT taken from in — it comes from the
    // uid embedded in the OAuth state (set by OAuthStart when the bind flow
    // was started by an already-authenticated caller), so this method never
    // trusts a client-supplied uid.
    func (s *Service) BindProvider(ctx context.Context, in BindProviderInput) error {{ "{" }}
    	provider, purpose, uid, ok, err := s.stateStore.Consume(ctx, in.State)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	if !ok || provider != in.Provider || purpose != oauthPurposeBind || uid == "" {{ "{" }}
    		return errors.New("user: oauth state invalid or expired")
    	{{ "}" }}
    	p, ok := s.providers.Get(in.Provider)
    	if !ok {{ "{" }}
    		return errors.New("user: provider not enabled")
    	{{ "}" }}
    	tok, err := p.ExchangeCode(ctx, in.Code)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	info, err := p.FetchUserInfo(ctx, tok)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	existing, err := s.repo.GetIdentityByProvider(ctx, in.Provider, info.ProviderUserID)
    	if err != nil && !errors.Is(err, user.ErrNotFound) {{ "{" }}
    		return err
    	{{ "}" }}
    	if existing != nil {{ "{" }}
    		return errors.New("user: identity already bound to another user")
    	{{ "}" }}

    	parsedUID, err := parseUID(uid)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	identity, err := user.NewIdentity(parsedUID, in.Provider, info.ProviderUserID, info.RawJSON)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	if err := s.repo.CreateIdentity(ctx, identity); err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: uid, Action: "identity.bind", Target: in.Provider{{ "}" }})
    	return nil
    {{ "}" }}

    // UnbindProvider removes a third-party identity from uid. uid MUST come
    // from the caller's verified JWT — see BindProvider's doc comment; the
    // same trust boundary applies here.
    //
    // Before deleting, it checks the user would still have at least one
    // authentication method left afterward (a local password, or another
    // bound identity). Without this check, a user with ONLY a third-party
    // identity and no local password who unbinds their sole provider would
    // be permanently locked out — this template has no self-service
    // "set a password" RPC to recover from that state.
    func (s *Service) UnbindProvider(ctx context.Context, uid, providerName string) error {{ "{" }}
    	id, err := parseUID(uid)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	u, err := s.repo.GetByID(ctx, id)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	if u.PasswordHash == nil {{ "{" }}
    		identities, err := s.repo.ListIdentitiesByUserID(ctx, id)
    		if err != nil {{ "{" }}
    			return err
    		{{ "}" }}
    		remaining := 0
    		for _, ident := range identities {{ "{" }}
    			if ident.Provider != providerName {{ "{" }}
    				remaining++
    			{{ "}" }}
    		{{ "}" }}
    		if remaining == 0 {{ "{" }}
    			return errors.New("user: cannot unbind your only authentication method")
    		{{ "}" }}
    	{{ "}" }}
    	if err := s.repo.DeleteIdentity(ctx, id, providerName); err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: uid, Action: "identity.unbind", Target: providerName{{ "}" }})
    	return nil
    {{ "}" }}

    // ChangePassword lets an already-authenticated end-user change their own
    // password after verifying the current one.
    func (s *Service) ChangePassword(ctx context.Context, uid, oldPassword, newPassword string) error {{ "{" }}
    	return s.setPassword(ctx, uid, &oldPassword, newPassword, "user.password_change")
    {{ "}" }}

    // setPassword is the shared implementation behind ChangePassword (self-
    // service, oldPassword required) and useradminsvc.ResetPassword (admin-
    // forced, oldPassword nil — see server.go wiring, which passes this same
    // Service to construct useradminsvc.Service's password-reset path).
    func (s *Service) setPassword(ctx context.Context, uid string, oldPassword *string, newPassword, auditAction string) error {{ "{" }}
    	if len(newPassword) < minPasswordLength {{ "{" }}
    		return errors.New("user: password must be at least 8 characters")
    	{{ "}" }}
    	id, err := parseUID(uid)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	u, err := s.repo.GetByID(ctx, id)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	if oldPassword != nil {{ "{" }}
    		if u.PasswordHash == nil {{ "{" }}
    			return errors.New("user: account has no local password set")
    		{{ "}" }}
    		ok, err := auth.VerifyPassword(*oldPassword, *u.PasswordHash)
    		if err != nil || !ok {{ "{" }}
    			// Record the failed verification so brute-force attempts are
    			// visible in the audit trail (mirrors auth.login.failure).
    			_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: uid, Action: "user.password_change.failure"{{ "}" }})
    			return errors.New("user: old password is incorrect")
    		{{ "}" }}
    	{{ "}" }}
    	newHash, err := auth.HashPassword(newPassword)
    	if err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	if err := s.repo.UpdatePassword(ctx, id, newHash); err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	_ = s.blacklist.Revoke(ctx, uid)
    	_ = s.audit.Write(ctx, audit.Entry{{ "{" }}ActorUID: uid, Action: auditAction{{ "}" }})
    	return nil
    {{ "}" }}

    // SetPasswordForAdmin is called by useradminsvc.ResetPassword to reuse
    // setPassword's shared logic without exporting setPassword itself
    // (keeps the no-old-password path explicit at the call site rather than
    // letting any caller pass a nil oldPassword to the unexported helper).
    func (s *Service) SetPasswordForAdmin(ctx context.Context, uid, newPassword string) error {{ "{" }}
    	return s.setPassword(ctx, uid, nil, newPassword, "user.password_reset")
    {{ "}" }}
