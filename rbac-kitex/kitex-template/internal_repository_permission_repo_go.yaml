    	{{ "}" }}
    	var parentID *int64
    	if p.ParentID != 0 {{ "{" }}
    		parentID = &p.ParentID
    	{{ "}" }}
    	var path, icon, routeName, redirect, method, description *string
    	if p.Path != "" {{ "{" }}
    		path = &p.Path
    	{{ "}" }}
    	if p.Icon != "" {{ "{" }}
