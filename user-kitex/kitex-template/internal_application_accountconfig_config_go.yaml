    {{ "}" }}
    func (m *Manager) List(ctx context.Context) ([]Config, error) {{ "{" }} return m.load(ctx, false) {{ "}" }}
    func (m *Manager) Save(ctx context.Context, c Config, actor string) (Config, error) {{ "{" }}
        if err := m.ready(); err != nil {{ "{" }}
