                    t.Error("missing PKCE verifier")
                {{ "}" }}
                claims := map[string]any{{ "{" }}"iss": issuer, "sub": "subject", "aud": audience, "nonce": nonce, "exp": time.Now().Add(time.Hour).Unix(), "iat": time.Now().Unix(), "name": "Alice", "picture": "https://example.com/avatar"{{ "}" }}
                if expired {{ "{" }}
                    claims["exp"] = time.Now().Add(-2 * time.Minute).Unix()
                {{ "}" }}
                if wrongIssuer {{ "{" }}
                    claims["iss"] = "https://attacker.example.com"
                {{ "}" }}
                jwt := signedJWT(t, key, claims)
                if badSignature {{ "{" }}
                    parts := strings.Split(jwt, ".")
                    parts[2] = base64.RawURLEncoding.EncodeToString(make([]byte, 256))
                    jwt = strings.Join(parts, ".")
                {{ "}" }}
                json.NewEncoder(w).Encode(map[string]string{{ "{" }}"access_token": "private-access-token", "token_type": "Bearer", "id_token": jwt{{ "}" }})
            default:
