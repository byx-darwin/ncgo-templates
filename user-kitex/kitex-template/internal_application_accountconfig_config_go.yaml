        out := map[string]string{{ "{" }}{{ "}" }}
        for k, v := range old {{ "{" }}
            out[k] = v
        {{ "}" }}
        for k, v := range next {{ "{" }}
            if v != "" {{ "{" }}
                out[k] = v
            {{ "}" }}
        {{ "}" }}
        return out
    {{ "}" }}

    const configColumns = `id,environment,kind,provider,name,clients,enabled,sort,settings,secret`

    type scanner interface{{ "{" }} Scan(...any) error {{ "}" }}

    func (m *Manager) scan(row scanner, decrypt bool) (Config, error) {{ "{" }}
