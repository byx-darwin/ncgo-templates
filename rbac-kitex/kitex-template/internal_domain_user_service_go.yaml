# ncgo exported template — internal/domain/user/service.go
path: internal/domain/user/service.go
update_behavior:
    type: skip
body: |
    package user

    // service.go hosts pure domain rules that operate on the user aggregate but
    // are not intrinsic to the entity itself.

    // Credentials is a value object carrying a login attempt. Keeping it in the
    // domain layer makes the login contract explicit and unit-testable without
    // infrastructure.
    type Credentials struct {{ "{" }}
    	Username string
    	Password string
    {{ "}" }}
