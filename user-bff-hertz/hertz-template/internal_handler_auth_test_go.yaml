# ncgo exported template — internal/handler/auth_test.go
path: internal/handler/auth_test.go
update_behavior:
    type: skip
loop_service: true
body: |
    package handler

    import (
        "context"
        "errors"
        userv1 "{{.Module}}/kitex_gen/api/user/v1"
        userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
        "github.com/cloudwego/hertz/pkg/app/server"
        "github.com/cloudwego/hertz/pkg/common/ut"
        "github.com/cloudwego/kitex/client/callopt"
        "strings"
        "testing"
    )

    type fakeAccountClient struct {{ "{" }}
        userservice.Client
        login        *userv1.AccountLoginReq
        code         *userv1.AccountCodeReq
        contact      *userv1.AccountContactReq
        token        *userv1.AccountTokenReq
        verifyErr    error
        profileCalls int
        verifies     int
    {{ "}" }}

    func (f *fakeAccountClient) AccountLogin(ctx context.Context, r *userv1.AccountLoginReq, _ ...callopt.Option) (*userv1.AccountTokens, error) {{ "{" }}
        f.login = r
        return &userv1.AccountTokens{{ "{" }}Uid: "u", AccessToken: "token"{{ "}" }}, nil
    {{ "}" }}
    func (f *fakeAccountClient) AccountVerify(ctx context.Context, r *userv1.AccountTokenReq, _ ...callopt.Option) (*userv1.AccountSessionResp, error) {{ "{" }}
        f.verifies++
        f.token = r
        return &userv1.AccountSessionResp{{ "{" }}Uid: "verified-user", ClientId: r.ClientId{{ "}" }}, f.verifyErr
    {{ "}" }}
    func (f *fakeAccountClient) AccountProfile(ctx context.Context, r *userv1.AccountTokenReq, _ ...callopt.Option) (*userv1.AccountProfileResp, error) {{ "{" }}
        f.profileCalls++
        return &userv1.AccountProfileResp{{ "{" }}Uid: "verified-user"{{ "}" }}, nil
    {{ "}" }}
    func (f *fakeAccountClient) AccountContact(ctx context.Context, r *userv1.AccountContactReq, _ ...callopt.Option) (*userv1.AccountEmptyResp, error) {{ "{" }}
        f.contact = r
        return &userv1.AccountEmptyResp{{ "{" }}{{ "}" }}, nil
    {{ "}" }}
    func accountEngine(f *fakeAccountClient) *server.Hertz {{ "{" }}
        h := server.New()
        a := NewAccountHandler(f)
        h.POST("/login", a.Login)
        p := h.Group("", a.SessionAuth())
        p.GET("/me", a.Me)
        p.POST("/contact", a.Contact)
        return h
    {{ "}" }}
    func TestLoginUsesActualRequestMetadataAndClientBinding(t *testing.T) {{ "{" }}
        f := &fakeAccountClient{{ "{" }}{{ "}" }}
        h := accountEngine(f)
        body := `{{ "{" }}"client_id":"app","kind":"email","mode":"code","identifier":"a@example.com","credential":"123456","client_ip":"spoof","user_agent":"spoof","uid":"victim"{{ "}" }}`
        w := ut.PerformRequest(h.Engine, "POST", "/login", &ut.Body{{ "{" }}Body: strings.NewReader(body), Len: len(body){{ "}" }}, ut.Header{{ "{" }}Key: "X-Client-ID", Value: "app"{{ "}" }}, ut.Header{{ "{" }}Key: "User-Agent", Value: "actual-agent"{{ "}" }})
        if w.Result().StatusCode() != 200 || f.login == nil || f.login.UserAgent != "actual-agent" || f.login.ClientIp == "spoof" || f.login.ClientId != "app" {{ "{" }}
            t.Fatalf("request extraction: %s %+v", w.Body.String(), f.login)
        {{ "}" }}
        f.login = nil
        ut.PerformRequest(h.Engine, "POST", "/login", &ut.Body{{ "{" }}Body: strings.NewReader(body), Len: len(body){{ "}" }}, ut.Header{{ "{" }}Key: "X-Client-ID", Value: "other"{{ "}" }})
        if f.login != nil {{ "{" }}
            t.Fatal("mismatched client reached RPC")
        {{ "}" }}
    {{ "}" }}
    func TestProtectedRoutesFailClosedOnRevokedSessionAndNeverTrustBodyToken(t *testing.T) {{ "{" }}
        f := &fakeAccountClient{{ "{" }}verifyErr: errors.New("revoked"){{ "}" }}
        h := accountEngine(f)
        w := ut.PerformRequest(h.Engine, "GET", "/me", nil, ut.Header{{ "{" }}Key: "X-Client-ID", Value: "app"{{ "}" }}, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer header-token"{{ "}" }}, ut.Header{{ "{" }}Key: "X-Forwarded-For", Value: "192.0.2.42"{{ "}" }})
        if w.Result().StatusCode() == 200 || f.profileCalls != 0 || f.verifies != 1 {{ "{" }}
            t.Fatalf("revoked session passed: %s", w.Body.String())
        {{ "}" }}
        f.verifyErr = nil
        body := `{{ "{" }}"client_id":"app","uid":"victim","access_token":"body-token","client_ip":"body-spoof","operation":"bind","kind":"phone","identifier":"+8613800000000","code":"123456","proof":"p"{{ "}" }}`
        ut.PerformRequest(h.Engine, "POST", "/contact", &ut.Body{{ "{" }}Body: strings.NewReader(body), Len: len(body){{ "}" }}, ut.Header{{ "{" }}Key: "X-Client-ID", Value: "app"{{ "}" }}, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer header-token"{{ "}" }}, ut.Header{{ "{" }}Key: "X-Forwarded-For", Value: "192.0.2.42"{{ "}" }})
        if f.contact == nil || f.contact.AccessToken != "header-token" || f.contact.ClientIp != "192.0.2.42" || f.token.AccessToken != "header-token" || f.verifies != 2 {{ "{" }}
            t.Fatalf("body spoof accepted: %+v", f.contact)
        {{ "}" }}
        f.contact = nil
        ut.PerformRequest(h.Engine, "POST", "/contact", &ut.Body{{ "{" }}Body: strings.NewReader(body), Len: len(body){{ "}" }}, ut.Header{{ "{" }}Key: "X-Client-ID", Value: "app"{{ "}" }})
        if f.contact != nil {{ "{" }}
            t.Fatal("missing bearer accepted body token")
        {{ "}" }}
    {{ "}" }}

    func (f *fakeAccountClient) AccountSendCode(ctx context.Context, r *userv1.AccountCodeReq, _ ...callopt.Option) (*userv1.AccountEmptyResp, error) {{ "{" }}
        f.code = r
        return &userv1.AccountEmptyResp{{ "{" }}{{ "}" }}, nil
    {{ "}" }}
    func TestProtectedCodePurposeRequiresHeaderClientIdentity(t *testing.T) {{ "{" }}
        f := &fakeAccountClient{{ "{" }}{{ "}" }}
        h := server.New()
        h.POST("/code", NewAccountHandler(f).Code)
        body := `{{ "{" }}"client_id":"app","purpose":"reauth","kind":"email","identifier":"bound@example.com"{{ "}" }}`
        w := ut.PerformRequest(h.Engine, "POST", "/code", &ut.Body{{ "{" }}Body: strings.NewReader(body), Len: len(body){{ "}" }}, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer session"{{ "}" }})
        if w.Result().StatusCode() == 200 || f.code != nil || f.verifies != 0 {{ "{" }}
            t.Fatalf("protected purpose accepted body-only client: %s", w.Body.String())
        {{ "}" }}
    {{ "}" }}
