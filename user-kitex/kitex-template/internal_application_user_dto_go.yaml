# ncgo exported template — internal/application/user/dto.go
path: internal/application/user/dto.go
update_behavior:
    type: cover
body: |-
    package usersvc

    type RegisterInput struct {{ "{" }}
    	Username string
    	Password string
    {{ "}" }}

    type RegisterOutput struct {{ "{" }}
    	Uid string
    {{ "}" }}

    type LoginInput struct {{ "{" }}
    	Username string
    	Password string
    	// ClientIP/UserAgent are optional (empty string = unknown); the
    	// handler fills them from LoginReq, which the calling BFF populates
    	// from the original end-user HTTP request. They are recorded on the
    	// login audit entries (success and every failure branch).
    	ClientIP  string
    	UserAgent string
    {{ "}" }}

    type LoginOutput struct {{ "{" }}
    	Uid   string
    	Token string
    {{ "}" }}

    type OAuthCallbackInput struct {{ "{" }}
    	Provider string
    	State    string
    	Code     string
    {{ "}" }}

    type BindProviderInput struct {{ "{" }}
    	Provider string
    	State    string
    	Code     string
    {{ "}" }}
