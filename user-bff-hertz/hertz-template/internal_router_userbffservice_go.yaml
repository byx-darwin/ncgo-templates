# ncgo exported template — internal/router/userbffservice.go
path: internal/router/userbffservice.go
update_behavior:
    type: cover
loop_service: true
body: |
    package router

    import (
        "{{.Module}}/internal/base/conf"
        "{{.Module}}/internal/handler"
        "{{.Module}}/internal/pkg/middleware"
        "{{.Module}}/internal/pkg/oauthcode"
        "{{.Module}}/internal/pkg/ratelimit"
        userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
        "github.com/cloudwego/hertz/pkg/app/server"
    )

    func Register{{.ServiceName}}BffServiceRoutes(h *server.Hertz, userCli userservice.Client, codeStore oauthcode.Store, resolver *ratelimit.Resolver) {{ "{" }}
        cfg := conf.Get()
        account := handler.NewAccountHandler(userCli)
        oauth := handler.NewOAuthHandler(userCli, codeStore, cfg.OAuthRedirect, cfg.OAuthCode.TTLSeconds.Duration)
        h.Use(middleware.CORS(cfg.CORS))
        auth := h.Group("/auth")
        auth.GET("/methods", account.Methods)
        auth.POST("/code", account.Code)
        auth.POST("/login", middleware.RateLimit("post_auth", cfg.RateLimit, cfg.RateLimit.PostAuth, resolver), account.Login)
        auth.POST("/refresh", account.Refresh)
        auth.POST("/password-reset/request", middleware.RateLimit("password_reset_request", cfg.RateLimit, cfg.RateLimit.PasswordResetRequest, resolver), account.RequestReset)
        auth.POST("/password-reset/confirm", middleware.RateLimit("password_reset_confirm", cfg.RateLimit, cfg.RateLimit.PasswordResetConfirm, resolver), account.ConfirmReset)
        protected := auth.Group("", account.SessionAuth())
        protected.POST("/logout", account.Logout)
        protected.GET("/me", account.Me)
        protected.PATCH("/me", account.UpdateMe)
        protected.POST("/reauth", account.Reauthenticate)
        protected.POST("/contact", account.Contact)
        protected.POST("/password", account.Password)
        auth.GET("/oauth/:config/start", oauth.Start)
        auth.POST("/oauth/:config/start", oauth.Start)
        auth.GET("/oauth/:config/callback", oauth.Callback)
        auth.POST("/oauth/:config/callback", oauth.Callback)
        auth.POST("/oauth/exchange", oauth.Exchange)
    {{ "}" }}
