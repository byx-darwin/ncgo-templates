# ncgo exported template — conf/dev/conf.yaml
path: conf/dev/conf.yaml
update_behavior:
    type: skip
body: |-
    # 本地开发环境配置（默认由 GO_ENV=dev 加载）
    # env 会决定默认读取 conf/<env>/conf.yaml；常见值为 dev/test/staging/prod
    env: dev
    # 是否开启调试模式；通常会影响日志级别、错误细节和本地开发体验
    # 生产环境通常应关闭
    debug: true
    # 服务监听配置
    server:
      # RPC 监听配置（由 go-framework/config/kitex.ServerConfig 驱动）
      rpc:
        # 监听端口，格式 :port
        port: ":8888"
        # 网络类型，固定 "tcp"
        network: "tcp"
      # 服务注册信息
      registry:
        # 服务名：用于服务注册、日志、指标等（统一 admin-services）
        name: admin-services
      # 超时配置（使用 Go time.Duration 字符串格式，如 "30s"/"1m"）
      timeout:
        # 连接读写超时
        read_write_timeout: "30s"
        # 优雅停机等待中的最大退出时间
        exit_wait_timeout: "10s"
    # RPC 调用默认超时配置
    rpc:
      # 下游 RPC 请求默认超时时间，单位秒；建议小于上游 HTTP 超时
      request_timeout_seconds: "3s"
    # 调用方鉴权配置（Auth + RBAC 共用）
    auth:
      # JWT 签名密钥（开发环境使用固定值，生产环境务必替换）
      jwt_secret: "dev-secret-change-me"
      # Access Token 有效期（秒）
      access_ttl_seconds: 3600
      # Refresh Token 有效期（秒）
      refresh_ttl_seconds: 86400
      # Token 存储方式：memory | redis
      token_store: "memory"
      # 当 token_store=redis 时使用的 Redis 地址
      redis_addr: "127.0.0.1:6379"
      # 调用方白名单配置
      caller_allowlist:
        enabled: false
        header: "x-caller-service"
        allowed_callers: []
        allow_missing: true
    # 日志配置（由 go-common/log 读取）
    log:
      # 日志级别：debug/info/warn/error
      level: "info"
      # 日志格式：json/console
      format: "console"
      # 输出模式：console/file/both
      mode: "console"
    # 数据库配置（RBAC + Rule-Center 共用）
    database:
      # 是否启用数据库连接
      enabled: true
      # PostgreSQL DSN；例如 postgres://user:pass@host:5432/dbname?sslmode=disable
      # 启用数据库时必须填写
      dsn: "postgres://postgres:postgres@localhost:5432/micro_admin?sslmode=disable"
      # 连接池最大连接数；需结合数据库实例上限和服务副本数评估
      max_conns: 20
      # 连接池最小空闲连接数；可减少突发流量时的建连开销
      min_conns: 2
      # 单连接最大生命周期，单位秒
      # 运维建议：略小于数据库或代理层连接回收时间，避免同时批量失效
      max_conn_lifetime_seconds: "1800s"
      # 单连接最大空闲时间，单位秒
      # 运维建议：用于及时回收长时间不用的连接，降低空闲连接占用
      max_conn_idle_time_seconds: "300s"
      # 连接健康检查周期，单位秒
      # 运维建议：不要过小，否则会增加额外探测开销
      health_check_period_seconds: "30s"
    # Redis 配置（顶层，供 token store / rate-limit 等模块使用）
    redis:
      addrs:
        - 127.0.0.1:6379
      db: 0
      pool_size: 10
      min_idle_conns: 2
      dial_timeout: "5s"
      read_timeout: "3s"
      write_timeout: "3s"
      pool_timeout: "4s"
    # 限流配置（RuleService 规则引擎 + 全局安全网）
    rate_limit:
      enabled: false
      backend: "memory"
      source:
        type: "database"
        cache_ttl_seconds: "60s"
        fallback_on_error: true
    # 链路追踪（可选，按需开启）
    # jaeger:
    #   enable: true
    #   endpoint: "http://localhost:14268/api/traces"
