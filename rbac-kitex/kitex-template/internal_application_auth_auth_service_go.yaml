# ncgo exported template — internal/application/auth/auth_service.go
path: internal/application/auth/auth_service.go
update_behavior:
    type: skip
body: |
    package authsvc

    import (
    	"context"
    	"errors"
    	"fmt"
    	"time"

    	"{{.Module}}/internal/domain/role"
    	"{{.Module}}/internal/domain/user"
    	"{{.Module}}/internal/infrastructure/audit"
    	authinfra "{{.Module}}/internal/infrastructure/auth"
    	tokeninfra "{{.Module}}/internal/infrastructure/token"
    )

    // ErrInvalidCredentials is returned for a bad username/password pair.
    var ErrInvalidCredentials = errors.New("invalid credentials")

    // userRepo is the auth service's data-access port.
    type userRepo interface {{ "{" }}
    	GetByID(ctx context.Context, id int64) (*user.User, error)
    	GetByUsername(ctx context.Context, username string) (*user.User, error)
    	ListRoles(ctx context.Context, uid int64) ([]*role.Role, error)
    {{ "}" }}

    // Service implements the login / refresh / logout / validate flows.
    type Service struct {{ "{" }}
    	users  userRepo
    	jwt    *authinfra.JWTManager
    	tokens tokeninfra.Store
    	audit  audit.Writer
    	cfg    Config
    {{ "}" }}

    // New wires the auth service.
    func New(users userRepo, jwt *authinfra.JWTManager, tokens tokeninfra.Store, audit audit.Writer, cfg Config) *Service {{ "{" }}
    	return &Service{{ "{" }}users: users, jwt: jwt, tokens: tokens, audit: audit, cfg: cfg{{ "}" }}
    {{ "}" }}

    // Login verifies credentials, issues an access+refresh pair, and records the
    // refresh token. The access token carries the user's role codes.
    func (s *Service) Login(ctx context.Context, in LoginInput) (LoginOutput, error) {{ "{" }}
    	var out LoginOutput
    	u, err := s.users.GetByUsername(ctx, in.Username)
    	if err != nil {{ "{" }}
    		var nf user.NotFoundError
    		if errors.As(err, &nf) {{ "{" }}
    			return out, ErrInvalidCredentials
    		{{ "}" }}
    		return out, err
    	{{ "}" }}
    	if u.Status != user.StatusActive {{ "{" }}
    		return out, errors.New("account is disabled")
    	{{ "}" }}
    	ok, err := authinfra.VerifyPassword(u.PasswordHash, in.Password)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	if !ok {{ "{" }}
    		return out, ErrInvalidCredentials
    	{{ "}" }}

    	roles, err := s.rolesFor(ctx, u.ID)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	accessTTL := time.Duration(s.cfg.AccessTTLSeconds) * time.Second
    	refreshTTL := time.Duration(s.cfg.RefreshTTLSeconds) * time.Second
    	access, err := s.jwt.Sign(u.ID, roles, accessTTL)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	refresh, err := s.jwt.Sign(u.ID, roles, refreshTTL)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	if err := s.tokens.SetRefresh(ctx, u.ID, refresh, refreshTTL); err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	_ = s.audit.Write(ctx, u.ID, "auth.login", "auth", `{{ "{" }}{{ "}" }}`)
    	return LoginOutput{{ "{" }}
    		AccessToken:  access,
    		RefreshToken: refresh,
    		ExpiresIn:    int32(s.cfg.AccessTTLSeconds),
    	{{ "}" }}, nil
    {{ "}" }}

    // Refresh rotates a valid refresh token into a new access+refresh pair.
    func (s *Service) Refresh(ctx context.Context, in RefreshInput) (RefreshOutput, error) {{ "{" }}
    	var out RefreshOutput
    	uid, err := s.tokens.GetRefresh(ctx, in.RefreshToken)
    	if err != nil {{ "{" }}
    		return out, fmt.Errorf("invalid refresh token: %w", err)
    	{{ "}" }}
    	u, err := s.users.GetByID(ctx, uid)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	if u.Status != user.StatusActive {{ "{" }}
    		return out, errors.New("account is disabled")
    	{{ "}" }}
    	roles, err := s.rolesFor(ctx, uid)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	// Rotate: invalidate the presented refresh token, then issue a new pair.
    	_ = s.tokens.DeleteRefresh(ctx, in.RefreshToken)

    	accessTTL := time.Duration(s.cfg.AccessTTLSeconds) * time.Second
    	refreshTTL := time.Duration(s.cfg.RefreshTTLSeconds) * time.Second
    	access, err := s.jwt.Sign(uid, roles, accessTTL)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	refresh, err := s.jwt.Sign(uid, roles, refreshTTL)
    	if err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	if err := s.tokens.SetRefresh(ctx, uid, refresh, refreshTTL); err != nil {{ "{" }}
    		return out, err
    	{{ "}" }}
    	_ = s.audit.Write(ctx, uid, "auth.refresh", "auth", `{{ "{" }}{{ "}" }}`)
    	return RefreshOutput{{ "{" }}AccessToken: access, RefreshToken: refresh{{ "}" }}, nil
    {{ "}" }}

    // Logout revokes the access token by blacklisting it for the access TTL.
    func (s *Service) Logout(ctx context.Context, accessToken string) error {{ "{" }}
    	ttl := time.Duration(s.cfg.AccessTTLSeconds) * time.Second
    	if err := s.tokens.Blacklist(ctx, accessToken, ttl); err != nil {{ "{" }}
    		return err
    	{{ "}" }}
    	_ = s.audit.Write(ctx, 0, "auth.logout", "auth", `{{ "{" }}{{ "}" }}`)
    	return nil
    {{ "}" }}

    // ValidateToken verifies the access token signature and blacklist state.
    func (s *Service) ValidateToken(ctx context.Context, accessToken string) (ValidateTokenOutput, error) {{ "{" }}
    	claims, err := s.jwt.Parse(accessToken)
    	if err != nil {{ "{" }}
    		return ValidateTokenOutput{{ "{" }}Valid: false{{ "}" }}, nil
    	{{ "}" }}
    	blacklisted, err := s.tokens.IsBlacklisted(ctx, accessToken)
    	if err != nil {{ "{" }}
    		return ValidateTokenOutput{{ "{" }}Valid: false{{ "}" }}, err
    	{{ "}" }}
    	if blacklisted {{ "{" }}
    		return ValidateTokenOutput{{ "{" }}Valid: false{{ "}" }}, nil
    	{{ "}" }}
    	return ValidateTokenOutput{{ "{" }}UID: claims.Uid, Roles: claims.Roles, Valid: true{{ "}" }}, nil
    {{ "}" }}

    func (s *Service) rolesFor(ctx context.Context, uid int64) ([]string, error) {{ "{" }}
    	roles, err := s.users.ListRoles(ctx, uid)
    	if err != nil {{ "{" }}
    		return nil, err
    	{{ "}" }}
    	codes := make([]string, 0, len(roles))
    	for _, r := range roles {{ "{" }}
    		codes = append(codes, r.Code)
    	{{ "}" }}
    	return codes, nil
    {{ "}" }}
