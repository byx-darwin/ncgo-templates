body: |
    package handler

    import (
    	"context"
    	"encoding/json"
    	"strconv"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/response"
    	api "github.com/test/{{ToLower .ServiceName}}/services/rbac/kitex_gen/api/rbac/v1"
    	"github.com/test/{{ToLower .ServiceName}}/services/rbac/kitex_gen/api/rbac/v1/rbacservice"
    )

    type UserHandler struct {{ "{" }}
    	rbacCli rbacservice.Client
    {{ "}" }}

    func NewUserHandler(rbacCli rbacservice.Client) *UserHandler {{ "{" }}
    	return &UserHandler{{ "{" }}rbacCli: rbacCli{{ "}" }}
    {{ "}" }}

    func (h *UserHandler) List(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	resp, err := h.rbacCli.ListUsers(ctx, &api.ListUsersReq{{ "{" }}{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}
    	response.OK(c, resp.Users)
    {{ "}" }}

    func (h *UserHandler) Get(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	idStr := c.Param("id")
    	id, _ := strconv.ParseInt(idStr, 10, 64)

    	resp, err := h.rbacCli.GetUser(ctx, &api.GetUserReq{{ "{" }}Id: id{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}
    	response.OK(c, resp.User)
    {{ "}" }}

    func (h *UserHandler) Create(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req api.CreateUserReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}

    	resp, err := h.rbacCli.CreateUser(ctx, &req)
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}
    	response.OK(c, resp.User)
    {{ "}" }}

    func (h *UserHandler) Update(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	idStr := c.Param("id")
    	id, _ := strconv.ParseInt(idStr, 10, 64)

    	var req api.UpdateUserReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	req.Id = id

    	resp, err := h.rbacCli.UpdateUser(ctx, &req)
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}
    	response.OK(c, resp.User)
    {{ "}" }}

    func (h *UserHandler) Delete(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	idStr := c.Param("id")
    	id, _ := strconv.ParseInt(idStr, 10, 64)

    	_, err := h.rbacCli.DeleteUser(ctx, &api.DeleteUserReq{{ "{" }}Id: id{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}
    	response.OK(c, map[string]string{{ "{" }}"status": "deleted"{{ "}" }})
    {{ "}" }}
