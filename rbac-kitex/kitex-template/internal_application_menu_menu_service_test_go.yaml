    type fakeMenuRepo struct {{ "{" }}
    	menus []*menu.Menu
    {{ "}" }}

    func (f *fakeMenuRepo) GetByID(ctx context.Context, id int64) (*menu.Menu, error) {{ "{" }}
    	for _, m := range f.menus {{ "{" }}
    		if m.ID == id {{ "{" }}
    			return m, nil
    		{{ "}" }}
    	{{ "}" }}
    	return nil, menu.NotFoundError{{ "{" }}ID: id{{ "}" }}
    {{ "}" }}

    func (f *fakeMenuRepo) List(ctx context.Context) ([]*menu.Menu, error) {{ "{" }} return f.menus, nil {{ "}" }}

    func (f *fakeMenuRepo) ListByPermCodes(ctx context.Context, codes []string) ([]*menu.Menu, error) {{ "{" }}
    	set := make(map[string]bool, len(codes))
    	for _, c := range codes {{ "{" }}
    		set[c] = true
    	{{ "}" }}
    	out := make([]*menu.Menu, 0, len(f.menus))
    	for _, m := range f.menus {{ "{" }}
    		if set[m.PermCode] {{ "{" }}
    			out = append(out, m)
    		{{ "}" }}
    	{{ "}" }}
    	return out, nil
    {{ "}" }}

    func (f *fakeMenuRepo) Save(ctx context.Context, m *menu.Menu) error {{ "{" }}
    	for i, existing := range f.menus {{ "{" }}
    		if existing.ID == m.ID {{ "{" }}
    			f.menus[i] = m
    			return nil
    		{{ "}" }}
    	{{ "}" }}
    	f.menus = append(f.menus, m)
    	return nil
    {{ "}" }}

    func (f *fakeMenuRepo) Delete(ctx context.Context, id int64) error {{ "{" }}
    	for i, m := range f.menus {{ "{" }}
    		if m.ID == id {{ "{" }}
    			f.menus = append(f.menus[:i], f.menus[i+1:]...)
    			return nil
    		{{ "}" }}
    	{{ "}" }}
    	return nil
    {{ "}" }}

