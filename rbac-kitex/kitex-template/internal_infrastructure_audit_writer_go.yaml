# ncgo exported template — internal/infrastructure/audit/writer.go
path: internal/infrastructure/audit/writer.go
update_behavior:
    type: cover
body: |-
    package audit

    import (
    	"context"
    	"sync"

    	"github.com/byx-darwin/rbac-rpc/internal/db/gen"
    )

    // Entry is a single audit log line.
    type Entry struct {
    	ActorUID   int64
    	Action     string
    	Target     string
    	DetailJSON string
    }

    // Writer records RBAC mutations for audit.
    type Writer interface {
    	Write(ctx context.Context, actorUID int64, action, target, detailJSON string) error
    }

    // SQLWriter persists audit entries via sqlc.
    type SQLWriter struct {
    	q *gen.Queries
    }

    // NewSQLWriter creates an audit writer backed by the audit_log table.
    func NewSQLWriter(q *gen.Queries) *SQLWriter {
    	return &SQLWriter{q: q}
    }

    func (w *SQLWriter) Write(ctx context.Context, actorUID int64, action, target, detailJSON string) error {
    	var actor *int64
    	if actorUID != 0 {
    		v := actorUID
    		actor = &v
    	}
    	_, err := w.q.InsertAuditLog(ctx, gen.InsertAuditLogParams{
    		ActorUid:   actor,
    		Action:     action,
    		Target:     target,
    		DetailJson: detailJSON,
    	})
    	return err
    }

    // MemoryWriter is a test-only in-memory audit writer.
    type MemoryWriter struct {
    	mu      sync.Mutex
    	entries []Entry
    }

    // NewMemoryWriter creates an in-memory audit writer.
    func NewMemoryWriter() *MemoryWriter {
    	return &MemoryWriter{}
    }

    func (w *MemoryWriter) Write(ctx context.Context, actorUID int64, action, target, detailJSON string) error {
    	w.mu.Lock()
    	defer w.mu.Unlock()
    	w.entries = append(w.entries, Entry{
    		ActorUID:   actorUID,
    		Action:     action,
    		Target:     target,
    		DetailJSON: detailJSON,
    	})
    	return nil
    }

    // Entries returns a copy of the recorded audit entries.
    func (w *MemoryWriter) Entries() []Entry {
    	w.mu.Lock()
    	defer w.mu.Unlock()
    	out := make([]Entry, len(w.entries))
    	copy(out, w.entries)
    	return out
    }

