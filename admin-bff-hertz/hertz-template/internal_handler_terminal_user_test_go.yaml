        h.UnbindIdentity(ctx, c)
        if f.lastUnbindReq != nil || c.Response.StatusCode() == 200 {{ "{" }}
            t.Fatal("unauthenticated admin unbind reached service")
        {{ "}" }}
        ctx, c = newTerminalUserTestCtx()
        c.Params = append(c.Params, param.Param{{ "{" }}Key: "uid", Value: "target"{{ "}" }}, param.Param{{ "{" }}Key: "provider", Value: "github-production"{{ "}" }})
        c.Set(middleware.ContextKeyTokenClaims, &middleware.Claims{{ "{" }}Uid: "verified-admin"{{ "}" }})
