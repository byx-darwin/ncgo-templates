name: Template Build Check

# 注：GitHub Actions 不允许同一事件同时使用 `paths` 与 `paths-ignore`，
# 因此用 `paths` 内的否定模式（`!`）代替单独的 paths-ignore，排除纯文档改动。
on:
  push:
    branches:
      - main
    paths: &watched-paths
      - 'rbac-kitex/**'
      - 'admin-services-kitex/**'
      - 'admin-bff-hertz/**'
      - 'rule-center/**'
      - 'user-kitex/**'
      - 'user-bff-hertz/**'
      - 'base-hertz/**'
      - 'ratelimit-hertz/**'
      - 'scripts/**'
      - '.github/workflows/template-build-check.yml'
      - '!**/*.md'
  pull_request:
    paths: *watched-paths

jobs:
  duplicate-path-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixture tests still pass
        run: |
          if scripts/check-duplicate-template-paths.sh scripts/testdata/dup-check-fixture/has-duplicate; then
            echo "expected has-duplicate fixture to fail the duplicate-path check, but it passed" >&2
            exit 1
          fi
          scripts/check-duplicate-template-paths.sh scripts/testdata/dup-check-fixture/clean

      - name: Check for duplicate path declarations
        run: scripts/check-duplicate-template-paths.sh admin-bff-hertz/hertz-template rbac-kitex/kitex-template admin-services-kitex/kitex-template rule-center/kitex-template user-kitex/kitex-template user-bff-hertz/hertz-template base-hertz/hertz-template ratelimit-hertz/hertz-template

  build-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rbac-kitex
            kind: kitex
            db: none
          - name: admin-services-kitex
            kind: kitex
            db: none
          - name: admin-bff-hertz
            kind: hertz
            db: postgres
          - name: rule-center
            kind: kitex
            db: none
          - name: user-kitex
            kind: kitex
            db: postgres
          - name: user-bff-hertz
            kind: hertz
            db: none
          - name: base-hertz
            kind: hertz
            db: none
          - name: ratelimit-hertz
            kind: hertz
            db: none
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # actions/setup-go does not export GOPATH into the environment for
      # later steps — it only ensures `go` and `$(go env GOPATH)/bin` are on
      # PATH. Tools invoked directly (e.g. `hz`, installed below) that read
      # the GOPATH env var rather than shelling out to `go env` fail with
      # "GOPATH is not set" without this.
      - name: Export GOPATH
        run: echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"

      # hz's protobuf code generation shells out to `protoc` directly; it is
      # not bundled with actions/setup-go or the ubuntu-latest runner image.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ncgo
        run: go install github.com/byx-darwin/ncgo@latest

      - name: Render ${{ matrix.name }}
        run: |
          ncgo new scratch \
            --module github.com/acme/scratch \
            --kind ${{ matrix.kind }} \
            --db ${{ matrix.db }} \
            --dir /tmp/scratch-${{ matrix.name }} \
            --template-dir ${{ matrix.name }}

      - name: Generate kitex-client RPC dependencies
        if: matrix.name == 'admin-bff-hertz'
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: |
          ncgo add kitex-client authority --idl idl/rbac.proto --service RBACService || test -f kitex_gen/api/rbac/v1/rbac.pb.go
          ncgo add kitex-client auth --idl idl/auth.proto --service AuthService || test -f kitex_gen/api/auth/v1/auth.pb.go
          ncgo add kitex-client rulecenter --idl idl/rule_center.proto --service RuleService || test -f kitex_gen/api/ratelimit/v1/rule_center.pb.go
          ncgo add kitex-client user --idl idl/user.proto --service UserService

      - name: Generate user BFF RPC dependencies
        if: matrix.name == 'user-bff-hertz'
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: |
          # The first client's tidy can fail until the second client exists.
          ncgo add kitex-client user --idl idl/user.proto --service UserService || test -f kitex_gen/api/user/v1/user.pb.go
          ncgo add kitex-client rulecenter --idl idl/rule_center.proto --service RuleService

      - name: Generate user database queries
        if: matrix.name == 'user-kitex'
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          make sqlc

      - name: Resolve generated dependencies
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: go mod tidy

      - name: Build
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: go build ./...

      - name: Vet
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: go vet ./...
