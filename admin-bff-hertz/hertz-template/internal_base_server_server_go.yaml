path: internal/base/server/server.go
update_behavior:
    type: cover
body: |
    package server

    import (
        "context"
        "log"
        "time"

        hertzframework "github.com/byx-darwin/go-tools/go-framework/hertz"
        gfconfig "github.com/byx-darwin/go-tools/go-framework/config"
        hertzobs "github.com/byx-darwin/go-tools/go-framework/hertz/observability"

        "{{.Module}}/internal/base/conf"
        "{{.Module}}/internal/handler/health"
        "{{.Module}}/internal/pkg/middleware"
        "{{.Module}}/internal/pkg/ratelimit"
        "{{.Module}}/internal/pkg/response"
        "{{.Module}}/internal/router"
        authservice "{{.Module}}/kitex_gen/api/auth/v1/authservice"
        rbacservice "{{.Module}}/kitex_gen/api/rbac/v1/rbacservice"
        ratelimitv1 "{{.Module}}/kitex_gen/api/ratelimit/v1"
        ruleservice "{{.Module}}/kitex_gen/api/ratelimit/v1/ruleservice"
        userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
    )

    func Run() {{ "{" }}
        cfg := conf.Get()

        // ncgo:wire:logging:init
        ctx := context.Background()
        h, err := hertzframework.NewHTTPServer(ctx, &cfg.Server)
        if err != nil {{ "{" }}
            log.Fatalf("create server: %v", err)
        {{ "}" }}

        // Responder middleware — injects RequestID / Lang / Responder into context
        responder := response.NewResponder()
        h.Use(responder.Middleware())

        // AccessLog middleware — uses go-tools AccessLog
        h.Use(middleware.AccessLog())

        // OTel tracing — enabled when server.jaeger config is present
        if cfg.Server.Jaeger != nil && cfg.Server.Jaeger.Enable {{ "{" }}
            provider, obsErr := hertzobs.NewProvider(ctx, gfconfig.ObservabilityConfig{{ "{" }}
                Enabled:     true,
                Endpoint:    cfg.Server.Jaeger.Endpoint,
                ServiceName: cfg.Server.Registry.Name,
            {{ "}" }})
            if obsErr != nil {{ "{" }}
                log.Fatalf("init observability: %v", obsErr)
            {{ "}" }}
            defer func() {{ "{" }}
                if shutdownErr := provider.Shutdown(); shutdownErr != nil {{ "{" }}
                    log.Printf("shutdown observability: %v", shutdownErr)
                {{ "}" }}
            {{ "}" }}()
            h.Use(provider.ServerMiddleware())
        {{ "}" }}

        // Optional structured logging wiring (after `ncgo add infra logging`):
        // import "{{.Module}}/internal/base/logging"
        // ncgo:wire:logging:server-middleware
        // h.Use(logging.HertzRecovery())
        // h.Use(logging.HertzRequestID())
        // h.Use(logging.HertzAccessLog())

        // Optional release canary wiring (after `ncgo add infra canary`):
        // import "{{.Module}}/internal/base/release"
        // ncgo:wire:canary:server-traffic
        // if cfg.Release.Enabled {{ "{" }}
        //     h.Use(release.HertzTraffic())
        // {{ "}" }}

        // ncgo:wire:ddd — Wire DDD layers (data -> repository -> usecase)

        // Create Kitex RPC clients
        rbacAddr := cfg.GRPC.Authority.HostPorts[0]

        rbacAuthCli, err := authservice.NewClient(
            cfg.GRPC.Authority.ServiceName,
            rpcClientOptions(rbacAddr)...,
        )
        if err != nil {{ "{" }}
            log.Fatalf("create rbac auth client: %v", err)
        {{ "}" }}

        rbacCli, err := rbacservice.NewClient(
            cfg.GRPC.Authority.ServiceName,
            rpcClientOptions(rbacAddr)...,
        )
        if err != nil {{ "{" }}
            log.Fatalf("create rbac client: %v", err)
        {{ "}" }}

        ruleCli, err := newRuleCenterClient(cfg)
        if err != nil {{ "{" }}
            log.Fatalf("create rule client: %v", err)
        {{ "}" }}

        userAddr := cfg.GRPC.TerminalUser.HostPorts[0]
        userCli, err := userservice.NewClient(
            cfg.GRPC.TerminalUser.ServiceName,
            rpcClientOptions(userAddr)...,
        )
        if err != nil {{ "{" }}
            log.Fatalf("create terminal-user client: %v", err)
        {{ "}" }}

        // Rate-limit resolver — reads local (config-defined) rules by
        // default; when rate_limit.source.type is set to "rule_center" it
        // instead resolves rules dynamically via the rule-center RPC client
        // above (GetRule resolves service, phase, method, path and app key). Used by the
        // password-reset route's middleware.RateLimit("password_change", ...).
        resolver := ratelimit.NewResolver(cfg.RateLimit, ratelimit.Options{{ "{" }}
            RuleCenter: ratelimitResolveFunc(ruleCli),
        {{ "}" }})

        // Register routes
        router.Register{{.ServiceName}}BffServiceRoutes(h, rbacAuthCli, rbacCli, ruleCli, userCli, resolver)

        health.Register(h)

        // Start server
        h.Spin()
    {{ "}" }}

    // newRuleCenterClient shares the standalone rule-center service between
    // rule-management routes and the dynamic rate-limit resolver.
    func newRuleCenterClient(cfg *conf.Config) (ruleservice.Client, error) {{ "{" }}
        return ruleservice.NewClient(
            cfg.GRPC.RuleCenter.ServiceName,
            rpcClientOptions(cfg.GRPC.RuleCenter.HostPorts[0])...,
        )
    {{ "}" }}

    // ratelimitResolveFunc delegates rule selection and pattern matching to
    // rule center, preserving all strategy and key settings for enforcement.
    func ratelimitResolveFunc(ruleCli ruleservice.Client) ratelimit.ResolveFunc {{ "{" }}
        return func(ctx context.Context, lookup ratelimit.Lookup) (*conf.RateLimitRuleConfig, bool, error) {{ "{" }}
            req := &ratelimitv1.GetRuleReq{{ "{" }}
                Service: lookup.Service,
                Phase:   lookup.Phase,
                Method:  lookup.Method,
                Path:    lookup.Path,
            {{ "}" }}
            if lookup.AppKey != "" {{ "{" }}
                req.AppKey = &lookup.AppKey
            {{ "}" }}
            resp, err := ruleCli.GetRule(ctx, req)
            if err != nil {{ "{" }}
                return nil, false, err
            {{ "}" }}
            if resp == nil || !resp.Found || resp.Rule == nil || !resp.Rule.Enabled {{ "{" }}
                return nil, false, nil
            {{ "}" }}
            rule := resp.Rule
            return &conf.RateLimitRuleConfig{{ "{" }}
                Enabled:           rule.Enabled,
                KeyBy:             append([]string(nil), rule.KeyBy...),
                Strategy:          rule.Strategy,
                WindowSeconds:     gfconfig.Duration{{ "{" }}Duration: time.Duration(rule.WindowSeconds) * time.Second{{ "}" }},
                MaxRequests:       int(rule.MaxRequests),
                RequestsPerSecond: rule.RequestsPerSecond,
                Burst:             int(rule.Burst),
                ClientTTLSeconds:  gfconfig.Duration{{ "{" }}Duration: time.Duration(rule.ClientTtlSeconds) * time.Second{{ "}" }},
            {{ "}" }}, true, nil
        {{ "}" }}
    {{ "}" }}
