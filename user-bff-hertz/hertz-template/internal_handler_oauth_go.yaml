path: internal/handler/oauth.go
update_behavior:
    type: skip
loop_service: true
body: |
    package handler

    import (
        "context"
        "encoding/json"
        "{{.Module}}/internal/base/conf"
        "{{.Module}}/internal/pkg/oauthcode"
        "{{.Module}}/internal/pkg/response"
        userv1 "{{.Module}}/kitex_gen/api/user/v1"
        userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
        "github.com/cloudwego/hertz/pkg/app"
        "net/url"
        "strings"
        "time"
    )

    type OAuthHandler struct {{ "{" }}
        userCli     userservice.Client
        redirectCfg conf.OAuthRedirectConfig
    {{ "}" }}

    // NewOAuthHandler retains legacy constructor arguments for source compatibility.
    // Account v2 exchange grants are hashed and consumed by the authority database;
    // the BFF never stores access/refresh credentials or reauthentication proofs.
    func NewOAuthHandler(cli userservice.Client, _ oauthcode.Store, cfg conf.OAuthRedirectConfig, _ time.Duration) *OAuthHandler {{ "{" }}
        return &OAuthHandler{{ "{" }}userCli: cli, redirectCfg: cfg{{ "}" }}
    {{ "}" }}
    func (h *OAuthHandler) Start(ctx context.Context, c *app.RequestContext) {{ "{" }}
        var r *accountRequest
        var ok bool
        if string(c.Method()) == "GET" {{ "{" }}
            client, valid := accountClient(c, string(c.Query("client_id")), true)
            if !valid {{ "{" }}
                return
            {{ "}" }}
            r = &accountRequest{{ "{" }}ClientID: client, Purpose: string(c.Query("purpose")), Proof: string(c.Query("proof")){{ "}" }}
        {{ "}" }} else {{ "{" }}
            r, ok = accountInput(c)
            if !ok {{ "{" }}
                return
            {{ "}" }}
        {{ "}" }}
        if r.Purpose == "" {{ "{" }}
            r.Purpose = "login"
        {{ "}" }}
        if r.Purpose != "login" {{ "{" }}
            if !NewAccountHandler(h.userCli).verify(ctx, c, r.ClientID) {{ "{" }}
                return
            {{ "}" }}
        {{ "}" }}
        v, e := h.userCli.AccountOAuthStart(ctx, &userv1.AccountOAuthStartReq{{ "{" }}ClientId: r.ClientID, ConfigId: c.Param("config"), Purpose: r.Purpose, Proof: r.Proof, AccessToken: accountBearer(c), ReturnUrl: h.redirectCfg.SuccessURL{{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}

    func oauthPrivateResponse(c *app.RequestContext) {{ "{" }}
        c.Response.Header.Set("Cache-Control", "no-store")
        c.Response.Header.Set("Referrer-Policy", "no-referrer")
    {{ "}" }}

    func (h *OAuthHandler) Callback(ctx context.Context, c *app.RequestContext) {{ "{" }}
        oauthPrivateResponse(c)
        r := &struct {{ "{" }}
            ClientID string  `json:"client_id"`
            State    string  `json:"state"`
            Code     *string `json:"code"`
            AuthCode *string `json:"auth_code"`
        {{ "}" }}{{ "{" }}{{ "}" }}
        browser := string(c.Method()) == "GET"
        if browser {{ "{" }}
            r.State = string(c.Query("state"))
            if c.Request.URI().QueryArgs().Has("code") {{ "{" }}
                v := string(c.Query("code"))
                r.Code = &v
            {{ "}" }}
            if c.Request.URI().QueryArgs().Has("auth_code") {{ "{" }}
                v := string(c.Query("auth_code"))
                r.AuthCode = &v
            {{ "}" }}
            r.ClientID = string(c.Query("client_id"))
        {{ "}" }} else if json.Unmarshal(c.Request.Body(), r) != nil {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return
        {{ "}" }}
        // Alipay web/SDK callbacks name the authorization code auth_code.
        // Ambiguous aliases must fail before consuming server-side OAuth state.
        if r.Code != nil && r.AuthCode != nil && *r.Code != *r.AuthCode {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return
        {{ "}" }}
        providerCode := ""
        if r.Code != nil {{ "{" }}
            providerCode = *r.Code
        {{ "}" }} else if r.AuthCode != nil {{ "{" }}
            providerCode = *r.AuthCode
        {{ "}" }}
        client, ok := accountClient(c, r.ClientID, false)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        if r.State == "" || providerCode == "" {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return
        {{ "}" }}
        v, e := h.userCli.AccountOAuthComplete(ctx, &userv1.AccountOAuthCompleteReq{{ "{" }}ClientId: client, ConfigId: c.Param("config"), State: r.State, Code: providerCode, ClientIp: c.ClientIP(), UserAgent: strings.TrimSpace(c.Request.Header.Get("User-Agent")){{ "}" }})
        if e != nil {{ "{" }}
            response.Err(c, e)
            return
        {{ "}" }}
        if v == nil || v.ClientId == "" || (client != "" && v.ClientId != client) {{ "{" }}
            response.ErrorCode(c, response.CodeTokenInvalid)
            return
        {{ "}" }}
        if v.Tokens != nil || v.Proof != "" {{ "{" }}
            response.ErrorCode(c, response.CodeTokenInvalid)
            return
        {{ "}" }}
        switch v.Purpose {{ "{" }}
        case "login", "reauth":
            if v.ExchangeCode == "" {{ "{" }}
                response.ErrorCode(c, response.CodeTokenInvalid)
                return
            {{ "}" }}
        case "bind", "replace":
            if v.ExchangeCode != "" {{ "{" }}
                response.ErrorCode(c, response.CodeTokenInvalid)
                return
            {{ "}" }}
        default:
            response.ErrorCode(c, response.CodeTokenInvalid)
            return
        {{ "}" }}
        if !browser {{ "{" }}
            if v.ExchangeCode != "" {{ "{" }}
                response.OK(c, map[string]string{{ "{" }}"code": v.ExchangeCode, "purpose": v.Purpose, "client_id": v.ClientId{{ "}" }})
            {{ "}" }} else {{ "{" }}
                response.OK(c, map[string]string{{ "{" }}"status": "ok", "purpose": v.Purpose, "client_id": v.ClientId{{ "}" }})
            {{ "}" }}
            return
        {{ "}" }}
        // The service returns only an exactly allowlisted URL from consumed OAuth state.
        target, e := url.Parse(v.ReturnUrl)
        if e != nil || (target.Scheme != "https" && target.Scheme != "http") || target.Host == "" || target.User != nil {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return
        {{ "}" }}
        q := target.Query()
        if v.ExchangeCode != "" {{ "{" }}
            q.Set("code", v.ExchangeCode)
        {{ "}" }} else {{ "{" }}
            q.Del("code")
            q.Set("status", "ok")
            q.Set("purpose", v.Purpose)
        {{ "}" }}
        target.RawQuery = q.Encode()
        c.Redirect(302, []byte(target.String()))
    {{ "}" }}
    func (h *OAuthHandler) Exchange(ctx context.Context, c *app.RequestContext) {{ "{" }}
        oauthPrivateResponse(c)
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        if r.Code == "" {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return
        {{ "}" }}
        result, err := h.userCli.AccountExchange(ctx, &userv1.AccountExchangeReq{{ "{" }}ClientId: r.ClientID, Code: r.Code{{ "}" }})
        if err != nil {{ "{" }}
            response.Err(c, err)
            return
        {{ "}" }}
        if result == nil {{ "{" }}
            response.ErrorCode(c, response.CodeTokenInvalid)
            return
        {{ "}" }}
        switch result.Purpose {{ "{" }}
        case "login":
            if result.Tokens == nil || result.Tokens.AccessToken == "" || result.Proof != "" {{ "{" }}
                response.ErrorCode(c, response.CodeTokenInvalid)
                return
            {{ "}" }}
            session, err := h.userCli.AccountVerify(ctx, &userv1.AccountTokenReq{{ "{" }}AccessToken: result.Tokens.AccessToken, ClientId: r.ClientID{{ "}" }})
            if err != nil || session == nil || session.Uid == "" || session.Uid != result.Tokens.Uid || session.ClientId != r.ClientID {{ "{" }}
                response.ErrorCode(c, response.CodeTokenInvalid)
                return
            {{ "}" }}
            response.OK(c, result.Tokens)
        case "reauth":
            if result.Proof == "" || result.Tokens != nil {{ "{" }}
                response.ErrorCode(c, response.CodeTokenInvalid)
                return
            {{ "}" }}
            response.OK(c, map[string]string{{ "{" }}"proof": result.Proof, "purpose": result.Purpose{{ "}" }})
        default:
            response.ErrorCode(c, response.CodeTokenInvalid)
        {{ "}" }}
    {{ "}" }}
