    {{ "}" }}
    func signedJWT(t *testing.T, key *rsa.PrivateKey, claims map[string]any) string {{ "{" }}
        t.Helper()
        header := base64.RawURLEncoding.EncodeToString([]byte(`{{ "{" }}"alg":"RS256","kid":"fixture"{{ "}" }}`))
        b, _ := json.Marshal(claims)
        part := header + "." + base64.RawURLEncoding.EncodeToString(b)
        h := sha256.Sum256([]byte(part))
        sig, e := rsa.SignPKCS1v15(rand.Reader, key, crypto.SHA256, h[:])
        if e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        return part + "." + base64.RawURLEncoding.EncodeToString(sig)
    {{ "}" }}
    func TestOIDCSignatureIssuerAudienceNonceAndPKCE(t *testing.T) {{ "{" }}
