body: |
    // Code generated by kitex generator.

    package server

    import (
    	"context"
    	"log"
    	"net"
    	"time"

    	"github.com/cloudwego/kitex/pkg/endpoint"
    	"github.com/cloudwego/kitex/pkg/rpcinfo"
    	"github.com/cloudwego/kitex/pkg/transmeta"
    	kitexserver "github.com/cloudwego/kitex/server"
    	"github.com/jackc/pgx/v5/pgxpool"

    	"github.com/byx-darwin/go-tools/go-framework/config"
    	"github.com/byx-darwin/go-tools/go-framework/kitex/observability"

    	authsvc "{{.Module}}/internal/application/auth"
    	menusvc "{{.Module}}/internal/application/menu"
    	permsvc "{{.Module}}/internal/application/permission"
    	rbacsvc "{{.Module}}/internal/application/rbac"
    	rolesvc "{{.Module}}/internal/application/role"
    	usersvc "{{.Module}}/internal/application/user"
    	"{{.Module}}/internal/base/conf"
    	"{{.Module}}/internal/base/data"
    	"{{.Module}}/internal/db/gen"
    	authservicehandler "{{.Module}}/internal/handler/authservice"
    	rbacservicehandler "{{.Module}}/internal/handler/rbacservice"
    	"{{.Module}}/internal/infrastructure/audit"
    	authinfra "{{.Module}}/internal/infrastructure/auth"
    	"{{.Module}}/internal/infrastructure/casbin"
    	tokeninfra "{{.Module}}/internal/infrastructure/token"
    	"{{.Module}}/internal/pkg/interceptor"
    	"{{.Module}}/internal/pkg/rpcerror"
    	menurepo "{{.Module}}/internal/repository/menu"
    	permissionrepo "{{.Module}}/internal/repository/permission"
    	rolerepo "{{.Module}}/internal/repository/role"
    	userrepo "{{.Module}}/internal/repository/user"
    	authservicepkg "{{.Module}}/kitex_gen/api/rbac/v1/authservice"
    	rbacservicepkg "{{.Module}}/kitex_gen/api/rbac/v1/rbacservice"
    	"github.com/samber/do/v2"
    )

    func Run(extraOptions ...kitexserver.Option) {{ "{" }}
    	cfg := conf.Get()
    	if cfg == nil {{ "{" }}
    		cfg = conf.Default()
    	{{ "}" }}

    	// OTel tracing — enabled when jaeger config is present
    	if cfg.Jaeger != nil && cfg.Jaeger.Enable {{ "{" }}
    		provider, err := observability.NewProvider(context.Background(), config.ObservabilityConfig{{ "{" }}
    			Enabled:     true,
    			Endpoint:    cfg.Jaeger.Endpoint,
    			ServiceName: cfg.Server.Registry.Name,
    		{{ "}" }})
    		if err != nil {{ "{" }}
    			log.Fatalf("init observability: %+v", err)
    		{{ "}" }}
    		defer func() {{ "{" }}
    			if shutdownErr := provider.Shutdown(); shutdownErr != nil {{ "{" }}
    				log.Printf("shutdown observability: %v", shutdownErr)
    			{{ "}" }}
    		{{ "}" }}()
    	{{ "}" }}

    	// ncgo:wire:logging:init

    	injector := do.New()
    	defer func() {{ "{" }} _ = injector.Shutdown() {{ "}" }}()
    	do.ProvideValue(injector, cfg)

    	// The RBAC authority always owns the database: postgres holds the
    	// relational grants, casbin_rule (enforcement source), and audit_log.
    	pool, cleanup := provideRepository(cfg.Database)
    	defer cleanup()
    	q := gen.New(pool)

    	userRepo := userrepo.New(q, pool)
    	roleRepo := rolerepo.New(q, pool)
    	permRepo := permissionrepo.New(q, pool)
    	menuRepo := menurepo.New(q, pool)

    	casbinStore := casbin.NewSQLPolicyStore(q)
    	enforcer, err := casbin.NewEnforcer(casbinStore)
    	if err != nil {{ "{" }}
    		log.Fatalf("init casbin enforcer: %+v", err)
    	{{ "}" }}

    	jwtMgr := authinfra.NewJWTManager(cfg.Auth.JWTSecret)
    	tokenStore := newTokenStore(cfg.Auth)
    	auditWriter := audit.NewSQLWriter(q)

    	authCfg := authsvc.Config{{ "{" }}
    		AccessTTLSeconds:  cfg.Auth.AccessTTLSeconds,
    		RefreshTTLSeconds: cfg.Auth.RefreshTTLSeconds,
    	{{ "}" }}
    	userSvc := usersvc.New(userRepo, roleRepo, enforcer, auditWriter)
    	roleSvc := rolesvc.New(roleRepo, permRepo, enforcer, auditWriter)
    	permSvc := permsvc.New(permRepo, enforcer, auditWriter)
    	menuSvc := menusvc.New(menuRepo, userRepo, roleRepo, permRepo, auditWriter)
    	rbacSvc := rbacsvc.New(enforcer)
    	authSvc := authsvc.New(userRepo, jwtMgr, tokenStore, auditWriter, authCfg)

    	addr, err := net.ResolveTCPAddr("tcp", cfg.Server.RPC.Port)
    	if err != nil {{ "{" }}
    		log.Fatalf("resolve server addr %q: %v", cfg.Server.RPC.Port, err)
    	{{ "}" }}

    	opts := []kitexserver.Option{{ "{" }}
    		kitexserver.WithServiceAddr(addr),
    		kitexserver.WithServerBasicInfo(&rpcinfo.EndpointBasicInfo{{ "{" }}ServiceName: cfg.Server.Registry.Name{{ "}" }}),
    		kitexserver.WithReadWriteTimeout(cfg.Server.Timeout.ReadWriteTimeout),
    		kitexserver.WithExitWaitTime(cfg.Server.Timeout.ExitWaitTimeout),
    		kitexserver.WithMetaHandler(transmeta.ServerTTHeaderHandler),
    		kitexserver.WithMiddleware(endpoint.Chain(
    			interceptor.RequestID(),
    			interceptor.AccessLog(),
    			interceptor.Recovery(),
    			interceptor.CallerAllowlist(
    				cfg.Auth.CallerAllowlist.Enabled,
    				cfg.Auth.CallerAllowlist.Header,
    				cfg.Auth.CallerAllowlist.AllowedCallers,
    				cfg.Auth.CallerAllowlist.AllowMissing,
    			),
    			interceptor.RequestTimeout(cfg.RPC.RequestTimeoutSeconds.Duration),
    		)),
    		kitexserver.WithErrorHandler(func(ctx context.Context, err error) error {{ "{" }}
    			_ = ctx
    			return rpcerror.ToBizError(err)
    		{{ "}" }}),
    	{{ "}" }}
    	opts = append(opts, extraOptions...)

    	// Register both services (AuthService + RBACService) on one server.
    	svr := kitexserver.NewServer(opts...)
    	if err := authservicepkg.RegisterService(svr, authservicehandler.NewAuthServiceImpl(authSvc)); err != nil {{ "{" }}
    		log.Fatalf("register AuthService: %v", err)
    	{{ "}" }}
    	if err := rbacservicepkg.RegisterService(svr, rbacservicehandler.NewRBACServiceImpl(userSvc, roleSvc, permSvc, menuSvc, rbacSvc)); err != nil {{ "{" }}
    		log.Fatalf("register RBACService: %v", err)
    	{{ "}" }}

    	if err := svr.Run(); err != nil {{ "{" }}
    		log.Fatalf("server.Run: %v", err)
    	{{ "}" }}
    {{ "}" }}

    // newTokenStore returns the configured token store. memory is the hermetic
    // default; redis is a documented production seam (type present, client unwired).
    func newTokenStore(cfg conf.AuthConfig) tokeninfra.Store {{ "{" }}
    	if cfg.TokenStore == "redis" {{ "{" }}
    		return tokeninfra.NewRedisStore(cfg.RedisAddr, "{{.ServiceName}}")
    	{{ "}" }}
    	return tokeninfra.NewMemoryStore()
    {{ "}" }}

    func provideRepository(cfg conf.DatabaseConfig) (*pgxpool.Pool, func()) {{ "{" }}
    	startupCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
    	defer cancel()

    	pgCfg, err := data.NewPostgresConfig(cfg.DSN)
    	if err != nil {{ "{" }}
    		log.Fatalf("build postgres config: %+v", err)
    	{{ "}" }}
    	applyPostgresPoolConfig(pgCfg, cfg)
    	pool, err := data.NewPostgres(startupCtx, pgCfg)
    	if err != nil {{ "{" }}
    		log.Fatalf("connect postgres: %+v", err)
    	{{ "}" }}
    	cleanup := func() {{ "{" }} pool.Close() {{ "}" }}
    	return pool, cleanup
    {{ "}" }}

    func applyPostgresPoolConfig(pgCfg *pgxpool.Config, cfg conf.DatabaseConfig) {{ "{" }}
    	if cfg.MaxConns > 0 {{ "{" }}
    		pgCfg.MaxConns = cfg.MaxConns
    	{{ "}" }}
    	if cfg.MinConns > 0 {{ "{" }}
    		pgCfg.MinConns = cfg.MinConns
    	{{ "}" }}
    	pgCfg.MaxConnLifetime = cfg.MaxConnLifetimeSeconds.Duration
    	pgCfg.MaxConnIdleTime = cfg.MaxConnIdleTimeSeconds.Duration
    	pgCfg.HealthCheckPeriod = cfg.HealthCheckPeriodSeconds.Duration
    {{ "}" }}
