body: |
    package handler

    import (
        "context"
        "encoding/json"
        "strings"

        "{{.Module}}/internal/pkg/response"
        userv1 "{{.Module}}/kitex_gen/api/user/v1"
        userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
        "github.com/cloudwego/hertz/pkg/app"
    )

    // AccountHandler forwards only request-derived credentials and client identity.
    // Persistent session verification is mandatory even when local JWT auth is disabled.
    type AccountHandler struct{{ "{" }} userCli userservice.Client {{ "}" }}

    func NewAccountHandler(cli userservice.Client) *AccountHandler {{ "{" }} return &AccountHandler{{ "{" }}userCli: cli{{ "}" }} {{ "}" }}

    type accountRequest struct {{ "{" }}
        ClientID     string `json:"client_id"`
        Kind         string `json:"kind"`
        Mode         string `json:"mode"`
        Identifier   string `json:"identifier"`
        Credential   string `json:"credential"`
        Purpose      string `json:"purpose"`
        RefreshToken string `json:"refresh_token"`
        Nickname     string `json:"nickname"`
        Avatar       string `json:"avatar"`
        Operation    string `json:"operation"`
        Code         string `json:"code"`
        Proof        string `json:"proof"`
        NewPassword  string `json:"new_password"`
        OldPassword  string `json:"old_password"`
        State        string `json:"state"`
    {{ "}" }}

    func accountInput(c *app.RequestContext) (*accountRequest, bool) {{ "{" }}
        r := &accountRequest{{ "{" }}{{ "}" }}
        if len(c.Request.Body()) > 0 {{ "{" }}
            if json.Unmarshal(c.Request.Body(), r) != nil {{ "{" }}
                response.ErrorCode(c, response.CodeRequestParamInvalid)
                return nil, false
            {{ "}" }}
        {{ "}" }}
        client, ok := accountClient(c, r.ClientID, true)
        if !ok {{ "{" }}
            return nil, false
        {{ "}" }}
        r.ClientID = client
        return r, true
    {{ "}" }}
    func accountClient(c *app.RequestContext, body string, required bool) (string, bool) {{ "{" }}
        header := strings.TrimSpace(c.Request.Header.Get("X-Client-ID"))
        body = strings.TrimSpace(body)
        if header != "" && body != "" && header != body {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return "", false
        {{ "}" }}
        if header == "" {{ "{" }}
            header = body
        {{ "}" }}
        if required && header == "" {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return "", false
        {{ "}" }}
        return header, true
    {{ "}" }}
    func accountBearer(c *app.RequestContext) string {{ "{" }}
        parts := strings.Fields(c.Request.Header.Get("Authorization"))
        if len(parts) != 2 || !strings.EqualFold(parts[0], "Bearer") {{ "{" }}
            return ""
        {{ "}" }}
        return parts[1]
    {{ "}" }}
    func (h *AccountHandler) verify(ctx context.Context, c *app.RequestContext, client string) bool {{ "{" }}
        if header := strings.TrimSpace(c.Request.Header.Get("X-Client-ID")); header == "" || header != client {{ "{" }}
            response.ErrorCode(c, response.CodeRequestParamInvalid)
            return false
        {{ "}" }}
        token := accountBearer(c)
        if token == "" {{ "{" }}
            response.ErrorCode(c, response.CodeTokenMissing)
            return false
        {{ "}" }}
        session, err := h.userCli.AccountVerify(ctx, &userv1.AccountTokenReq{{ "{" }}AccessToken: token, ClientId: client{{ "}" }})
        if err != nil || session == nil || session.Uid == "" || session.ClientId != client {{ "{" }}
            response.ErrorCode(c, response.CodeTokenInvalid)
            return false
        {{ "}" }}
        return true
    {{ "}" }}
    func (h *AccountHandler) SessionAuth() app.HandlerFunc {{ "{" }}
        return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
            client := strings.TrimSpace(c.Request.Header.Get("X-Client-ID"))
            if client == "" {{ "{" }}
                response.ErrorCode(c, response.CodeRequestParamInvalid)
                c.Abort()
                return
            {{ "}" }}
            if !h.verify(ctx, c, client) {{ "{" }}
                c.Abort()
                return
            {{ "}" }}
            c.Next(ctx)
        {{ "}" }}
    {{ "}" }}
    func accountResult(c *app.RequestContext, r any, err error) {{ "{" }}
        if err != nil {{ "{" }}
            response.Err(c, err)
            return
        {{ "}" }}
        response.OK(c, r)
    {{ "}" }}
    func (h *AccountHandler) Methods(ctx context.Context, c *app.RequestContext) {{ "{" }}
        client, ok := accountClient(c, "", true)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        r, e := h.userCli.AccountMethods(ctx, &userv1.AccountClientReq{{ "{" }}ClientId: client{{ "}" }})
        accountResult(c, r, e)
    {{ "}" }}
    func (h *AccountHandler) Code(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        if r.Purpose != "login" && r.Purpose != "reset" {{ "{" }}
            if !h.verify(ctx, c, r.ClientID) {{ "{" }}
                return
            {{ "}" }}
        {{ "}" }}
        v, e := h.userCli.AccountSendCode(ctx, &userv1.AccountCodeReq{{ "{" }}ClientId: r.ClientID, Kind: r.Kind, Identifier: r.Identifier, Purpose: r.Purpose, AccessToken: accountBearer(c), ClientIp: c.ClientIP(){{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Login(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountLogin(ctx, &userv1.AccountLoginReq{{ "{" }}ClientId: r.ClientID, Kind: r.Kind, Mode: r.Mode, Identifier: r.Identifier, Credential: r.Credential, ClientIp: c.ClientIP(), UserAgent: strings.TrimSpace(c.Request.Header.Get("User-Agent")){{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Refresh(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountRefresh(ctx, &userv1.AccountRefreshReq{{ "{" }}ClientId: r.ClientID, RefreshToken: r.RefreshToken{{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Logout(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountLogout(ctx, &userv1.AccountTokenReq{{ "{" }}ClientId: r.ClientID, AccessToken: accountBearer(c){{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Me(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountProfile(ctx, &userv1.AccountTokenReq{{ "{" }}ClientId: r.ClientID, AccessToken: accountBearer(c){{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) UpdateMe(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountUpdateProfile(ctx, &userv1.AccountProfileReq{{ "{" }}ClientId: r.ClientID, AccessToken: accountBearer(c), Nickname: r.Nickname, Avatar: r.Avatar{{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Reauthenticate(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountReauthenticate(ctx, &userv1.AccountProofReq{{ "{" }}ClientId: r.ClientID, AccessToken: accountBearer(c), Kind: r.Kind, Mode: r.Mode, Identifier: r.Identifier, Credential: r.Credential, ClientIp: c.ClientIP(){{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Contact(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountContact(ctx, &userv1.AccountContactReq{{ "{" }}ClientId: r.ClientID, AccessToken: accountBearer(c), Kind: r.Kind, Operation: r.Operation, Identifier: r.Identifier, Code: r.Code, Proof: r.Proof, ClientIp: c.ClientIP(){{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) Password(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        v, e := h.userCli.AccountPassword(ctx, &userv1.AccountPasswordReq{{ "{" }}ClientId: r.ClientID, AccessToken: accountBearer(c), NewPassword: r.NewPassword, OldPassword: r.OldPassword, Proof: r.Proof{{ "}" }})
        accountResult(c, v, e)
    {{ "}" }}
    func (h *AccountHandler) RequestReset(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        _, e := h.userCli.AccountSendCode(ctx, &userv1.AccountCodeReq{{ "{" }}ClientId: r.ClientID, Kind: r.Kind, Identifier: r.Identifier, Purpose: "reset", ClientIp: c.ClientIP(){{ "}" }})
        accountResult(c, map[string]string{{ "{" }}"status": "ok"{{ "}" }}, e)
    {{ "}" }}
    func (h *AccountHandler) ConfirmReset(ctx context.Context, c *app.RequestContext) {{ "{" }}
        r, ok := accountInput(c)
        if !ok {{ "{" }}
            return
        {{ "}" }}
        _, e := h.userCli.AccountResetPassword(ctx, &userv1.AccountResetReq{{ "{" }}ClientId: r.ClientID, Kind: r.Kind, Identifier: r.Identifier, Code: r.Code, NewPassword: r.NewPassword, ClientIp: c.ClientIP(){{ "}" }})
        accountResult(c, map[string]string{{ "{" }}"status": "ok"{{ "}" }}, e)
    {{ "}" }}
