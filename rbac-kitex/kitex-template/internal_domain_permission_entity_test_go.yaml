    func TestNewAcceptsValidCatalog(t *testing.T) {{ "{" }}
    	p, err := New("system", TypeCatalog, "System", 0, "/system", "setting", "", "", nil, nil, boolPtr(false), "", 1, StatusEnabled, "System module")
    	if err != nil {{ "{" }}
