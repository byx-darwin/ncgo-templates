# ncgo exported template — internal/pkg/middleware/authz.go
path: internal/pkg/middleware/authz.go
update_behavior:
    type: cover
body: |
    package middleware

    import (
    	"context"
        "{{.Module}}/internal/pkg/authz"
        "{{.Module}}/internal/base/conf"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/response"
    	api "{{.Module}}/kitex_gen/api/rbac/v1"
    	rbacservice "{{.Module}}/kitex_gen/api/rbac/v1/rbacservice"
    )

    type permissionKey struct{{ "{" }}{{ "}" }}

    // SetPermission stores the required permission in the request context
    func SetPermission(c *app.RequestContext, code string) {{ "{" }}
    	c.Set("permission", code)
    {{ "}" }}

    // GetPermission retrieves the required permission from the request context
    func GetPermission(c *app.RequestContext) string {{ "{" }}
    	val, exists := c.Get("permission")
    	if !exists {{ "{" }}
    		return ""
    	{{ "}" }}
    	code, _ := val.(string)
    	return code
    {{ "}" }}

    // RequirePermission sets the required permission for a route
    func RequirePermission(code string) app.HandlerFunc {{ "{" }}
    	return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
    		SetPermission(c, code)
    		c.Next(ctx)
    	{{ "}" }}
    {{ "}" }}

    // Authz returns an authorization middleware that checks permissions via RBAC service
    func Authz(rbacCli rbacservice.Client) app.HandlerFunc {{ "{" }}
    	return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
    		perm := GetPermission(c)
    		if perm == "" {{ "{" }}
    			c.Next(ctx)
    			return
    		{{ "}" }}

    		claims, ok := GetClaims(c)
            if !ok || claims == nil || claims.Uid == "" {{ "{" }}
    			response.ErrorCode(c, response.CodeUnauthorized)
    			c.Abort()
    			return
    		{{ "}" }}

            if rbacCli == nil {{ "{" }}
                response.ErrorCode(c, response.CodeInternalError)
                c.Abort()
                return
            {{ "}" }}
    		resp, err := rbacCli.Enforce(ctx, &api.EnforceReq{{ "{" }}
    			Uid: claims.Uid,
    			Obj: perm,
                Act: authz.ActExecute,
    		{{ "}" }})
    		if err != nil {{ "{" }}
    			response.ErrorCode(c, response.CodeInternalError)
    			c.Abort()
    			return
    		{{ "}" }}

            if resp == nil || !resp.Allowed {{ "{" }}
    			response.ErrorCode(c, response.CodePermissionDenied)
    			c.Abort()
    			return
    		{{ "}" }}

    		c.Next(ctx)
    	{{ "}" }}
    {{ "}" }}

    // RouteTokenAuth authenticates every registered non-public route before the
    // global permission gate. Public exemptions are explicit in authz.Routes.
    func RouteTokenAuth(cfg conf.TokenConfig, verifier TokenVerifier) app.HandlerFunc {{ "{" }}
        authenticate := TokenAuth(cfg, verifier)
        return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
            rp, ok := authz.Lookup(string(c.Request.Method()), c.FullPath())
            if !ok || rp.Public {{ "{" }}
                c.Next(ctx)
                return
            {{ "}" }}
            authenticate(ctx, c)
        {{ "}" }}
    {{ "}" }}

    // EnforceRoutes denies matched routes absent from the table, including new
    // routes that accidentally omit a guard. Unmatched paths retain Hertz's 404.
    func EnforceRoutes(rbacCli rbacservice.Client) app.HandlerFunc {{ "{" }}
        enforce := Authz(rbacCli)
        return func(ctx context.Context, c *app.RequestContext) {{ "{" }}
            if c.FullPath() == "" {{ "{" }} c.Next(ctx); return {{ "}" }}
            rp, ok := authz.Lookup(string(c.Request.Method()), c.FullPath())
            if !ok {{ "{" }} response.ErrorCode(c, response.CodePermissionDenied); c.Abort(); return {{ "}" }}
            if !rp.Public {{ "{" }}
                claims, authenticated := GetClaims(c)
                if !authenticated || claims == nil || claims.Uid == "" {{ "{" }}
                    response.ErrorCode(c, response.CodeUnauthorized); c.Abort(); return
                {{ "}" }}
            {{ "}" }}
            SetPermission(c, rp.Code)
            enforce(ctx, c)
        {{ "}" }}
    {{ "}" }}
