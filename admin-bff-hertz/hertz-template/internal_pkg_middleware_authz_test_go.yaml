# ncgo exported template — internal/pkg/middleware/authz_test.go
path: internal/pkg/middleware/authz_test.go
update_behavior:
    type: cover
body: |
    package middleware_test

    import (
    	"context"
    	"testing"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/middleware"
    )

    func TestAuthz_NoPermission_SkipsEnforce(t *testing.T) {{ "{" }}
    	ctx := context.Background()
    	c := &app.RequestContext{{ "{" }}{{ "}" }}

    	called := false
    	handler := func(ctx context.Context, c *app.RequestContext) {{ "{" }}
    		called = true
    	{{ "}" }}

    	// Test RequirePermission sets the permission
    	middleware.RequirePermission("user:create")(ctx, c)

    	perm := middleware.GetPermission(c)
    	if perm != "user:create" {{ "{" }}
    		t.Errorf("expected permission user:create, got %s", perm)
    	{{ "}" }}

    	// Clean up for next test
    	c2 := &app.RequestContext{{ "{" }}{{ "}" }}
    	handler(ctx, c2)

    	if !called {{ "{" }}
    		t.Error("expected handler to be called when no permission required")
    	{{ "}" }}
    {{ "}" }}
