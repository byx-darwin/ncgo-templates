    func TestConcurrentCodeRedemptionCreatesOneUser(t *testing.T) {{ "{" }}
        s, f := fixture(t)
        ctx := context.Background()
        if e := s.SendCode(ctx, CodeInput{{ "{" }}ClientID: "web", Kind: "phone", Identifier: "13800138000", Purpose: "login"{{ "}" }}); e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        code := f.code
        results := make(chan error, 2)
        start := make(chan struct{{ "{" }}{{ "}" }})
        for i := 0; i < 2; i++ {{ "{" }}
            go func() {{ "{" }}
                <-start
                _, e := s.Login(ctx, LoginInput{{ "{" }}ClientID: "web", Kind: "phone", Mode: "code", Identifier: "13800138000", Credential: code{{ "}" }})
                results <- e
            {{ "}" }}()
        {{ "}" }}
        close(start)
        wins := 0
        for i := 0; i < 2; i++ {{ "{" }}
            if <-results == nil {{ "{" }}
                wins++
            {{ "}" }}
        {{ "}" }}
        if wins != 1 {{ "{" }}
            t.Fatalf("redemption winners=%d", wins)
        {{ "}" }}
        var count int
        if e := s.pool.QueryRow(ctx, "SELECT count(*) FROM users").Scan(&count); e != nil || count != 1 {{ "{" }}
            t.Fatal(count, e)
        {{ "}" }}
    {{ "}" }}
    func TestConcurrentRefreshAndRevocationCannotReviveSession(t *testing.T) {{ "{" }}
        s, f := fixture(t)
        ctx := context.Background()
        tok := loginCode(t, s, f, "13800138000")
        type result struct {{ "{" }}
            tokens Tokens
            err    error
        {{ "}" }}
        out := make(chan result, 2)
        start := make(chan struct{{ "{" }}{{ "}" }})
        for i := 0; i < 2; i++ {{ "{" }}
            go func() {{ "{" }} <-start; v, e := s.Refresh(ctx, tok.RefreshToken, "web"); out <- result{{ "{" }}v, e{{ "}" }} {{ "}" }}()
        {{ "}" }}
        close(start)
        wins := 0
        var current Tokens
        for i := 0; i < 2; i++ {{ "{" }}
            r := <-out
            if r.err == nil {{ "{" }}
                wins++
                current = r.tokens
            {{ "}" }}
        {{ "}" }}
        if wins != 1 {{ "{" }}
            t.Fatalf("refresh winners=%d", wins)
        {{ "}" }}
        refreshed := make(chan result, 1)
        revoked := make(chan error, 1)
        tx, e := s.pool.Begin(ctx)
        if e != nil {{ "{" }}
            t.Fatal(e)
        {{ "}" }}
        if _, e = lockUser(ctx, tx, tok.UID); e != nil {{ "{" }}
