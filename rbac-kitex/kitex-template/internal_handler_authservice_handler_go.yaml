# ncgo exported template — internal/handler/authservice/handler.go
path: internal/handler/authservice/handler.go
update_behavior:
    type: skip

body: |
    package authservicehandler

    import (
    	"context"

    	authsvc "{{.Module}}/internal/application/auth"
    	"{{.Module}}/internal/pkg/rpcerror"
    	v1 "{{.Module}}/kitex_gen/api/rbac/v1"
    )

    // AuthServiceImpl implements the Kitex-generated AuthService interface by
    // delegating to the auth application service.
    type AuthServiceImpl struct {{ "{" }}
    	auth *authsvc.Service
    {{ "}" }}

    // NewAuthServiceImpl creates an AuthServiceImpl.
    func NewAuthServiceImpl(auth *authsvc.Service) *AuthServiceImpl {{ "{" }}
    	return &AuthServiceImpl{{ "{" }}auth: auth{{ "}" }}
    {{ "}" }}

    // Login verifies credentials and returns an access/refresh token pair.
    func (s *AuthServiceImpl) Login(ctx context.Context, req *v1.LoginReq) (resp *v1.LoginResp, err error) {{ "{" }}
    	out, err := s.auth.Login(ctx, authsvc.LoginInput{{ "{" }}Username: req.Username, Password: req.Password{{ "}" }})
    	if err != nil {{ "{" }}
    		return nil, rpcerror.ToBizError(err)
    	{{ "}" }}
    	return &v1.LoginResp{{ "{" }}
    		AccessToken:  out.AccessToken,
    		RefreshToken: out.RefreshToken,
    		ExpiresIn:    out.ExpiresIn,
    	{{ "}" }}, nil
    {{ "}" }}

    // Refresh rotates a refresh token into a new token pair.
    func (s *AuthServiceImpl) Refresh(ctx context.Context, req *v1.RefreshReq) (resp *v1.LoginResp, err error) {{ "{" }}
    	out, err := s.auth.Refresh(ctx, authsvc.RefreshInput{{ "{" }}RefreshToken: req.RefreshToken{{ "}" }})
    	if err != nil {{ "{" }}
    		return nil, rpcerror.ToBizError(err)
    	{{ "}" }}
    	return &v1.LoginResp{{ "{" }}
    		AccessToken:  out.AccessToken,
    		RefreshToken: out.RefreshToken,
    	{{ "}" }}, nil
    {{ "}" }}

    // Logout blacklists the presented access token.
    func (s *AuthServiceImpl) Logout(ctx context.Context, req *v1.LogoutReq) (resp *v1.LogoutResp, err error) {{ "{" }}
    	if err := s.auth.Logout(ctx, req.AccessToken); err != nil {{ "{" }}
    		return nil, rpcerror.ToBizError(err)
    	{{ "}" }}
    	return &v1.LogoutResp{{ "{" }}{{ "}" }}, nil
    {{ "}" }}

    // ValidateToken verifies an access token and returns its claims.
    func (s *AuthServiceImpl) ValidateToken(ctx context.Context, req *v1.ValidateTokenReq) (resp *v1.ValidateTokenResp, err error) {{ "{" }}
    	out, err := s.auth.ValidateToken(ctx, req.AccessToken)
    	if err != nil {{ "{" }}
    		return nil, rpcerror.ToBizError(err)
    	{{ "}" }}
    	return &v1.ValidateTokenResp{{ "{" }}Uid: out.UID, Roles: out.Roles, Valid: out.Valid{{ "}" }}, nil
    {{ "}" }}
