body: |
    package handler

    import (
    	"context"
    	"encoding/json"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/response"
    	api "{{.Module}}/kitex_gen/api/rbac/v1"
    	rbacservice "{{.Module}}/kitex_gen/api/rbac/v1/rbacservice"
    )

    type PermissionHandler struct {{ "{" }}
    	rbacCli rbacservice.Client
    {{ "}" }}

    func NewPermissionHandler(rbacCli rbacservice.Client) *PermissionHandler {{ "{" }}
    	return &PermissionHandler{{ "{" }}rbacCli: rbacCli{{ "}" }}
    {{ "}" }}

    func (h *PermissionHandler) List(ctx context.Context, c *app.RequestContext) {{ "{" }}
        resp, err := h.rbacCli.ListPermissions(ctx, &api.ListPermissionsReq{{ "{" }}Page: 1, PageSize: 100{{ "}" }})
    	if err != nil {{ "{" }}
            response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, resp.Permissions)
    {{ "}" }}

    func (h *PermissionHandler) Get(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	id := c.Param("id")

    	resp, err := h.rbacCli.GetPermission(ctx, &api.GetPermissionReq{{ "{" }}Id: id{{ "}" }})
    	if err != nil {{ "{" }}
            response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, resp.Permission)
    {{ "}" }}

    func (h *PermissionHandler) Create(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req api.CreatePermissionReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}

    	resp, err := h.rbacCli.CreatePermission(ctx, &req)
    	if err != nil {{ "{" }}
            response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, resp.Permission)
    {{ "}" }}

    func (h *PermissionHandler) Update(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	id := c.Param("id")

    	var req api.UpdatePermissionReq
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}
    	req.Id = id

    	resp, err := h.rbacCli.UpdatePermission(ctx, &req)
    	if err != nil {{ "{" }}
            response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, resp.Permission)
    {{ "}" }}

    func (h *PermissionHandler) Delete(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	id := c.Param("id")

    	_, err := h.rbacCli.DeletePermission(ctx, &api.DeletePermissionReq{{ "{" }}Id: id{{ "}" }})
    	if err != nil {{ "{" }}
            response.Err(c, err)
    		return
    	{{ "}" }}
    	response.OK(c, map[string]string{{ "{" }}"status": "deleted"{{ "}" }})
    {{ "}" }}

    // Tree reads every permission page so grants are not truncated at 100 rows.
    func (h *PermissionHandler) Tree(ctx context.Context, c *app.RequestContext) {{ "{" }}
        items := make([]*api.Permission, 0)
        for page := int32(1); ; page++ {{ "{" }}
            resp, err := h.rbacCli.ListPermissions(ctx, &api.ListPermissionsReq{{ "{" }}Page: page, PageSize: 1000{{ "}" }})
            if err != nil {{ "{" }}
                response.Err(c, err)
                return
            {{ "}" }}
            items = append(items, resp.Permissions...)
            if len(items) >= int(resp.Total) || len(resp.Permissions) == 0 {{ "{" }}
                break
            {{ "}" }}
        {{ "}" }}
        response.OK(c, permissionTree(items))
    {{ "}" }}

    type permissionNode struct {{ "{" }}
        *api.Permission
        Children []*permissionNode `json:"children"`
    {{ "}" }}

    func permissionTree(items []*api.Permission) []*permissionNode {{ "{" }}
        nodes := make(map[string]*permissionNode, len(items))
        for _, p := range items {{ "{" }}
            nodes[p.Id] = &permissionNode{{ "{" }}Permission: p, Children: make([]*permissionNode, 0){{ "}" }}
        {{ "}" }}
        roots := make([]*permissionNode, 0)
        for _, p := range items {{ "{" }}
            n := nodes[p.Id]
            if parent, ok := nodes[p.ParentId]; ok && p.ParentId != p.Id {{ "{" }}
                parent.Children = append(parent.Children, n)
            {{ "}" }} else {{ "{" }}
                roots = append(roots, n)
            {{ "}" }}
        {{ "}" }}
        return roots
    {{ "}" }}
