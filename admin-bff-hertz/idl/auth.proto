syntax = "proto3";

package api.auth.v1;

option go_package = "{{.Module}}/kitex_gen/api/auth/v1;authv1";

import "api.proto";

// AuthService handles authentication operations
service AuthService {
  rpc Login(LoginReq) returns (LoginResp);
  rpc Refresh(RefreshReq) returns (RefreshResp);
  rpc Logout(LogoutReq) returns (LogoutResp);
}

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginResp {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RefreshReq {
  string refresh_token = 1;
}

message RefreshResp {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutReq {
  string user_id = 1;
}

message LogoutResp {
  bool success = 1;
}
