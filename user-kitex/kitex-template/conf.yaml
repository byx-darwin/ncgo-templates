# ncgo exported template — internal/base/conf/conf.go
path: internal/base/conf/conf.go
update_behavior:
    type: cover
body: |-
    // Code generated by kitex generator.

    package conf

    import (
        "os"
        "path/filepath"
        "sync"
        "time"

        goerror "github.com/byx-darwin/go-tools/go-common/error"
        "github.com/byx-darwin/go-tools/go-framework/config"
        kitexconfig "github.com/byx-darwin/go-tools/go-framework/config/kitex"
        frameworkerror "github.com/byx-darwin/go-tools/go-framework/error"
    )

    var (
        current *Config
        once    sync.Once
        initErr error
    )

    type Config struct {
        Env      string                   `json:"env" yaml:"env"`
        Debug    bool                     `json:"debug" yaml:"debug"`
        Server   kitexconfig.ServerConfig `json:"server" yaml:"server"`
        RPC      RPCConfig                `json:"rpc" yaml:"rpc"`
        Auth     AuthConfig               `json:"auth" yaml:"auth"`
        Database DatabaseConfig           `json:"database" yaml:"database"`
        Redis    RedisConfig              `json:"redis" yaml:"redis"`
        OAuth    OAuthConfig              `json:"oauth" yaml:"oauth"`
        Log      LogConfig                `json:"log" yaml:"log"`
        Jaeger   *config.JaegerOption     `json:"jaeger" yaml:"jaeger"`
    }

    type LogConfig struct {
        Level  string `json:"level" yaml:"level"`
        Format string `json:"format" yaml:"format"`
        Mode   string `json:"mode" yaml:"mode"`
    }

    type RPCConfig struct {
        RequestTimeoutSeconds config.Duration `json:"request_timeout_seconds" yaml:"request_timeout_seconds"`
    }

    // AuthConfig carries the JWT signing secret and access-token TTL used to
    // issue tokens on local login, OAuth callback, and registration.
    type AuthConfig struct {
        JWTSecret        string `json:"jwt_secret" yaml:"jwt_secret"`
        AccessTTLSeconds int    `json:"access_ttl_seconds" yaml:"access_ttl_seconds"`
    }

    type DatabaseConfig struct {
        Enabled                  bool            `json:"enabled" yaml:"enabled"`
        DSN                      string          `json:"dsn" yaml:"dsn"`
        MaxConns                 int32           `json:"max_conns" yaml:"max_conns"`
        MinConns                 int32           `json:"min_conns" yaml:"min_conns"`
        MaxConnLifetimeSeconds   config.Duration `json:"max_conn_lifetime_seconds" yaml:"max_conn_lifetime_seconds"`
        MaxConnIdleTimeSeconds   config.Duration `json:"max_conn_idle_time_seconds" yaml:"max_conn_idle_time_seconds"`
        HealthCheckPeriodSeconds config.Duration `json:"health_check_period_seconds" yaml:"health_check_period_seconds"`
    }

    // RedisConfig backs the OAuth CSRF-state store (oauth.NewRedisStateStore)
    // and the admin force-logout blacklist. Disabled by default so a project
    // without Redis still builds and boots hermetically; OAuth start/callback
    // and force-logout RPCs fail at call time until enabled.
    type RedisConfig struct {
        Enabled  bool   `json:"enabled" yaml:"enabled"`
        Addr     string `json:"addr" yaml:"addr"`
        Password string `json:"password" yaml:"password"`
        DB       int    `json:"db" yaml:"db"`
    }

    // OAuthConfig enables/disables each of the five bundled third-party
    // login adapters (wechat/alipay/github/google/oidc). All five adapters
    // are always generated into the project; disabled providers are simply
    // never registered into the runtime oauth.Registry (see server.go).
    type OAuthConfig struct {
        Wechat OAuthProviderConfig `json:"wechat" yaml:"wechat"`
        Alipay OAuthProviderConfig `json:"alipay" yaml:"alipay"`
        GitHub OAuthProviderConfig `json:"github" yaml:"github"`
        Google OAuthProviderConfig `json:"google" yaml:"google"`
        OIDC   OIDCProviderConfig  `json:"oidc" yaml:"oidc"`
    }

    type OAuthProviderConfig struct {
        Enabled      bool   `json:"enabled" yaml:"enabled"`
        ClientID     string `json:"client_id" yaml:"client_id"`
        ClientSecret string `json:"client_secret" yaml:"client_secret"`
        RedirectURL  string `json:"redirect_url" yaml:"redirect_url"`
    }

    type OIDCProviderConfig struct {
        OAuthProviderConfig `json:",inline" yaml:",inline"`
        AuthEndpoint         string `json:"auth_endpoint" yaml:"auth_endpoint"`
        TokenEndpoint        string `json:"token_endpoint" yaml:"token_endpoint"`
        UserInfoEndpoint     string `json:"user_info_endpoint" yaml:"user_info_endpoint"`
    }

    func Init() error {
        once.Do(func() {
            current, initErr = Load()
        })
        return initErr
    }

    func Get() *Config { return current }

    func Load() (*Config, error) {
        cfg := Default()
        path := os.Getenv("CONFIG_PATH")
        fromEnv := path != ""
        if path == "" {
            path = filepath.Join("conf", Env(), "conf.yaml")
        }
        loaded, err := config.LoadYAML[Config](path)
        if err != nil {
            if os.IsNotExist(err) && !fromEnv {
                return cfg, nil
            }
            return nil, goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").With("path", path).Wrap(err)
        }
        *cfg = *loaded
        if err := cfg.Validate(); err != nil {
            return nil, err
        }
        return cfg, nil
    }

    func Default() *Config {
        return &Config{
            Env:   Env(),
            Debug: Env() != "prod",
            Server: kitexconfig.ServerConfig{
                RPC: &kitexconfig.RPCOption{
                    Port:    ":8888",
                    Network: "tcp",
                },
                Registry: &config.RegistryOption{
                    Name: "{{ToLower .ServiceInfo.ServiceName}}",
                },
                Timeout: &kitexconfig.ServerTimeout{
                    ReadWriteTimeout: 30 * time.Second,
                    ExitWaitTimeout:  10 * time.Second,
                },
            },
            RPC: RPCConfig{RequestTimeoutSeconds: config.Duration{Duration: 3 * time.Second}},
            Auth: AuthConfig{
                JWTSecret:        "dev-secret-change-me",
                AccessTTLSeconds: 3600,
            },
            Database: DatabaseConfig{
                Enabled:                  false,
                MaxConns:                 20,
                MinConns:                 2,
                MaxConnLifetimeSeconds:   config.Duration{Duration: 1800 * time.Second},
                MaxConnIdleTimeSeconds:   config.Duration{Duration: 300 * time.Second},
                HealthCheckPeriodSeconds: config.Duration{Duration: 30 * time.Second},
            },
            Redis: RedisConfig{
                Enabled: false,
                Addr:    "127.0.0.1:6379",
            },
            OAuth: OAuthConfig{
                Wechat: OAuthProviderConfig{Enabled: false},
                Alipay: OAuthProviderConfig{Enabled: false},
                GitHub: OAuthProviderConfig{Enabled: false},
                Google: OAuthProviderConfig{Enabled: false},
                OIDC:   OIDCProviderConfig{OAuthProviderConfig: OAuthProviderConfig{Enabled: false}},
            },
            Log: LogConfig{
                Level:  "info",
                Format: "json",
                Mode:   "both",
            },
        }
    }

    func (c *Config) Validate() error {
        if c.Server.Registry.Name == "" {
            return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("server.registry.name is empty")
        }
        if c.Server.RPC.Port == "" {
            return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("server.rpc.port is empty")
        }
        if c.Server.Timeout.ReadWriteTimeout <= 0 || c.Server.Timeout.ExitWaitTimeout <= 0 || c.RPC.RequestTimeoutSeconds.Duration < 0 {
            return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("timeout values must be positive")
        }
        if c.Auth.JWTSecret == "" {
            return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("auth.jwt_secret is empty")
        }
        if c.Auth.AccessTTLSeconds <= 0 {
            return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("auth.access_ttl_seconds must be positive")
        }
        if c.Database.Enabled {
            if c.Database.DSN == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("database.dsn is empty")
            }
            if c.Database.MaxConns < 0 || c.Database.MinConns < 0 || c.Database.MaxConnLifetimeSeconds.Duration < 0 || c.Database.MaxConnIdleTimeSeconds.Duration < 0 || c.Database.HealthCheckPeriodSeconds.Duration < 0 {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("database pool settings must not be negative")
            }
        }
        if c.Redis.Enabled && c.Redis.Addr == "" {
            return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("redis.addr is empty")
        }
        for name, p := range map[string]OAuthProviderConfig{
            "wechat": c.OAuth.Wechat,
            "alipay": c.OAuth.Alipay,
            "github": c.OAuth.GitHub,
            "google": c.OAuth.Google,
            "oidc":   c.OAuth.OIDC.OAuthProviderConfig,
        } {
            if !p.Enabled {
                continue
            }
            if p.ClientID == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("oauth." + name + ".client_id is empty")
            }
            if p.ClientSecret == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("oauth." + name + ".client_secret is empty")
            }
            if p.RedirectURL == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("oauth." + name + ".redirect_url is empty")
            }
        }
        if c.OAuth.OIDC.Enabled {
            if c.OAuth.OIDC.AuthEndpoint == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("oauth.oidc.auth_endpoint is empty")
            }
            if c.OAuth.OIDC.TokenEndpoint == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("oauth.oidc.token_endpoint is empty")
            }
            if c.OAuth.OIDC.UserInfoEndpoint == "" {
                return goerror.In("config").Code(frameworkerror.CodeConfigInvalid).Public("config_invalid").New("oauth.oidc.user_info_endpoint is empty")
            }
        }
        return nil
    }

    func Env() string {
        if env := os.Getenv("GO_ENV"); env != "" {
            return env
        }
        return "dev"
    }
