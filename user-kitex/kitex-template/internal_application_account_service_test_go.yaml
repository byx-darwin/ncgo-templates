        enableOAuth(f)
        tok := oauthLogin(t, s, "external-a")
        proof := oauthProof(t, s, tok, "external-a")
        s.SendCode(ctx, CodeInput{{ "{" }}ClientID: "web", Kind: "phone", Identifier: "13800138000", Purpose: "bind", AccessToken: tok.AccessToken{{ "}" }})
        if e := s.Contact(ctx, ContactInput{{ "{" }}AccessToken: tok.AccessToken, ClientID: "web", Kind: "phone", Operation: "bind", Identifier: "13800138000", Code: f.code, Proof: proof{{ "}" }}); e != nil {{ "{" }}
