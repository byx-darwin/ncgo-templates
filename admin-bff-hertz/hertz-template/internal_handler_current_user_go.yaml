# ncgo exported template — internal/handler/current_user.go
path: internal/handler/current_user.go
update_behavior:
    type: skip
loop_service: true
body: |
    package handler

    import (
    	"context"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/middleware"
    	"{{.Module}}/internal/pkg/response"
    	api "github.com/test/{{ToLower .ServiceName}}/services/rbac/kitex_gen/api/rbac/v1"
    	"github.com/test/{{ToLower .ServiceName}}/services/rbac/kitex_gen/api/rbac/v1/rbacservice"
    )

    type CurrentUserHandler struct {{ "{" }}
    	rbacCli rbacservice.Client
    {{ "}" }}

    func NewCurrentUserHandler(rbacCli rbacservice.Client) *CurrentUserHandler {{ "{" }}
    	return &CurrentUserHandler{{ "{" }}rbacCli: rbacCli{{ "}" }}
    {{ "}" }}

    func (h *CurrentUserHandler) GetMenus(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	_, ok := middleware.GetClaims(c)
    	if !ok {{ "{" }}
    		response.ErrorCode(c, response.CodeUnauthorized)
    		return
    	{{ "}" }}

    	resp, err := h.rbacCli.GetUserMenuTree(ctx, &api.GetUserMenuTreeReq{{ "{" }}
    		Uid: 0, // TODO: convert UUID to int64
    	{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}

    	response.OK(c, resp.Roots)
    {{ "}" }}

    func (h *CurrentUserHandler) GetPerms(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	_, ok := middleware.GetClaims(c)
    	if !ok {{ "{" }}
    		response.ErrorCode(c, response.CodeUnauthorized)
    		return
    	{{ "}" }}

    	resp, err := h.rbacCli.GetUserPermCodes(ctx, &api.GetUserPermCodesReq{{ "{" }}
    		Uid: 0, // TODO: convert UUID to int64
    	{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}

    	response.OK(c, resp.Codes)
    {{ "}" }}
