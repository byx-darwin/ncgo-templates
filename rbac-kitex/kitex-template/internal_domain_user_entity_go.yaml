# ncgo exported template — internal/domain/user/entity.go
path: internal/domain/user/entity.go
update_behavior:
    type: skip
body: |
    package user

    import (
    	"context"
    	"fmt"
    	"strings"
    )

    // Status constants for a user account.
    const (
    	StatusActive   = "active"
    	StatusDisabled = "disabled"
    )

    // User is the aggregate root for the user aggregate.
    type User struct {{ "{" }}
    	ID           int64
    	Username     string
    	PasswordHash string
    	Status       string
    {{ "}" }}

    // New creates a User with validated invariants: username must be at least
    // 3 characters and a password hash must be present.
    func New(username, passwordHash string) (*User, error) {{ "{" }}
    	username = strings.TrimSpace(username)
    	if len(username) < 3 {{ "{" }}
    		return nil, ValidationError("username must be at least 3 characters")
    	{{ "}" }}
    	if passwordHash == "" {{ "{" }}
    		return nil, ValidationError("password hash is required")
    	{{ "}" }}
    	return &User{{ "{" }}
    		Username:     username,
    		PasswordHash: passwordHash,
    		Status:       StatusActive,
    	{{ "}" }}, nil
    {{ "}" }}

    // SetStatus validates and applies a status transition.
    func (u *User) SetStatus(status string) error {{ "{" }}
    	if status != StatusActive && status != StatusDisabled {{ "{" }}
    		return ValidationError("invalid user status: " + status)
    	{{ "}" }}
    	u.Status = status
    	return nil
    {{ "}" }}

    // SetPasswordHash replaces the stored password hash.
    func (u *User) SetPasswordHash(hash string) {{ "{" }}
    	u.PasswordHash = hash
    {{ "}" }}

    // NotFoundError reports that a user does not exist.
    type NotFoundError struct {{ "{" }}
    	ID       int64
    	Username string
    {{ "}" }}

    func (e NotFoundError) Error() string {{ "{" }}
    	if e.ID != 0 {{ "{" }}
    		return fmt.Sprintf("user %d not found", e.ID)
    	{{ "}" }}
    	return fmt.Sprintf("user %q not found", e.Username)
    {{ "}" }}

    // ValidationError reports an invalid user operation.
    type ValidationError string

    func (e ValidationError) Error() string {{ "{" }} return string(e) {{ "}" }}

    // Repository is the persistence port for the user aggregate.
    type Repository interface {{ "{" }}
    	GetByID(ctx context.Context, id int64) (*User, error)
    	GetByUsername(ctx context.Context, username string) (*User, error)
    	List(ctx context.Context, limit, offset int32) ([]*User, error)
    	Save(ctx context.Context, u *User) error
    	Delete(ctx context.Context, id int64) error
    	SetStatus(ctx context.Context, id int64, status string) error
    {{ "}" }}
