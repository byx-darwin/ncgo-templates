# rbac-kitex template — internal/infrastructure/auth/jwt.go
path: internal/infrastructure/auth/jwt.go
update_behavior:
  type: cover
body: |-
  package auth
  
  import (
  	"errors"
  	"time"
  
  	"github.com/golang-jwt/jwt/v5"
  )
  
  // Claims is the JWT payload: the authenticated user id plus role codes.
  type Claims struct {
  	Uid   int64    `json:"uid"`
  	Roles []string `json:"roles"`
  	jwt.RegisteredClaims
  }
  
  // JWTManager signs and parses HS256 tokens.
  type JWTManager struct {
  	secret []byte
  }
  
  // NewJWTManager creates an HS256 JWT manager with the given secret.
  func NewJWTManager(secret string) *JWTManager {
  	return &JWTManager{secret: []byte(secret)}
  }
  
  // Sign issues an HS256 token carrying uid and roles, expiring after ttl.
  func (m *JWTManager) Sign(uid int64, roles []string, ttl time.Duration) (string, error) {
  	now := time.Now()
  	claims := Claims{
  		Uid:   uid,
  		Roles: roles,
  		RegisteredClaims: jwt.RegisteredClaims{
  			IssuedAt:  jwt.NewNumericDate(now),
  			ExpiresAt: jwt.NewNumericDate(now.Add(ttl)),
  		},
  	}
  	token := jwt.NewWithClaims(jwt.SigningMethodHS256, claims)
  	return token.SignedString(m.secret)
  }
  
  // Parse verifies the token signature and expiry, returning its claims.
  func (m *JWTManager) Parse(tokenString string) (*Claims, error) {
  	token, err := jwt.ParseWithClaims(tokenString, &Claims{}, func(t *jwt.Token) (any, error) {
  		if t.Method != jwt.SigningMethodHS256 {
  			return nil, errors.New("unexpected signing method")
  		}
  		return m.secret, nil
  	})
  	if err != nil {
  		return nil, err
  	}
  	claims, ok := token.Claims.(*Claims)
  	if !ok || !token.Valid {
  		return nil, errors.New("invalid token")
  	}
  	return claims, nil
  }
