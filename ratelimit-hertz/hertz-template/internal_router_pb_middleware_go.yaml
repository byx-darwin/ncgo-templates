# Hertz custom template — internal/router/pb/middleware.go
# Generates router middleware helpers plus route registration (Register/Ping).
# Register is defined here instead of a per-service router file because ncgo's
# loop_service overlay cannot regenerate per-service files for Hertz IDLs.
path: internal/router/pb/middleware.go
update_behavior:
    type: cover
loop_service: true
body: |-
    // Code generated by hertz generator.

    package pb

    import (
    	"context"

    	"github.com/cloudwego/hertz/pkg/app"
    	"github.com/cloudwego/hertz/pkg/app/server"

    	pb "{{.Module}}/internal/pb"
    	"{{.Module}}/internal/pkg/response"
    )

    func rootMw() []app.HandlerFunc {
    	// your code...
    	return nil
    }

    func _pingMw() []app.HandlerFunc {
    	// your code...
    	return nil
    }

    // Register registers the routes generated by the IDL. It mirrors the
    // per-service router file (internal/router/pb/{service}.go) produced by
    // hz, kept here so GeneratedRegister -> pb.Register stays wired.
    func Register(r *server.Hertz) {
    	root := r.Group("/", rootMw()...)
    	root.GET("/ping", append(_pingMw(), Ping)...)
    }

    // Ping handles the IDL ping route using the generated model type.
    func Ping(ctx context.Context, c *app.RequestContext) {
    	_ = ctx
    	response.OK(c, &pb.PingResp{Message: "pong"})
    }
