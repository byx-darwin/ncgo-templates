# ncgo exported template — internal/repository/user/repo_test.go
path: internal/repository/user/repo_test.go
update_behavior:
    type: skip
loop_service: true
body: |
    package userrepo

    import (
    	"context"
    	"errors"
    	"os"
    	"os/exec"
    	"testing"
    	"time"

    	"github.com/google/uuid"
    	"github.com/jackc/pgx/v5/pgxpool"

    	"{{.Module}}/internal/db/gen"
    	"{{.Module}}/internal/domain/user"
    )

    // TestUserRepoPostgresRoundTrip exercises the user repo against a real
    // postgres. It is gated on `pg_isready` plus a reachable POSTGRES_DSN so the
    // happy-path seed/test/e2e runs stay hermetic. When the gate is absent the
    // test prints an explicit `skipped:` line instead of silently passing.
    func TestUserRepoPostgresRoundTrip(t *testing.T) {{ "{" }}
    	if _, err := exec.LookPath("pg_isready"); err != nil {{ "{" }}
    		t.Skipf("skipped: pg_isready not installed (install postgres client to run)")
    	{{ "}" }}
    	dsn := os.Getenv("POSTGRES_DSN")
    	if dsn == "" {{ "{" }}
    		t.Skipf("skipped: POSTGRES_DSN not set")
    	{{ "}" }}
    	ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
    	defer cancel()
    	pool, err := pgxpool.New(ctx, dsn)
    	if err != nil {{ "{" }}
    		t.Fatalf("connect postgres: %v", err)
    	{{ "}" }}
    	defer pool.Close()
    	if err := pool.Ping(ctx); err != nil {{ "{" }}
    		t.Fatalf("ping postgres: %v", err)
    	{{ "}" }}

    	q := gen.New(pool)
    	repo := New(q, pool)

    	// Create → GetByID → CreateIdentity → GetIdentityByProvider →
    	// DeleteIdentity round-trip.
    	u, err := user.NewLocal("integration-user", "argon2hash-placeholder")
    	if err != nil {{ "{" }}
    		t.Fatalf("NewLocal: %v", err)
    	{{ "}" }}
    	if err := repo.Create(ctx, u); err != nil {{ "{" }}
    		t.Fatalf("Create: %v", err)
    	{{ "}" }}
        defer func() {{ "{" }}
            if _, err := pool.Exec(ctx, "DELETE FROM users WHERE id = $1", u.ID); err != nil {{ "{" }}
                t.Errorf("cleanup user: %v", err)
            {{ "}" }}
        {{ "}" }}()
    	if u.ID == uuid.Nil {{ "{" }}
    		t.Fatal("created user has nil id")
    	{{ "}" }}

    	got, err := repo.GetByID(ctx, u.ID)
    	if err != nil {{ "{" }}
    		t.Fatalf("GetByID: %v", err)
    	{{ "}" }}
    	if got.ID != u.ID {{ "{" }}
    		t.Fatalf("GetByID.ID = %v, want %v", got.ID, u.ID)
    	{{ "}" }}
    	if got.Username == nil || *got.Username != "integration-user" {{ "{" }}
    		t.Fatalf("GetByID.Username = %v, want %q", got.Username, "integration-user")
    	{{ "}" }}

    	identity, err := user.NewIdentity(u.ID, "github", "gh-12345", "{{ "{" }}}")
    	if err != nil {{ "{" }}
    		t.Fatalf("NewIdentity: %v", err)
    	{{ "}" }}
    	if err := repo.CreateIdentity(ctx, identity); err != nil {{ "{" }}
    		t.Fatalf("CreateIdentity: %v", err)
    	{{ "}" }}

    	gotIdentity, err := repo.GetIdentityByProvider(ctx, "github", "gh-12345")
    	if err != nil {{ "{" }}
    		t.Fatalf("GetIdentityByProvider: %v", err)
    	{{ "}" }}
    	if gotIdentity.UserID != u.ID {{ "{" }}
    		t.Fatalf("GetIdentityByProvider.UserID = %v, want %v", gotIdentity.UserID, u.ID)
    	{{ "}" }}

    	if err := repo.DeleteIdentity(ctx, u.ID, "github"); err != nil {{ "{" }}
    		t.Fatalf("DeleteIdentity: %v", err)
    	{{ "}" }}
    	if _, err := repo.GetIdentityByProvider(ctx, "github", "gh-12345"); err != user.ErrNotFound {{ "{" }}
    		t.Fatalf("GetIdentityByProvider after DeleteIdentity error = %v, want user.ErrNotFound", err)
    	{{ "}" }}

    	// GetByEmail/GetByPhone round-trip.
    	u2, err := user.NewLocal("integration-user-2", "argon2hash-placeholder")
    	if err != nil {{ "{" }}
    		t.Fatalf("NewLocal: %v", err)
    	{{ "}" }}
    	u2.Email = "integration@example.com"
    	u2.Phone = "13800000000"
    	if err := repo.Create(ctx, u2); err != nil {{ "{" }}
    		t.Fatalf("Create u2: %v", err)
    	{{ "}" }}
        defer func() {{ "{" }}
            if _, err := pool.Exec(ctx, "DELETE FROM users WHERE id = $1", u2.ID); err != nil {{ "{" }}
                t.Errorf("cleanup u2: %v", err)
            {{ "}" }}
        {{ "}" }}()
    	byEmail, err := repo.GetByEmail(ctx, "integration@example.com")
    	if err != nil {{ "{" }}
    		t.Fatalf("GetByEmail: %v", err)
    	{{ "}" }}
    	if byEmail.ID != u2.ID {{ "{" }}
    		t.Fatalf("GetByEmail.ID = %v, want %v", byEmail.ID, u2.ID)
    	{{ "}" }}
    	byPhone, err := repo.GetByPhone(ctx, "13800000000")
    	if err != nil {{ "{" }}
    		t.Fatalf("GetByPhone: %v", err)
    	{{ "}" }}
    	if byPhone.ID != u2.ID {{ "{" }}
    		t.Fatalf("GetByPhone.ID = %v, want %v", byPhone.ID, u2.ID)
    	{{ "}" }}
    	if _, err := repo.GetByEmail(ctx, "no-such-email@example.com"); !errors.Is(err, user.ErrNotFound) {{ "{" }}
    		t.Fatalf("GetByEmail unknown: expected ErrNotFound, got %v", err)
    	{{ "}" }}
    {{ "}" }}

    // TestUserRepoPostgresRoundTrip_ProfileFields is a regression test for a
    // bug where Create dropped Nickname/Avatar/Email/Phone on the floor
    // (only ID/Username/PasswordHash were passed to CreateUserParams), and
    // then overwrote the caller's in-memory User with the now-NULL values
    // read back from the DB. It creates a User with those fields populated
    // (mirroring an OAuth-sourced profile) and asserts a subsequent GetByID
    // returns the same values.
    func TestUserRepoPostgresRoundTrip_ProfileFields(t *testing.T) {{ "{" }}
    	if _, err := exec.LookPath("pg_isready"); err != nil {{ "{" }}
    		t.Skipf("skipped: pg_isready not installed (install postgres client to run)")
    	{{ "}" }}
    	dsn := os.Getenv("POSTGRES_DSN")
    	if dsn == "" {{ "{" }}
    		t.Skipf("skipped: POSTGRES_DSN not set")
    	{{ "}" }}
    	ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
    	defer cancel()
    	pool, err := pgxpool.New(ctx, dsn)
    	if err != nil {{ "{" }}
    		t.Fatalf("connect postgres: %v", err)
    	{{ "}" }}
    	defer pool.Close()
    	if err := pool.Ping(ctx); err != nil {{ "{" }}
    		t.Fatalf("ping postgres: %v", err)
    	{{ "}" }}

    	q := gen.New(pool)
    	repo := New(q, pool)

    	u, err := user.NewLocal("integration-user-profile", "argon2hash-placeholder")
    	if err != nil {{ "{" }}
    		t.Fatalf("NewLocal: %v", err)
    	{{ "}" }}
    	u.Nickname = "Integration Nick"
    	u.Avatar = "https://example.com/avatar.png"
        u.Email = "integration-profile@example.com"
    	u.Phone = "+15551234567"
    	if err := repo.Create(ctx, u); err != nil {{ "{" }}
    		t.Fatalf("Create: %v", err)
    	{{ "}" }}
        defer func() {{ "{" }}
            if _, err := pool.Exec(ctx, "DELETE FROM users WHERE id = $1", u.ID); err != nil {{ "{" }}
                t.Errorf("cleanup profile user: %v", err)
            {{ "}" }}
        {{ "}" }}()

    	got, err := repo.GetByID(ctx, u.ID)
    	if err != nil {{ "{" }}
    		t.Fatalf("GetByID: %v", err)
    	{{ "}" }}
    	if got.Nickname != "Integration Nick" {{ "{" }}
    		t.Fatalf("GetByID.Nickname = %q, want %q", got.Nickname, "Integration Nick")
    	{{ "}" }}
    	if got.Avatar != "https://example.com/avatar.png" {{ "{" }}
    		t.Fatalf("GetByID.Avatar = %q, want %q", got.Avatar, "https://example.com/avatar.png")
    	{{ "}" }}
        if got.Email != "integration-profile@example.com" {{ "{" }}
            t.Fatalf("GetByID.Email = %q, want %q", got.Email, "integration-profile@example.com")
    	{{ "}" }}
    	if got.Phone != "+15551234567" {{ "{" }}
    		t.Fatalf("GetByID.Phone = %q, want %q", got.Phone, "+15551234567")
    	{{ "}" }}
    {{ "}" }}
