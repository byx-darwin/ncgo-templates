# ncgo exported template — internal/router/adminbffservice_test.go
path: internal/router/adminbffservice_test.go
update_behavior:
    type: skip
loop_service: true
body: |
    package router

    import (
    	"context"
    	"os"
    	"path/filepath"
    	"testing"
    	"time"

    	"github.com/cloudwego/hertz/pkg/app/server"
    	"github.com/cloudwego/hertz/pkg/common/ut"
    	"github.com/cloudwego/hertz/pkg/protocol/consts"
    	"github.com/cloudwego/hertz/pkg/route"
    	"github.com/cloudwego/kitex/client/callopt"
    	"github.com/golang-jwt/jwt/v5"

    	authservice "{{.Module}}/kitex_gen/api/auth/v1/authservice"
    	ruleservice "{{.Module}}/kitex_gen/api/ratelimit/v1/ruleservice"
    	rbacv1 "{{.Module}}/kitex_gen/api/rbac/v1"
    	rbacservice "{{.Module}}/kitex_gen/api/rbac/v1/rbacservice"
    	userv1 "{{.Module}}/kitex_gen/api/user/v1"
    	userservice "{{.Module}}/kitex_gen/api/user/v1/userservice"
    )

    // testRouterConfYAML is a minimal conf.yaml satisfying conf.Config's
    // Validate(): auth.token is enabled with a signing key so JWTAuth
    // actually enforces on protected routes in this test, matching a real
    // deployment.
    const testRouterConfYAML = `
    env: test
    grpc:
      terminal_user:
        service_name: "userservice"
        host_ports:
          - "127.0.0.1:8890"
    auth:
      token:
        enabled: true
        header: "Authorization"
        signing_key: "router-test-secret"
    `

    // TestMain points conf.Get()'s lazy singleton at a config with
    // auth.token.enabled: true before any test in this package runs, since
    // conf.Init() only loads once per process (sync.Once) and this package
    // has no other test file that would race it.
    func TestMain(m *testing.M) {{ "{" }}
    	dir, err := os.MkdirTemp("", "adminbffservice-router-test")
    	if err != nil {{ "{" }}
    		panic(err)
    	{{ "}" }}
    	path := filepath.Join(dir, "conf.yaml")
    	if err := os.WriteFile(path, []byte(testRouterConfYAML), 0o644); err != nil {{ "{" }}
    		panic(err)
    	{{ "}" }}
    	os.Setenv("CONFIG_PATH", path)
    	code := m.Run()
    	os.RemoveAll(dir)
    	os.Exit(code)
    {{ "}" }}

    // fakeRouterRBACClient is a fake rbacservice.Client whose Enforce
    // response is controlled per-test, proving (or disproving) that Authz
    // actually gates the route. It only implements the methods this test's
    // probe route (GET /api/v1/users) actually reaches: Enforce (called by
    // Authz) and ListUsers (called by UserHandler.List once Authz allows
    // the request through). Every other method panics via the nil embedded
    // Client if called, which would itself indicate a test bug (a route
    // reaching an RPC it shouldn't).
    type fakeRouterRBACClient struct {{ "{" }}
    	rbacservice.Client
    	allowed        bool
    	lastEnforceUid string
    {{ "}" }}

    func (f *fakeRouterRBACClient) Enforce(ctx context.Context, req *rbacv1.EnforceReq, callOptions ...callopt.Option) (*rbacv1.EnforceResp, error) {{ "{" }}
    	f.lastEnforceUid = req.Uid
    	return &rbacv1.EnforceResp{{ "{" }}Allowed: f.allowed{{ "}" }}, nil
    {{ "}" }}

    func (f *fakeRouterRBACClient) ListUsers(ctx context.Context, req *rbacv1.ListUsersReq, callOptions ...callopt.Option) (*rbacv1.ListUsersResp, error) {{ "{" }}
    	return &rbacv1.ListUsersResp{{ "{" }}Users: nil, Total: 0{{ "}" }}, nil
    {{ "}" }}

    // fakeRouterUserClient is a minimal fake userservice.Client. It embeds
    // the real interface (so any unexercised method panics via the nil
    // embedded Client, itself indicating a test bug) and overrides only
    // ListUsers, which TestTerminalUsersRoute_AllowedPermission_Returns200
    // needs the real terminalUserHandler.List to reach once Authz allows
    // the request through — mirroring fakeRouterRBACClient's ListUsers
    // override for the analogous /users case.
    type fakeRouterUserClient struct {{ "{" }}
    	userservice.Client
    {{ "}" }}

    func (f *fakeRouterUserClient) ListUsers(ctx context.Context, req *userv1.ListUsersReq, callOptions ...callopt.Option) (*userv1.ListUsersResp, error) {{ "{" }}
    	return &userv1.ListUsersResp{{ "{" }}Users: nil, Total: 0{{ "}" }}, nil
    {{ "}" }}

    func newRouterTestEngine(t *testing.T, rbacCli rbacservice.Client) *route.Engine {{ "{" }}
    	t.Helper()
    	h := server.New()
    	var authCli authservice.Client
    	var ruleCli ruleservice.Client
    	userCli := &fakeRouterUserClient{{ "{" }}{{ "}" }}
    	Register{{.ServiceName}}BffServiceRoutes(h, authCli, rbacCli, ruleCli, userCli)
    	return h.Engine
    {{ "}" }}

    // newRouterTestJWT builds a valid JWT for an authenticated user, signed
    // with the same secret the test conf.yaml configures for auth.token.
    func newRouterTestJWT(t *testing.T) string {{ "{" }}
    	t.Helper()
    	token := jwt.NewWithClaims(jwt.SigningMethodHS256, jwt.MapClaims{{ "{" }}
    		"uid": "user-123",
    		"exp": time.Now().Add(time.Hour).Unix(),
    	{{ "}" }})
    	signed, err := token.SignedString([]byte("router-test-secret"))
    	if err != nil {{ "{" }}
    		t.Fatalf("failed to sign test jwt: %v", err)
    	{{ "}" }}
    	return signed
    {{ "}" }}

    // TestAuthz_DeniedPermission_Returns403 is the fix probe: before this
    // task's fix, Authz was registered at the protected group's Use() level,
    // which Hertz's combineHandlers always places before a route's own
    // RequirePermission handler in the final chain. Since RequestContext.Next
    // is a forward-only loop (not onion/recursive), Authz always ran before
    // RequirePermission had set the required permission, always saw an empty
    // permission, and always skipped straight to c.Next() — meaning
    // rbacCli.Enforce was never called and this request would have wrongly
    // succeeded (200) instead of being denied (403). With the fix (Authz
    // registered per-route, immediately after RequirePermission), a JWT that
    // is valid but denied by RBAC must get 403.
    func TestAuthz_DeniedPermission_Returns403(t *testing.T) {{ "{" }}
    	engine := newRouterTestEngine(t, &fakeRouterRBACClient{{ "{" }}allowed: false{{ "}" }})
    	jwtToken := newRouterTestJWT(t)

    	w := ut.PerformRequest(engine, "GET", "/api/v1/users",
    		nil, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer " + jwtToken{{ "}" }})
    	resp := w.Result()

    	if resp.StatusCode() != consts.StatusForbidden {{ "{" }}
    		t.Fatalf("expected 403 (permission denied) for a JWT-authenticated but RBAC-denied request to GET /api/v1/users, got %d — this is exactly the bug this task fixes: without per-route Authz registration, RBAC enforcement is silently skipped and this request would wrongly succeed", resp.StatusCode())
    	{{ "}" }}
    {{ "}" }}

    // TestAuthz_AllowedPermission_Returns200 is the companion positive case:
    // an RBAC-allowed request must still reach the real handler and succeed.
    func TestAuthz_AllowedPermission_Returns200(t *testing.T) {{ "{" }}
    	engine := newRouterTestEngine(t, &fakeRouterRBACClient{{ "{" }}allowed: true{{ "}" }})
    	jwtToken := newRouterTestJWT(t)

    	w := ut.PerformRequest(engine, "GET", "/api/v1/users",
    		nil, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer " + jwtToken{{ "}" }})
    	resp := w.Result()

    	if resp.StatusCode() != consts.StatusOK {{ "{" }}
    		t.Fatalf("expected 200 for a JWT-authenticated and RBAC-allowed request to GET /api/v1/users, got %d", resp.StatusCode())
    	{{ "}" }}
    {{ "}" }}

    // TestAuthz_UsesRealJWTIdentity_PropagatesUidToRBAC is the AC #3
    // cross-service integration test for the Claims-uid-unification fix: a
    // JWT signed with the same claim shape rbac-kitex/user-kitex actually
    // issue (only a "uid" claim, via newRouterTestJWT) must thread its
    // identity, unmodified, all the way from JWTAuth's parse through Authz
    // into the RBAC Enforce call. Before this fix, Claims had no Uid field
    // (UUID/UserID only, neither ever set by a real issuer), so
    // fakeRouterRBACClient.lastEnforceUid would have observed "" here
    // instead of "user-123".
    func TestAuthz_UsesRealJWTIdentity_PropagatesUidToRBAC(t *testing.T) {{ "{" }}
    	rbacCli := &fakeRouterRBACClient{{ "{" }}allowed: true{{ "}" }}
    	engine := newRouterTestEngine(t, rbacCli)
    	jwtToken := newRouterTestJWT(t)

    	w := ut.PerformRequest(engine, "GET", "/api/v1/users",
    		nil, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer " + jwtToken{{ "}" }})
    	resp := w.Result()

    	if resp.StatusCode() != consts.StatusOK {{ "{" }}
    		t.Fatalf("expected 200, got %d", resp.StatusCode())
    	{{ "}" }}
    	if rbacCli.lastEnforceUid != "user-123" {{ "{" }}
    		t.Errorf("rbacCli.lastEnforceUid = %q, want %q — JWT identity did not propagate to RBAC Enforce", rbacCli.lastEnforceUid, "user-123")
    	{{ "}" }}
    {{ "}" }}

    // TestUnprotectedRoute_NoAuthHeader_StillBlockedByJWT is a narrow
    // regression check that removing the group-level Authz.Use() call did
    // not accidentally also remove JWTAuth's own enforcement: a protected
    // route must still reject requests with no Authorization header at all,
    // independent of RBAC.
    func TestUnprotectedRoute_NoAuthHeader_StillBlockedByJWT(t *testing.T) {{ "{" }}
    	engine := newRouterTestEngine(t, &fakeRouterRBACClient{{ "{" }}allowed: true{{ "}" }})

    	w := ut.PerformRequest(engine, "GET", "/api/v1/users", nil)
    	if got := w.Result().StatusCode(); got != consts.StatusUnauthorized {{ "{" }}
    		t.Fatalf("expected 401 for GET /api/v1/users without an Authorization header, got %d", got)
    	{{ "}" }}
    {{ "}" }}

    // TestTerminalUsersRoute_DeniedPermission_Returns403 proves the same
    // property Task 3 proved for /users, now for the new /terminal-users
    // routes added by this task: a JWT-authenticated but RBAC-denied
    // request must get 403, confirming these new routes use the correct
    // per-route RequirePermission+Authz pairing (not the buggy
    // group-level registration Task 3 fixed).
    func TestTerminalUsersRoute_DeniedPermission_Returns403(t *testing.T) {{ "{" }}
    	engine := newRouterTestEngine(t, &fakeRouterRBACClient{{ "{" }}allowed: false{{ "}" }})
    	jwtToken := newRouterTestJWT(t)

    	w := ut.PerformRequest(engine, "GET", "/api/v1/terminal-users",
    		nil, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer " + jwtToken{{ "}" }})
    	resp := w.Result()

    	if resp.StatusCode() != consts.StatusForbidden {{ "{" }}
    		t.Fatalf("expected 403 (permission denied) for a JWT-authenticated but RBAC-denied request to GET /api/v1/terminal-users, got %d", resp.StatusCode())
    	{{ "}" }}
    {{ "}" }}

    // TestTerminalUsersRoute_AllowedPermission_Returns200 is the companion
    // positive case: an RBAC-allowed request to /terminal-users must still
    // reach the real handler and succeed.
    func TestTerminalUsersRoute_AllowedPermission_Returns200(t *testing.T) {{ "{" }}
    	engine := newRouterTestEngine(t, &fakeRouterRBACClient{{ "{" }}allowed: true{{ "}" }})
    	jwtToken := newRouterTestJWT(t)

    	w := ut.PerformRequest(engine, "GET", "/api/v1/terminal-users",
    		nil, ut.Header{{ "{" }}Key: "Authorization", Value: "Bearer " + jwtToken{{ "}" }})
    	resp := w.Result()

    	if resp.StatusCode() != consts.StatusOK {{ "{" }}
    		t.Fatalf("expected 200 for a JWT-authenticated and RBAC-allowed request to GET /api/v1/terminal-users, got %d", resp.StatusCode())
    	{{ "}" }}
    {{ "}" }}
