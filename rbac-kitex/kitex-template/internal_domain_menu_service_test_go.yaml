body: |
    package menu

    import "testing"

    func TestBuildTreeNestedByParentID(t *testing.T) {{ "{" }}
    	items := []*Menu{{ "{" }}
    		{{ "{" }}ID: 1, ParentID: 0, Name: "root-a", SortOrder: 1{{ "}" }},
    		{{ "{" }}ID: 2, ParentID: 1, Name: "child-a", SortOrder: 1{{ "}" }},
    		{{ "{" }}ID: 3, ParentID: 1, Name: "child-b", SortOrder: 2{{ "}" }},
    		{{ "{" }}ID: 4, ParentID: 2, Name: "grandchild", SortOrder: 1{{ "}" }},
    		{{ "{" }}ID: 5, ParentID: 0, Name: "root-b", SortOrder: 0{{ "}" }},
    	{{ "}" }}
    	roots := BuildTree(items)
    	if len(roots) != 2 {{ "{" }}
    		t.Fatalf("roots = %d, want 2", len(roots))
    	{{ "}" }}
    	// root-b (SortOrder 0) before root-a (SortOrder 1)
    	if roots[0].Menu.Name != "root-b" || roots[1].Menu.Name != "root-a" {{ "{" }}
    		t.Fatalf("root order = %s,%s want root-b,root-a", roots[0].Menu.Name, roots[1].Menu.Name)
    	{{ "}" }}
    	ra := roots[1]
    	if len(ra.Children) != 2 {{ "{" }}
    		t.Fatalf("root-a children = %d, want 2", len(ra.Children))
    	{{ "}" }}
    	if ra.Children[0].Menu.Name != "child-a" || ra.Children[1].Menu.Name != "child-b" {{ "{" }}
    		t.Fatalf("child order = %s,%s want child-a,child-b", ra.Children[0].Menu.Name, ra.Children[1].Menu.Name)
    	{{ "}" }}
    	if len(ra.Children[0].Children) != 1 || ra.Children[0].Children[0].Menu.Name != "grandchild" {{ "{" }}
    		t.Fatalf("grandchild missing or wrong: %+v", ra.Children[0].Children)
    	{{ "}" }}
    {{ "}" }}

    func TestBuildTreeOrphansHangAsRoots(t *testing.T) {{ "{" }}
    	items := []*Menu{{ "{" }}
    		{{ "{" }}ID: 2, ParentID: 99, Name: "orphan", SortOrder: 0{{ "}" }},
    		{{ "{" }}ID: 1, ParentID: 0, Name: "root", SortOrder: 0{{ "}" }},
    	{{ "}" }}
    	roots := BuildTree(items)
    	if len(roots) != 2 {{ "{" }}
    		t.Fatalf("roots = %d, want 2 (orphan hangs as root)", len(roots))
    	{{ "}" }}
    {{ "}" }}

    func TestBuildTreeStableBySortOrderThenID(t *testing.T) {{ "{" }}
    	items := []*Menu{{ "{" }}
    		{{ "{" }}ID: 3, ParentID: 0, Name: "b", SortOrder: 1{{ "}" }},
    		{{ "{" }}ID: 1, ParentID: 0, Name: "a", SortOrder: 0{{ "}" }},
    		{{ "{" }}ID: 2, ParentID: 0, Name: "c", SortOrder: 1{{ "}" }},
    	{{ "}" }}
    	roots := BuildTree(items)
    	if len(roots) != 3 {{ "{" }}
    		t.Fatalf("roots = %d, want 3", len(roots))
    	{{ "}" }}
    	// SortOrder asc, then ID asc → a(1,0), c(2,1), b(3,1)
    	if roots[0].Menu.Name != "a" || roots[1].Menu.Name != "c" || roots[2].Menu.Name != "b" {{ "{" }}
    		t.Fatalf("order = %s,%s,%s want a,c,b", roots[0].Menu.Name, roots[1].Menu.Name, roots[2].Menu.Name)
    	{{ "}" }}
    {{ "}" }}

    func TestBuildTreeEmpty(t *testing.T) {{ "{" }}
    	if roots := BuildTree(nil); roots != nil {{ "{" }}
    		t.Fatalf("BuildTree(nil) = %v, want nil", roots)
    	{{ "}" }}
    {{ "}" }}
