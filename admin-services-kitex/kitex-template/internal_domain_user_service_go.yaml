# ncgo exported template — internal/domain/user/service.go
path: internal/domain/user/service.go
update_behavior:
    type: skip
body: |
    package user

    import "unicode"

    // ValidatePassword applies the plaintext password policy. The returned error
    // is a ValidationError when the policy is violated.
    //
    // Policy (aligned with NIST SP 800-63B recommendations):
    //   - Minimum 8 characters
    //   - Maximum 128 characters (prevent DoS via long passwords)
    //   - Must contain at least one uppercase letter
    //   - Must contain at least one lowercase letter
    //   - Must contain at least one digit
    //   - Must contain at least one special character
    func ValidatePassword(plain string) error {{ "{" }}
    	if len(plain) < 8 {{ "{" }}
    		return ValidationError{{ "{" }}Field: "password", Msg: "must be at least 8 characters"{{ "}" }}
    	{{ "}" }}
    	if len(plain) > 128 {{ "{" }}
    		return ValidationError{{ "{" }}Field: "password", Msg: "must be at most 128 characters"{{ "}" }}
    	{{ "}" }}

    	var hasUpper, hasLower, hasDigit, hasSpecial bool
    	for _, ch := range plain {{ "{" }}
    		switch {{ "{" }}
    		case unicode.IsUpper(ch):
    			hasUpper = true
    		case unicode.IsLower(ch):
    			hasLower = true
    		case unicode.IsDigit(ch):
    			hasDigit = true
    		default:
    			hasSpecial = true
    		{{ "}" }}
    	{{ "}" }}

    	if !hasUpper {{ "{" }}
    		return ValidationError{{ "{" }}Field: "password", Msg: "must contain at least one uppercase letter"{{ "}" }}
    	{{ "}" }}
    	if !hasLower {{ "{" }}
    		return ValidationError{{ "{" }}Field: "password", Msg: "must contain at least one lowercase letter"{{ "}" }}
    	{{ "}" }}
    	if !hasDigit {{ "{" }}
    		return ValidationError{{ "{" }}Field: "password", Msg: "must contain at least one digit"{{ "}" }}
    	{{ "}" }}
    	if !hasSpecial {{ "{" }}
    		return ValidationError{{ "{" }}Field: "password", Msg: "must contain at least one special character"{{ "}" }}
    	{{ "}" }}

    	return nil
    {{ "}" }}
