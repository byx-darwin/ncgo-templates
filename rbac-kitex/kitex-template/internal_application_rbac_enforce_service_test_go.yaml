# ncgo exported template — internal/application/rbac/enforce_service_test.go
path: internal/application/rbac/enforce_service_test.go
update_behavior:
    type: skip
body: |
    package rbacsvc

    import (
    	"context"
    	"testing"

    	casbin "github.com/casbin/casbin/v2"

    	casbinstore "{{.Module}}/internal/infrastructure/casbin"
    )

    func newTestEnforcer(t *testing.T) *casbin.Enforcer {{ "{" }}
    	t.Helper()
    	e, err := casbinstore.NewEnforcer(casbinstore.NewMemoryPolicyStore())
    	if err != nil {{ "{" }}
    		t.Fatalf("NewEnforcer: %v", err)
    	{{ "}" }}
    	e.EnableLog(false)
    	return e
    {{ "}" }}

    func TestEnforceGranted(t *testing.T) {{ "{" }}
    	e := newTestEnforcer(t)
    	if _, err := e.AddPolicy("admin", "user:create", "POST"); err != nil {{ "{" }}
    		t.Fatalf("AddPolicy: %v", err)
    	{{ "}" }}
    	if _, err := e.AddRoleForUser("1", "admin"); err != nil {{ "{" }}
    		t.Fatalf("AddRoleForUser: %v", err)
    	{{ "}" }}
    	svc := New(e)
    	ok, err := svc.Enforce(context.Background(), 1, "user:create", "POST")
    	if err != nil {{ "{" }}
    		t.Fatalf("Enforce: %v", err)
    	{{ "}" }}
    	if !ok {{ "{" }}
    		t.Fatal("expected allow")
    	{{ "}" }}
    {{ "}" }}

    func TestEnforceDenied(t *testing.T) {{ "{" }}
    	e := newTestEnforcer(t)
    	if _, err := e.AddPolicy("admin", "user:create", "POST"); err != nil {{ "{" }}
    		t.Fatalf("AddPolicy: %v", err)
    	{{ "}" }}
    	if _, err := e.AddRoleForUser("1", "admin"); err != nil {{ "{" }}
    		t.Fatalf("AddRoleForUser: %v", err)
    	{{ "}" }}
    	svc := New(e)
    	ok, err := svc.Enforce(context.Background(), 1, "user:delete", "POST")
    	if err != nil {{ "{" }}
    		t.Fatalf("Enforce: %v", err)
    	{{ "}" }}
    	if ok {{ "{" }}
    		t.Fatal("expected deny")
    	{{ "}" }}
    {{ "}" }}
