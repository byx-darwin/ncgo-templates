        if _, err = tx.Exec(ctx, `SELECT pg_advisory_xact_lock(hashtext('account_login_configs'))`); err != nil {{ "{" }}
            return Config{{ "{" }}{{ "}" }}, errors.New("cannot lock account configuration")
        {{ "}" }}
        old, err := m.scan(tx.QueryRow(ctx, `SELECT `+configColumns+` FROM account_login_configs WHERE id=$1 FOR UPDATE`, c.ID), true)
        if err != nil && !errors.Is(err, pgx.ErrNoRows) {{ "{" }}
            return Config{{ "{" }}{{ "}" }}, errors.New("cannot read existing account configuration")
        {{ "}" }}
        if err == nil {{ "{" }}
            if old.Environment != m.environment {{ "{" }}
                return Config{{ "{" }}{{ "}" }}, errors.New("configuration belongs to another environment")
            {{ "}" }}
            if old.Kind != c.Kind || old.Provider != c.Provider {{ "{" }}
