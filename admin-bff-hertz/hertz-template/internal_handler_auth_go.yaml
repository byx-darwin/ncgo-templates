# ncgo exported template — internal/handler/auth.go
path: internal/handler/auth.go
update_behavior:
    type: skip
loop_service: true
body: |
    package handler

    import (
    	"context"
    	"encoding/json"

    	"github.com/cloudwego/hertz/pkg/app"

    	"{{.Module}}/internal/pkg/middleware"
    	"{{.Module}}/internal/pkg/response"
    	api "github.com/test/admin/services/rbac/kitex_gen/api/rbac/v1"
    	"github.com/test/admin/services/rbac/kitex_gen/api/rbac/v1/authservice"
    )

    type AuthHandler struct {{ "{" }}
    	rbacCli authservice.Client
    {{ "}" }}

    func NewAuthHandler(rbacCli authservice.Client) *AuthHandler {{ "{" }}
    	return &AuthHandler{{ "{" }}rbacCli: rbacCli{{ "}" }}
    {{ "}" }}

    type LoginRequest struct {{ "{" }}
    	Username string `json:"username"`
    	Password string `json:"password"`
    {{ "}" }}

    func (h *AuthHandler) Login(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req LoginRequest
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}

    	resp, err := h.rbacCli.Login(ctx, &api.LoginRequest{{ "{" }}
    		Username: req.Username,
    		Password: req.Password,
    	{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}

    	response.OK(c, map[string]interface{{ "{" }}{{ "}" }}{{ "{" }}
    		"access_token":  resp.AccessToken,
    		"refresh_token": resp.RefreshToken,
    		"expires_in":    resp.ExpiresIn,
    	{{ "}" }})
    {{ "}" }}

    func (h *AuthHandler) Refresh(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	var req struct {{ "{" }}
    		RefreshToken string `json:"refresh_token"`
    	{{ "}" }}
    	if err := json.Unmarshal(c.Request.Body(), &req); err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeRequestParamInvalid)
    		return
    	{{ "}" }}

    	resp, err := h.rbacCli.Refresh(ctx, &api.RefreshRequest{{ "{" }}
    		RefreshToken: req.RefreshToken,
    	{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}

    	response.OK(c, map[string]interface{{ "{" }}{{ "}" }}{{ "{" }}
    		"access_token":  resp.AccessToken,
    		"refresh_token": resp.RefreshToken,
    		"expires_in":    resp.ExpiresIn,
    	{{ "}" }})
    {{ "}" }}

    func (h *AuthHandler) Logout(ctx context.Context, c *app.RequestContext) {{ "{" }}
    	claims, ok := middleware.GetClaims(c)
    	if !ok {{ "{" }}
    		response.ErrorCode(c, response.CodeUnauthorized)
    		return
    	{{ "}" }}

    	_, err := h.rbacCli.Logout(ctx, &api.LogoutRequest{{ "{" }}
    		UserId: claims.UUID,
    	{{ "}" }})
    	if err != nil {{ "{" }}
    		response.ErrorCode(c, response.CodeInternalError)
    		return
    	{{ "}" }}

    	response.OK(c, map[string]string{{ "{" }}"status": "ok"{{ "}" }})
    {{ "}" }}
