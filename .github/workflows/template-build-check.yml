name: Template Build Check

on:
  pull_request:
    paths:
      - 'rbac-kitex/**'
      - 'admin-services-kitex/**'
      - 'admin-bff-hertz/**'

jobs:
  duplicate-path-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixture tests still pass
        run: |
          if scripts/check-duplicate-template-paths.sh scripts/testdata/dup-check-fixture/has-duplicate; then
            echo "expected has-duplicate fixture to fail the duplicate-path check, but it passed" >&2
            exit 1
          fi
          scripts/check-duplicate-template-paths.sh scripts/testdata/dup-check-fixture/clean

      # rule-center still has unresolved duplicate path: declarations
      # (tracked as Issue #43 follow-up); add it here once cleaned up.
      - name: Check for duplicate path declarations
        run: scripts/check-duplicate-template-paths.sh admin-bff-hertz/hertz-template rbac-kitex/kitex-template admin-services-kitex/kitex-template

  build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: rbac-kitex
            kind: kitex
            db: none
          - name: admin-services-kitex
            kind: kitex
            db: none
          - name: admin-bff-hertz
            kind: hertz
            db: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install ncgo
        run: go install github.com/byx-darwin/ncgo@latest

      - name: Render ${{ matrix.name }}
        run: |
          ncgo new scratch \
            --module github.com/acme/scratch \
            --kind ${{ matrix.kind }} \
            --db ${{ matrix.db }} \
            --dir /tmp/scratch-${{ matrix.name }} \
            --template-dir ${{ matrix.name }}

      - name: Generate kitex-client RPC dependencies
        if: matrix.name == 'admin-bff-hertz'
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: |
          ncgo add kitex-client authority --idl idl/rbac.proto --service RBACService
          ncgo add kitex-client auth --idl idl/auth.proto --service AuthService
          ncgo add kitex-client rulecenter --idl idl/rule_center.proto --service RuleService

      - name: Build
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: go build ./...

      - name: Vet
        working-directory: /tmp/scratch-${{ matrix.name }}
        run: go vet ./...
