    func (f *fakeRoleRepo) Count(ctx context.Context) (int64, error) {{ "{" }} return int64(len(f.roles)), nil {{ "}" }}

    func (f *fakeRoleRepo) Save(ctx context.Context, r *role.Role) (*role.Role, error) {{ "{" }}
    	if r.ID == 0 {{ "{" }}
    		f.next++
    		r.ID = f.next
    	{{ "}" }}
    	f.roles[r.ID] = r
    	return r, nil
    {{ "}" }}

