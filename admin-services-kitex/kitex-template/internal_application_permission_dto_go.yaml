# ncgo exported template — internal/application/permission/dto.go
path: internal/application/permission/dto.go
update_behavior:
    type: skip
body: |
    package permsvc

    import "{{.Module}}/internal/domain/permission"

    // CreatePermissionInput is the command to create a permission.
    type CreatePermissionInput struct {{ "{" }}
    	Code        string
    	Type        string
    	Name        string
    	ParentID    int64
    	Path        string
    	Icon        string
    	RouteName   string
    	Redirect    string
    	KeepAlive   *bool
    	HideInMenu  *bool
    	IsExternal  *bool
    	Method      string
    	Sort        int32
    	Status      int
    	Description string
    {{ "}" }}

    // UpdatePermissionInput is the command to update a permission (all fields optional).
    type UpdatePermissionInput struct {{ "{" }}
    	ID          int64
    	Code        *string
    	Type        *string
    	Name        *string
    	ParentID    *int64
    	Path        *string
    	Icon        *string
    	RouteName   *string
    	Redirect    *string
    	KeepAlive   *bool
    	HideInMenu  *bool
    	IsExternal  *bool
    	Method      *string
    	Sort        *int32
    	Status      *int
    	Description *string
    {{ "}" }}

    // ListPermissionsFilter is the filter for listing permissions.
    type ListPermissionsFilter struct {{ "{" }}
    	Type     string
    	ParentID int64
    	Status   int
    	Page     int32
    	PageSize int32
    {{ "}" }}

    // ListPermissionsResult is a page of permissions plus the total count.
    type ListPermissionsResult struct {{ "{" }}
    	Permissions []*permission.Permission
    	Total       int32
    {{ "}" }}
