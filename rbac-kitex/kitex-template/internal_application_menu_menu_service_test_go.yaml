    {{ "}" }}

    func TestUserPermCodesUnion(t *testing.T) {{ "{" }}
    	users := &fakeUserRepo{{ "{" }}roles: map[int64][]*role.Role{{ "{" }}
    		1: {{ "{{" }}ID: 2, Code: "ops", Name: "Ops"{{ "}}" }},
    	{{ "}}" }}
    	roles := &fakeRoleRepo{{ "{" }}rolePerms: map[int64][]*permission.Permission{{ "{" }}
    		2: {{ "{{" }}Code: "user:create"{{ "}" }}, {{ "{" }}Code: "user:view"{{ "}}" }},
    	{{ "}}" }}
    	svc := New(&fakeMenuRepo{{ "{" }}{{ "}" }}, users, roles, &fakePermRepo{{ "{" }}{{ "}" }}, audit.NewMemoryWriter())

    	codes, err := svc.UserPermCodes(context.Background(), 1)
    	if err != nil {{ "{" }}
    		t.Fatalf("UserPermCodes: %v", err)
    	{{ "}" }}
    	if len(codes) != 2 {{ "{" }}
    		t.Fatalf("codes = %v, want 2 entries", codes)
    	{{ "}" }}
    	has := map[string]bool{{ "{" }}{{ "}" }}
    	for _, c := range codes {{ "{" }}
    		has[c] = true
    	{{ "}" }}
    	if !has["user:create"] || !has["user:view"] {{ "{" }}
    		t.Fatalf("codes = %v, want user:create + user:view", codes)
    	{{ "}" }}
    {{ "}" }}

    func TestUserPermCodesAdminSeesAll(t *testing.T) {{ "{" }}
    	users := &fakeUserRepo{{ "{" }}roles: map[int64][]*role.Role{{ "{" }}
    		1: {{ "{{" }}ID: 1, Code: AdminRoleCode, Name: "Admin"{{ "}}" }},
    	{{ "}}" }}
    	perms := &fakePermRepo{{ "{" }}perms: []*permission.Permission{{ "{{" }}Code: "a"{{ "}" }}, {{ "{" }}Code: "b"{{ "}}" }}{{ "}" }}
    	svc := New(&fakeMenuRepo{{ "{" }}{{ "}" }}, users, &fakeRoleRepo{{ "{" }}{{ "}" }}, perms, audit.NewMemoryWriter())

    	codes, err := svc.UserPermCodes(context.Background(), 1)
    	if err != nil {{ "{" }}
    		t.Fatalf("UserPermCodes: %v", err)
    	{{ "}" }}
    	if len(codes) != 2 {{ "{" }}
    		t.Fatalf("codes = %v, want all 2", codes)
    	{{ "}" }}
    {{ "}" }}

    func TestUserMenuTreeFiltersByPermCodes(t *testing.T) {{ "{" }}
    	menus := &fakeMenuRepo{{ "{" }}menus: []*menu.Menu{{ "{" }}
    		{{ "{" }}ID: 1, ParentID: 0, Name: "user list", PermCode: "user:view", SortOrder: 0{{ "}" }},
    		{{ "{" }}ID: 2, ParentID: 0, Name: "role list", PermCode: "role:view", SortOrder: 0{{ "}" }},
    	{{ "}}" }}
    	users := &fakeUserRepo{{ "{" }}roles: map[int64][]*role.Role{{ "{" }}
    		1: {{ "{{" }}ID: 2, Code: "ops", Name: "Ops"{{ "}}" }},
    	{{ "}}" }}
    	roles := &fakeRoleRepo{{ "{" }}rolePerms: map[int64][]*permission.Permission{{ "{" }}
    		2: {{ "{{" }}Code: "user:view"{{ "}}" }},
    	{{ "}}" }}
    	svc := New(menus, users, roles, &fakePermRepo{{ "{" }}{{ "}" }}, audit.NewMemoryWriter())

    	nodes, err := svc.UserMenuTree(context.Background(), 1)
    	if err != nil {{ "{" }}
